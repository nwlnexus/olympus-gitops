name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the details below to help us investigate.

  - type: input
    id: title
    attributes:
      label: Title
      description: A short summary of the bug
      placeholder: e.g. openmemory pod crashloops on add
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Affected component
      description: Where does this bug occur?
      options:
        - compute-hub (cluster)
        - data-hub (host services / Ollama)
        - QNAP storage
        - repo / CI
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: If applicable, add relevant logs, `kubectl`/`flux` output, or screenshots
    validations:
      required: false

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >-
        Observable conditions that make this finished, each with the check command and its expected result.
        A long task's /goal is copied from this field, so keep it checkable.
      placeholder: |
        - The steps to reproduce no longer trigger the bug.
        Check: `<command>` -> expected: <exact output or exit code>
    validations:
      required: true
