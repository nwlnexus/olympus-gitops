name: Task
description: Track a chore, refactor, or maintenance task
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for refactoring, dependency updates, infrastructure work, or documentation tasks.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this task needed?
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of task is this?
      options:
        - refactoring
        - dependency update
        - infrastructure
        - documentation
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files Involved
      description: List key files or directories affected by this task
      placeholder: |
        - clusters/olympus/<app>/...
    validations:
      required: false

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >-
        Observable conditions that make this finished, each with the check command and its expected result.
        A long task's /goal is copied from this field, so keep it checkable.
      placeholder: |
        - The change is merged and the old behaviour is gone.
        Check: `<command>` -> expected: <exact output or exit code>
    validations:
      required: true
