name: validate

# Offline-deterministic checks for the Flux manifests (olympus-sdk#576, HW17). The job id and name
# `validate` is the status check a ruleset requires. It runs on GitHub-hosted runners only: this
# repository is public, so pull requests from forks must never reach self-hosted runners.
#
# 1. yamllint (relaxed config in .yamllint.yaml) over clusters/ and .github/.
# 2. `kustomize build` of every directory holding a kustomization.yaml, piped into
#    `kubeconform -strict -ignore-missing-schemas`. Built-in kinds are checked against the Kubernetes
#    schemas; CRDs are checked against the datree CRDs-catalog when it has a schema and skipped
#    otherwise. Flux `Kustomization` CRs live in flux-kustomizations/<app>.yaml (not in files named
#    kustomization.yaml), so they are validated as resources of the root build instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  YAMLLINT_VERSION: 1.37.1
  PYYAML_VERSION: 6.0.2
  PROMETHEUS_VERSION: 3.15.0
  PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0

jobs:
  validate:
    name: validate
    # Explicitly GitHub-hosted (see the note at the top).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum --check --strict -
          tar -xzf kustomize.tgz -C "$RUNNER_TEMP/bin" kustomize
          curl -fsSL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check --strict -
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install yamllint
        run: python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"

      - name: yamllint
        run: python3 -m yamllint -c .yamllint.yaml clusters .github

      - name: promtool (check config, check rules, test rules)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dl"
          curl -fsSL -o prometheus.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum --check --strict -
          tar -xzf prometheus.tgz --strip-components=1 -C "$RUNNER_TEMP/bin" \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          python3 -m pip install --user "pyyaml==${PYYAML_VERSION}"
          promtool --version
          cd "$GITHUB_WORKSPACE"
          python3 clusters/olympus/observability/tests/check_prometheus.py

      # The CI egress proxy's squid.conf (olympus-sdk#407): a config squid rejects would crash-loop the proxy
      # pods and fail every job on the cluster runners, so parse it with the exact image the Deployment pins.
      - name: squid -k parse (ci-egress)
        run: |
          set -euo pipefail
          dir=clusters/olympus/ci-egress
          image=$(grep -oE 'docker\.io/ubuntu/squid@sha256:[0-9a-f]{64}' "$dir/deployment.yaml")
          conf="$RUNNER_TEMP/squid-egress"
          mkdir -p "$conf"
          python3 -c 'import sys, yaml; sys.stdout.write(yaml.safe_load(open(sys.argv[1]))["data"]["squid.conf"])' \
            "$dir/configmap.yaml" > "$conf/squid.conf"
          chmod -R a+rX "$conf"
          docker run --rm --network none -v "$conf:/etc/squid-egress:ro" \
            --entrypoint /usr/sbin/squid-gnutls "$image" -k parse -f /etc/squid-egress/squid.conf 2>&1 \
            | tee "$RUNNER_TEMP/squid-parse.log"
          # --network none: the container's own hostname cannot be reverse-resolved; that warning is about
          # the lint container, not the config.
          if grep -E 'FATAL|ERROR|WARNING' "$RUNNER_TEMP/squid-parse.log" \
            | grep -vE "rDNS test failed|Could not determine this machines public hostname"; then
            echo "::error title=squid.conf::squid -k parse reported errors or warnings (see above)"
            exit 1
          fi

      - name: kustomize build and kubeconform
        run: |
          set -euo pipefail
          kustomize version
          kubeconform -v
          schemas='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          failed=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            echo "::group::$dir"
            if ! kustomize build "$dir" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default -schema-location "$schemas"; then
              echo "::error title=validate failed::kustomize build or kubeconform failed for $dir"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find clusters -name kustomization.yaml | sort)
          exit "$failed"

  # The actuator's admission policy on a throwaway API server (olympus-sdk#964): tests/admission/run.sh
  # starts etcd and kube-apiserver from a pinned nixpkgs, applies the committed policy, RBAC and Flux CRDs,
  # and runs the allow/deny matrix as the actuator ServiceAccount. It runs when a change touches the
  # actuator files, the atlas-system namespace, the Flux CRDs, the test bed or this workflow. Otherwise it
  # passes without starting the servers, so a required check on it never waits on unrelated pull requests.
  admission:
    name: admission
    # GitHub-hosted, like validate (see the note at the top).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 is the base: the PR merge commit's first parent, or the parent of a squash merge on main.
          fetch-depth: 2

      - name: Check whether the change touches the admission test inputs
        id: changes
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify HEAD^1 >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pattern='^(clusters/olympus/atlas-system/(actuator-.*|namespace\.yaml)|clusters/olympus/flux-system/gotk-components\.yaml|tests/admission/.*|\.github/workflows/validate\.yml)$'
          if git diff --name-only HEAD^1 HEAD | grep -E "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No admission test inputs changed; skipping the test bed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: tests/admission/run.sh
        if: steps.changes.outputs.run == 'true'
        run: tests/admission/run.sh
