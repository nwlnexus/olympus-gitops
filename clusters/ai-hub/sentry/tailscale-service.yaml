# Internal-only Sentry access over tailnet for cross-cluster otel exporters.
# No tailscale.com/funnel annotation => reachable only inside raptor-mimosa.ts.net.
# Selector copied from sentry-web Service (app: sentry, role: web).
apiVersion: v1
kind: Service
metadata:
  name: sentry-ts
  namespace: sentry
  annotations:
    tailscale.com/hostname: "sentry-ai-hub"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: sentry
    role: web
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
