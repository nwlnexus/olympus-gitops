apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentry-integrations-env
  namespace: sentry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # Consumed by the sentry-configure-options Job (envFrom) to set the
  # github-app.* options in the DB store. Keys MUST be valid env var names.
  # GitHub org integration — 1Password item olympus-sentry-github-app.
  # (Google SSO removed: Sentry's google provider is Workspace-only / blocks
  # gmail.com, so it can't authenticate this account.)
  target:
    name: sentry-integrations-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: olympus-sentry-github-app
        property: gh-app-id
    - secretKey: GITHUB_APP_NAME
      remoteRef:
        key: olympus-sentry-github-app
        property: gh-app-slug
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: olympus-sentry-github-app
        property: gh-client-id
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: olympus-sentry-github-app
        property: gh-client-secret
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: olympus-sentry-github-app
        property: webhook-secret
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: olympus-sentry-github-app
        property: gh-private-key
