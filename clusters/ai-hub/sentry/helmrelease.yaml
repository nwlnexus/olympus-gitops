apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sentry
  namespace: sentry
spec:
  interval: 1h
  # Inject the integrations secret (Google SSO + GitHub App creds) as envFrom
  # into the web pod AND the taskworkers — Google login runs in web, but GitHub
  # webhook/commit tasks run in workers, which the chart does NOT expose an
  # existingSecretEnv hook for. Targeted by name so the snuba deployments (which
  # have their own envFrom: sentry-snuba-env) are never touched.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: "sentry-(web|launchpad-taskworker|taskworker-(default|ingest|long|products))"
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/envFrom
                value:
                  - secretRef:
                      name: sentry-integrations-env
  chart:
    spec:
      chart: sentry
      version: "31.7.0"
      sourceRef:
        kind: HelmRepository
        name: sentry
        namespace: sentry
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: sentry-secrets
      valuesKey: system-secret-key
      targetPath: sentry.systemSecretKey
    - kind: Secret
      name: sentry-secrets
      valuesKey: postgres-password
      targetPath: externalPostgresql.password
    - kind: Secret
      name: sentry-secrets
      valuesKey: clickhouse-password
      targetPath: externalClickhouse.password
    - kind: Secret
      name: sentry-secrets
      valuesKey: smtp-password
      targetPath: mail.password
    - kind: Secret
      name: sentry-secrets
      valuesKey: admin-username
      targetPath: user.email
    - kind: Secret
      name: sentry-secrets
      valuesKey: admin-password
      targetPath: user.password
  values:
    postgresql:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false
    clickhouse:
      enabled: false
    externalPostgresql:
      host: postgresql.platform.svc.cluster.local
      port: 5432
      username: postgres
      database: sentry
    externalRedis:
      host: redis-master.platform.svc.cluster.local
      port: 6379
      existingSecret: sentry-secrets
      existingSecretKey: redis-password
    externalKafka:
      host: kafka.platform.svc.cluster.local
      port: 9092
    externalClickhouse:
      host: clickhouse.platform.svc.cluster.local
      httpPort: 8123
      tcpPort: 9000
      username: default
      clusterName: sentry-clickhouse
    nginx:
      enabled: false
    mail:
      # backend defaults to "dummy" in the chart (silently discards mail) — must
      # be "smtp" to actually send. The chart templates these values into
      # sentry.conf.py as the os.getenv() defaults for SENTRY_EMAIL_*.
      backend: smtp
      host: smtp.resend.com
      # Resend SMTP: 465 (implicit TLS/SSL). Both 465+SSL and 587+STARTTLS
      # authenticate fine with the API key; using 465 per Resend guidance.
      port: 465
      username: resend
      useTls: false
      useSsl: true
      # Must be a Resend-verified sending domain. The verified entry is the
      # subdomain mail.nwlnexus.net (NOT the apex nwlnexus.net, nor nwlnexus.io)
      # — confirmed by probing which from-address Resend's SMTP accepts.
      from: sentry@mail.nwlnexus.net
    user:
      create: true
      superuser: true
      # email and password injected via valuesFrom (user.email, user.password)
    # Canonical external URL — sets system.url-prefix in config.yml. Required so
    # Sentry knows it is served at https://sentry.nwlnexus.net behind the
    # Cloudflare → Traefik proxy chain (TLS terminated upstream).
    system:
      url: "https://sentry.nwlnexus.net"
    # Django settings appended verbatim to sentry.conf.py.
    #
    # NOTE: a previous attempt set these as sentry.web.env vars. That does NOT
    # work — Sentry's settings file does not read CSRF_TRUSTED_ORIGINS /
    # SECURE_PROXY_SSL_HEADER from the environment, so the CSRF check kept
    # failing ("Origin checking failed — https://sentry.nwlnexus.net does not
    # match any trusted origins"). They must be real Python settings, which is
    # what config.sentryConfPy injects.
    config:
      sentryConfPy: |
        CSRF_TRUSTED_ORIGINS = ["https://sentry.nwlnexus.net"]
        SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
        USE_X_FORWARDED_HOST = True

        # Non-browser clients (Sentry SDKs, OTel collector) POST to /api/<id>/envelope/
        # without Origin/Referer/CSRF-token. Django CSRF rejects them, but these
        # endpoints have their own auth (X-Sentry-Auth / Bearer / DSN public key).
        # Monkey-patch CsrfViewMiddleware to skip /api/* — the safest place to inject
        # since sentryConfPy can't reorder Sentry's MIDDLEWARE tuple cleanly.
        from django.middleware.csrf import CsrfViewMiddleware as _CsrfMW
        _orig_csrf_process_view = _CsrfMW.process_view
        def _csrf_skip_api(self, request, callback, cb_args, cb_kwargs):
            if request.path.startswith("/api/"):
                return None
            return _orig_csrf_process_view(self, request, callback, cb_args, cb_kwargs)
        _CsrfMW.process_view = _csrf_skip_api

        # Integrations creds come from the sentry-integrations-env secret
        # (ExternalSecret ← 1Password) injected as envFrom via the HelmRelease
        # postRenderers (web + taskworkers).
        import os as _os

        # Google SSO. The OAuth client's Authorized redirect URIs MUST include
        # https://sentry.nwlnexus.net/auth/sso/ for login to complete.
        SENTRY_OPTIONS['auth-google.client-id'] = _os.getenv('GOOGLE_CLIENT_ID', '')
        SENTRY_OPTIONS['auth-google.client-secret'] = _os.getenv('GOOGLE_CLIENT_SECRET', '')

        # GitHub org integration (GitHub App "olympus-sentry"). private-key is a
        # multiline PEM; the .replace is a no-op for real newlines but rescues a
        # value that arrived with literal \n.
        _gh_id = _os.getenv('GITHUB_APP_ID', '')
        if _gh_id:
            SENTRY_OPTIONS['github-app.id'] = int(_gh_id)
        SENTRY_OPTIONS['github-app.name'] = _os.getenv('GITHUB_APP_NAME', '')
        SENTRY_OPTIONS['github-app.client-id'] = _os.getenv('GITHUB_APP_CLIENT_ID', '')
        SENTRY_OPTIONS['github-app.client-secret'] = _os.getenv('GITHUB_APP_CLIENT_SECRET', '')
        SENTRY_OPTIONS['github-app.webhook-secret'] = _os.getenv('GITHUB_APP_WEBHOOK_SECRET', '')
        SENTRY_OPTIONS['github-app.private-key'] = _os.getenv('GITHUB_APP_PRIVATE_KEY', '').replace('\\n', '\n')
