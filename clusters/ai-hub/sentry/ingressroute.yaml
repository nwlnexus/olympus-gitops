apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sentry
  namespace: sentry
  annotations:
    external-dns.alpha.kubernetes.io/hostname: sentry.nwlnexus.net
    external-dns.alpha.kubernetes.io/target: ing.ai-hub.nwlnexus.net
spec:
  entryPoints:
    - websecure
  routes:
    # Higher-priority route: SPA entrypoints must never be cached by Cloudflare
    # (unversioned path, content changes every upgrade — see middleware.yaml).
    - match: Host(`sentry.nwlnexus.net`) && PathPrefix(`/_static/dist/sentry/entrypoints/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: sentry-entrypoints-nocache
      services:
        - name: sentry-web
          port: 9000
    # Ingestion endpoints (/api/<project_id>/...) must go to the Relay service,
    # not sentry-web. With nginx.enabled=false there is no in-cluster proxy to
    # split web vs. ingest traffic, so the IngressRoute must do it. Sending
    # /api/<id>/envelope|store|... to sentry-web makes web treat them as frontend
    # routes and 302-redirect to /settings/account/api/ (or 502 at the edge) —
    # events never get ingested. Relay listens on port 3000.
    #
    # The regex matches a NON-ZERO numeric project id: ^/api/[1-9][0-9]*/.
    # /api/0/... is the REST API consumed by the frontend (org/project/explore
    # calls) and MUST stay on sentry-web — it is explicitly excluded here.
    - match: Host(`sentry.nwlnexus.net`) && PathRegexp(`^/api/[1-9][0-9]*/`)
      kind: Rule
      priority: 90
      services:
        - name: sentry-relay
          port: 3000
    - match: Host(`sentry.nwlnexus.net`)
      kind: Rule
      services:
        - name: sentry-web
          port: 9000
  tls:
    secretName: sentry-tls
