apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentry-oauth-env
  namespace: sentry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # Rendered as envFrom on the web Deployment (sentry.web.existingSecretEnv).
  # Keys MUST be valid env var names — they become env vars verbatim and are
  # read by config.sentryConfPy via os.getenv().
  target:
    name: sentry-oauth-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-oauth-olympus
        property: client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: google-oauth-olympus
        property: client-secret
