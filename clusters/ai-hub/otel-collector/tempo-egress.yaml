# Tailscale egress proxy → obs-tempo on management-hub. ai-hub is Colima with no
# node-level tailscaled, so MagicDNS (*.raptor-mimosa.ts.net) doesn't resolve
# in-cluster. The tailscale operator runs a proxy pod (its own userspace
# tailscale) and exposes this in-cluster Service; the collector targets
# obs-tempo.otel.svc.cluster.local:4317 with no MagicDNS dependency.
apiVersion: v1
kind: Service
metadata:
  name: obs-tempo
  namespace: otel
  annotations:
    tailscale.com/tailnet-fqdn: obs-tempo.raptor-mimosa.ts.net
spec:
  type: ExternalName
  externalName: placeholder  # overwritten by the tailscale operator with the egress proxy
