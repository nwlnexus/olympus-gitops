apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  # Delete-reclaim variant of qnap-iscsi for ephemeral / churn-prone workloads
  # (e.g. brokers, caches, scratch). When the PVC is deleted, Trident removes
  # the backing QNAP LUN/target automatically — no manual tridentctl cleanup.
  # Keep stateful databases on the default `qnap-iscsi` (Retain) class instead.
  name: qnap-iscsi-delete
provisioner: csi.trident.qnap.io
parameters:
  selector: "location=ai-hub"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
