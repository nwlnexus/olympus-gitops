apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch-ui
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO PVC — avoid two pods contending for /app/data
  selector:
    matchLabels:
      app: ch-ui
  template:
    metadata:
      labels:
        app: ch-ui
    spec:
      containers:
        - name: ch-ui
          image: ghcr.io/caioricciuti/ch-ui:v2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3488
              name: http
          env:
            # Bootstraps the embedded "ai-hub ClickHouse" connection target.
            # ClickHouse `default` requires a password; enter it once via the
            # ch-ui admin panel on first login (persisted in the PVC sqlite db).
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.platform.svc.cluster.local:8123"
            - name: CONNECTION_NAME
              value: "ai-hub ClickHouse"
            - name: APP_URL
              value: "https://chui.nwlnexus.io"
            - name: DATABASE_PATH
              value: "/app/data/ch-ui.db"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 3488
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3488
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ch-ui-data
---
apiVersion: v1
kind: Service
metadata:
  name: ch-ui
  namespace: platform
spec:
  selector:
    app: ch-ui
  ports:
    - port: 3488
      targetPort: 3488
      name: http
