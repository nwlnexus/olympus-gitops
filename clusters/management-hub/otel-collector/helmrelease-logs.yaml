apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-logs
  namespace: otel
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: otel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset
    fullnameOverride: otel-logs
    image:
      repository: otel/opentelemetry-collector-contrib
    # filelog over /var/log/pods + k8s metadata enrichment, both via presets.
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      kubernetesAttributes:
        enabled: true
    # Log agent: no OTLP/trace ingress server; disable all listener ports.
    ports:
      otlp: { enabled: false }
      otlp-http: { enabled: false }
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics: { enabled: false }
    config:
      receivers:
        jaeger: null
        prometheus: null
        zipkin: null
        otlp: null
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          timeout: 5s
          send_batch_size: 1024
        # k8s.cluster.name IS promoted to a Loki label (=> k8s_cluster_name).
        resource:
          attributes:
            - key: k8s.cluster.name
              value: management-hub
              action: upsert
      exporters:
        # Loki 3.x native OTLP ingest. logs_endpoint is the exact URL (no path append).
        otlphttp/loki:
          logs_endpoint: http://loki.observability.svc.cluster.local:3100/otlp/v1/logs
      service:
        telemetry:
          metrics:
            level: none
        pipelines:
          traces: null
          metrics: null
          logs:
            receivers: [filelog]
            processors: [memory_limiter, k8sattributes, resource, batch]
            exporters: [otlphttp/loki]
