apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepassword:
      # 1Password Connect now runs on Fly (olympus-op-connect.fly.dev), served at
      # connect.nwlnexus.net over HTTPS. Repointed off the in-cluster pod so the
      # in-cluster Connect can be retired.
      connectHost: https://connect.nwlnexus.net
      vaults:
        Dev: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: eso-op-connect-token
            namespace: external-secrets
            key: token
