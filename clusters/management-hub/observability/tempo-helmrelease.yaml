apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  # S3 credentials injected from the obs-s3 ESO secret (kept out of Git).
  valuesFrom:
    - kind: Secret
      name: obs-s3
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: tempo.storage.trace.s3.access_key
    - kind: Secret
      name: obs-s3
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: tempo.storage.trace.s3.secret_key
  values:
    tempo:
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo
            endpoint: 192.168.253.10:8010
            forcepathstyle: true
            insecure: false              # HTTPS endpoint
            tls_insecure_skip_verify: true  # QNAP S3 self-signed cert
      # OTLP receivers for the per-cluster collectors (Phase 4/5 gateway → Tempo).
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      retention: 168h   # 7d of traces
    persistence:
      enabled: true
      storageClassName: qnap-iscsi
      size: 10Gi
