apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "29.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Central metrics store: receives remote-write from per-cluster agents over
    # the tailnet AND scrapes management-hub's own targets.
    server:
      retention: "30d"
      persistentVolume:
        enabled: true
        storageClass: qnap-iscsi
        size: 50Gi
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Alertmanager wired with Resend email in Phase 7.
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true
