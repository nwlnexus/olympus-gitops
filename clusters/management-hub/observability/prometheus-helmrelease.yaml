apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "29.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Central metrics store: receives remote-write from per-cluster agents over
    # the tailnet AND scrapes management-hub's own targets.
    server:
      retention: "30d"
      persistentVolume:
        enabled: true
        storageClass: qnap-iscsi
        size: 50Gi
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Alertmanager wired with Resend email in Phase 7.
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    # Scrape the local Traefik metrics Service; stamp cluster=management-hub so the
    # Traefik dashboard can distinguish clusters (remote clusters set this via the
    # otel prometheusremotewrite relabel — see Phase M3).
    extraScrapeConfigs: |
      - job_name: traefik
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [traefik]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: traefik-metrics
          - target_label: cluster
            replacement: management-hub
