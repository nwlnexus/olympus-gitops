apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: obs-s3
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # QNAP S3 (endpoint https://192.168.253.10:8010, buckets loki/tempo).
  # Keys are standard AWS env var names so Loki/Tempo + the S3 SDK pick them up.
  target:
    name: obs-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  # NOTE: ESO matches 1Password fields by LABEL, not id. In olympus-obs-stack
  # the access key lives in the field labeled `new_username` and the secret in
  # `uc_pwd1` (the built-in username/password fields carry those odd labels).
  # If you relabel them in 1Password, update these property values to match.
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: olympus-obs-stack
        property: new_username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: olympus-obs-stack
        property: uc_pwd1
