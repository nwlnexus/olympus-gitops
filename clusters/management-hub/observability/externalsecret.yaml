apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: obs-s3
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # QNAP S3 (endpoint https://192.168.253.10:8010, buckets loki/tempo).
  # Keys are standard AWS env var names so Loki/Tempo + the S3 SDK pick them up.
  target:
    name: obs-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: olympus-obs-stack
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: olympus-obs-stack
        property: password
