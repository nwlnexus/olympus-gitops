apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-resend
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # Reuses the same 1Password `resend` item Sentry uses. Mounted into the
  # Alertmanager pod as /etc/alertmanager/secrets/api_key (smtp_auth_password_file).
  target:
    name: alertmanager-resend
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: resend
        property: api_key
