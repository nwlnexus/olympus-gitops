apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: nfs-provisioner
spec:
  interval: 1h
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18"
      sourceRef:
        kind: HelmRepository
        name: nfs-provisioner
        namespace: nfs-provisioner
  values:
    nfs:
      server: qnap.nwlnexus.net
      path: /olympus-nfs-data
    storageClass:
      name: qnap-nfs
      reclaimPolicy: Delete
      defaultClass: false
      archiveOnDelete: false
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 48Mi
