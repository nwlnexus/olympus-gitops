# Pulls the Hermes publish token into the Secret the Deployment reads (HERMES_PUBLISH_TOKEN).
#
# Source: 1Password item `ingress-discovery` (vault Dev), field `hermes-publish-token`. The item
# keeps the name it had before the agent was renamed (olympus-sdk#919); only the token in it is
# replaced, with a cluster-bound token. See README.md ("Token").
#
# This repo's 1Password *Connect* provider addresses secrets by item name (`key`) + field name
# (`property`), NOT op:// URIs. The ClusterSecretStore `onepassword-connect` exposes only vault Dev.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-cluster-agent-credentials
  namespace: atlas-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: atlas-cluster-agent-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: hermes-publish-token
      remoteRef:
        key: ingress-discovery
        property: hermes-publish-token
