# Credentials of the cluster actuator (olympus-sdk#922): its Hermes token and this cluster's id.
#
# Source: 1Password item `atlas-cluster-actuator` (vault Dev), fields `hermes-actuator-token` (a
# cluster-bound token holding only `cluster:actuate`) and `cluster-id` (the id Hermes signs into
# every command frame; kept out of this public repo). Same ClusterSecretStore as the agent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-cluster-actuator-credentials
  namespace: atlas-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: atlas-cluster-actuator-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: hermes-actuator-token
      remoteRef:
        key: atlas-cluster-actuator
        property: hermes-actuator-token
    - secretKey: cluster-id
      remoteRef:
        key: atlas-cluster-actuator
        property: cluster-id
