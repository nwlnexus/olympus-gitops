# Network rules for the k8s-mcp pods (olympus-sdk#916). The namespace is default-deny
# (networkpolicy.yaml); NetworkPolicies are additive, so these only open what is listed.
#
#   ingress  the proxy port (8080) from the cloudflared pods only (ns cloudflared,
#            ../cloudflared/deployment.yaml), the same selector as the memory gateway's public path.
#            kube-proxy DNATs Service port 80 to the pod's 8080 before the policy is evaluated, so the
#            rule names the container port. Kubelet probes come from the node and are not subject to
#            NetworkPolicy on k3s.
#   egress   DNS via CoreDNS; the Kubernetes API server (the server container, in-cluster config at
#            https://kubernetes.default.svc); TCP 443 to Cloudflare's published IPv4 ranges only (the
#            proxy fetches the Access signing keys from https://<team>.cloudflareaccess.com/cdn-cgi/access/certs),
#            the same list as the memory gateway (../memory/gateway/networkpolicy.yaml, olympus-sdk#932).
#            NetworkPolicy cannot match a host name (k3s' kube-router has no FQDN policy), so the rule is the
#            ranges the team domain is served from: list from https://api.cloudflare.com/client/v4/ips
#            (etag 38f79d050aa027e3be3865e495dcc9bc, unchanged since 2026-11-04). If a range is ever added
#            and the JWKS moves into it, calls answer 503 (fail closed) until both lists are updated.
#            The cluster is IPv4-only, so there is no IPv6 rule. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8s-mcp-ingress
  namespace: atlas-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8s-mcp-egress
  namespace: atlas-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-mcp
  policyTypes:
    - Egress
  egress:
    # DNS via CoreDNS only (the kube-dns Service DNATs to these pods).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server: the same block as the cluster agent (networkpolicy.yaml). kube-proxy
    # DNATs 10.43.0.1:443 to the API servers' :6443 before the policy is evaluated, so the node
    # endpoints are what matters; the VIP and the Service IP are listed too.
    - to:
        - ipBlock:
            cidr: 192.168.253.7/32   # onode-030c31
        - ipBlock:
            cidr: 192.168.253.8/32   # onode-0312ce
        - ipBlock:
            cidr: 192.168.253.9/32   # onode-0314ac
        - ipBlock:
            cidr: 192.168.253.11/32  # onode-0636e4
        - ipBlock:
            cidr: 192.168.253.12/32  # onode-062caa
        - ipBlock:
            cidr: 192.168.253.2/32   # kube-vip control-plane VIP
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32       # kubernetes.default Service
      ports:
        - protocol: TCP
          port: 443
    # Access JWKS over HTTPS: Cloudflare's published IPv4 ranges (see the header).
    - to:
        - ipBlock: {cidr: 173.245.48.0/20}
        - ipBlock: {cidr: 103.21.244.0/22}
        - ipBlock: {cidr: 103.22.200.0/22}
        - ipBlock: {cidr: 103.31.4.0/22}
        - ipBlock: {cidr: 141.101.64.0/18}
        - ipBlock: {cidr: 108.162.192.0/18}
        - ipBlock: {cidr: 190.93.240.0/20}
        - ipBlock: {cidr: 188.114.96.0/20}
        - ipBlock: {cidr: 197.234.240.0/22}
        - ipBlock: {cidr: 198.41.128.0/17}
        - ipBlock: {cidr: 162.158.0.0/15}
        - ipBlock: {cidr: 104.16.0.0/13}
        - ipBlock: {cidr: 104.24.0.0/14}
        - ipBlock: {cidr: 172.64.0.0/13}
        - ipBlock: {cidr: 131.0.72.0/22}
      ports:
        - protocol: TCP
          port: 443
