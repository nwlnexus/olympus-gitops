# Admission policy for the atlas cluster actuator (olympus-sdk#922). The third layer after the signed,
# closed command set (checked in Hermes and again in the actuator) and RBAC (actuator-rbac.yaml): it bounds
# what this one identity can change even if its token or pod is compromised.
#
# Matched only for user system:serviceaccount:atlas-system:atlas-cluster-actuator (matchConditions), on the
# five kinds its ClusterRole names, main resource and every subresource. For that identity it:
#   - denies CREATE, DELETE and any write to a subresource (scale, status): only UPDATE of the main
#     resource (a merge patch arrives as an UPDATE) is admitted;
#   - denies every write to a Deployment, StatefulSet or DaemonSet in kube-system, flux-system or
#     atlas-system, so it can never restart itself, Flux or the cluster's system workloads. Flux objects
#     are not namespace-restricted: the Kustomizations live in flux-system;
#   - admits an UPDATE only if the new object equals the old one everywhere except
#       Flux kinds:     metadata.annotations["reconcile.fluxcd.io/requestedAt"]  (flux-reconcile)
#                       spec.suspend                                             (flux-suspend/-resume)
#       workload kinds: spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"] (rollout-restart)
#     The allowed annotation may be added or changed, never removed; no other annotation may change.
#   - denies spec.suspend becoming true on the root Kustomizations flux-system/flux-system and
#     flux-system/atlas-system (olympus-sdk#956): suspending either would freeze GitOps and the gitops kill
#     switch. Hermes and the actuator refuse it too (refused_target); reconcile and resume stay allowed;
#   - bounds metadata.managedFields (olympus-sdk#956): an entry of another field manager may only lose the
#     actuator's own field (the API server transfers that field to the actuator on its patch: a requestedAt
#     set by `flux reconcile` belongs to manager `flux` until then), and the actuator's own entry may only
#     hold its fields. So no new manager, no forged or altered entry of another manager (e.g.
#     kustomize-controller), no field added to the actuator's entry beyond its own.
#
# Ignored in the field comparison because the API server itself changes them on every update, so they
# differ between oldObject and object for any legitimate patch: metadata.managedFields (checked by its own
# rule above), metadata.resourceVersion, metadata.generation (bumped when spec changes) and status (reset
# to the stored status on a main-resource update; status is only writable through the status subresource,
# which is denied above).
#
# managedFields rule, precisely. Entries are matched across oldObject and object on every key but fieldsV1
# (manager, operation, apiVersion, subresource, time, fieldsType). For an entry of another manager the new
# fieldsV1 must equal the old one except that, along the actuator's field paths only, the actuator's leaf
# (f:reconcile.fluxcd.io/requestedAt, f:suspend, f:kubectl.kubernetes.io/restartedAt) and the "." node
# marker may be gone, and a node left empty may be gone; such an entry may vanish only when nothing else
# was in it. An unmatched new entry of another manager is denied. Every atlas-cluster-actuator entry must
# be an Update of the main resource whose fieldsV1 holds nothing but those paths. Accepted residual: the
# actuator may drop the "." marker of a node on its own paths from another manager's entry (an ownership
# mark of the map itself, not of a value).
#
# The comparisons iterate the keys of `object` and `oldObject` (dyn() makes them maps for CEL), so a field
# added in a future API version is covered without editing this file. failurePolicy Fail: if an expression
# cannot be evaluated, the request is denied. reason Forbidden: the API answers 403 (the default would be
# 422), which the actuator reports as `denied: <message>`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: atlas-cluster-actuator-fields
  labels:
    app.kubernetes.io/name: atlas-cluster-actuator
    app.kubernetes.io/part-of: atlas
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "deployments/*", "statefulsets", "statefulsets/*", "daemonsets", "daemonsets/*"]
      - apiGroups: ["kustomize.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["kustomizations", "kustomizations/*"]
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["helmreleases", "helmreleases/*"]
  matchConditions:
    - name: actuator-only
      expression: 'request.userInfo.username == "system:serviceaccount:atlas-system:atlas-cluster-actuator"'
  variables:
    - name: isWorkload
      expression: 'request.resource.group == "apps"'
    - name: refusedNamespaces
      expression: '["kube-system", "flux-system", "atlas-system"]'
    # An UPDATE of the main resource. request.subResource is absent (not "") when there is none.
    - name: isMainUpdate
      expression: 'request.operation == "UPDATE" && (!has(request.subResource) || request.subResource == "")'
    # Only read under isMainUpdate: object and oldObject are both set for an UPDATE.
    - name: newObj
      expression: 'dyn(object)'
    - name: oldObj
      expression: 'dyn(oldObject)'
    - name: newMeta
      expression: 'variables.newObj.metadata'
    - name: oldMeta
      expression: 'variables.oldObj.metadata'
    - name: annoNew
      expression: '"annotations" in variables.newMeta ? variables.newMeta.annotations : {}'
    - name: annoOld
      expression: '"annotations" in variables.oldMeta ? variables.oldMeta.annotations : {}'
    # The API server bumps this annotation itself when a DaemonSet's pod template changes (the
    # DaemonSet update strategy), so a restart of a DaemonSet carries it. Allowed on DaemonSets only,
    # and only as an increment of exactly 1 (validation dsGeneration below).
    - name: isDaemonSet
      expression: 'request.resource.resource == "daemonsets"'
    - name: dsGenKey
      expression: '"deprecated.daemonset.template.generation"'
    - name: allowedAnno
      expression: >-
        variables.isWorkload ? (variables.isDaemonSet ? [variables.dsGenKey] : []) :
        ["reconcile.fluxcd.io/requestedAt"]
    - name: specNew
      expression: '"spec" in variables.newObj ? variables.newObj.spec : {}'
    - name: specOld
      expression: '"spec" in variables.oldObj ? variables.oldObj.spec : {}'
    - name: tplNew
      expression: '"template" in variables.specNew ? variables.specNew.template : {}'
    - name: tplOld
      expression: '"template" in variables.specOld ? variables.specOld.template : {}'
    - name: tplMetaNew
      expression: '"metadata" in variables.tplNew ? variables.tplNew.metadata : {}'
    - name: tplMetaOld
      expression: '"metadata" in variables.tplOld ? variables.tplOld.metadata : {}'
    - name: tplAnnoNew
      expression: '"annotations" in variables.tplMetaNew ? variables.tplMetaNew.annotations : {}'
    - name: tplAnnoOld
      expression: '"annotations" in variables.tplMetaOld ? variables.tplMetaOld.annotations : {}'
    # The two root Kustomizations (olympus-sdk#956), by name.
    - name: isRootKustomization
      expression: >-
        request.resource.resource == "kustomizations" && request.namespace == "flux-system" &&
        request.name in ["flux-system", "atlas-system"]
    # managedFields (olympus-sdk#956). Entries are matched on every key but fieldsV1.
    - name: mfNew
      expression: '"managedFields" in variables.newMeta ? variables.newMeta.managedFields : []'
    - name: mfOld
      expression: '"managedFields" in variables.oldMeta ? variables.oldMeta.managedFields : []'
    # One {f: new fieldsV1, g: old fieldsV1} pair per entry to check; the managedFields rule requires each f
    # to be its g with only the actuator's paths removed. (1) every new entry of another manager against its
    # one old match (the rule requires exactly one); (2) every old entry of another manager against its new
    # match, or against {} when it is gone (the rule allows at most one); (3) every actuator entry against
    # {} (it may hold only the actuator's paths).
    - name: fieldsPairs
      expression: >-
        variables.mfNew.filter(e, e.manager != "atlas-cluster-actuator").map(e,
          {"f": dyn("fieldsV1" in e ? e.fieldsV1 : {}),
           "g": (variables.mfOld.filter(o, o.all(k, k == "fieldsV1" || (k in e && e[k] == o[k])) && e.all(k, k == "fieldsV1" || k in o)).map(o, dyn("fieldsV1" in o ? o.fieldsV1 : {})) + [dyn({})])[0]}) +
        variables.mfOld.filter(o, o.manager != "atlas-cluster-actuator").map(o,
          {"f": (variables.mfNew.filter(e, o.all(k, k == "fieldsV1" || (k in e && e[k] == o[k])) && e.all(k, k == "fieldsV1" || k in o)).map(e, dyn("fieldsV1" in e ? e.fieldsV1 : {})) + [dyn({})])[0],
           "g": dyn("fieldsV1" in o ? o.fieldsV1 : {})}) +
        variables.mfNew.filter(e, e.manager == "atlas-cluster-actuator").map(e,
          {"f": dyn({}), "g": dyn("fieldsV1" in e ? e.fieldsV1 : {})})
    # The same pairs one level down, along the actuator's paths only.
    - name: mfMeta
      expression: 'variables.fieldsPairs.map(p, {"f": dyn("f:metadata" in p.f ? p.f["f:metadata"] : {}), "g": dyn("f:metadata" in p.g ? p.g["f:metadata"] : {})})'
    - name: mfAnno
      expression: 'variables.mfMeta.map(p, {"f": dyn("f:annotations" in p.f ? p.f["f:annotations"] : {}), "g": dyn("f:annotations" in p.g ? p.g["f:annotations"] : {})})'
    - name: mfSpec
      expression: 'variables.fieldsPairs.map(p, {"f": dyn("f:spec" in p.f ? p.f["f:spec"] : {}), "g": dyn("f:spec" in p.g ? p.g["f:spec"] : {})})'
    - name: mfTpl
      expression: 'variables.mfSpec.map(p, {"f": dyn("f:template" in p.f ? p.f["f:template"] : {}), "g": dyn("f:template" in p.g ? p.g["f:template"] : {})})'
    - name: mfTplMeta
      expression: 'variables.mfTpl.map(p, {"f": dyn("f:metadata" in p.f ? p.f["f:metadata"] : {}), "g": dyn("f:metadata" in p.g ? p.g["f:metadata"] : {})})'
    - name: mfTplAnno
      expression: 'variables.mfTplMeta.map(p, {"f": dyn("f:annotations" in p.f ? p.f["f:annotations"] : {}), "g": dyn("f:annotations" in p.g ? p.g["f:annotations"] : {})})'
  validations:
    # A DaemonSet's template generation may only move up by one (set by the API server on a restart).
    - expression: >-
        !variables.isMainUpdate || !variables.isDaemonSet ||
        !(variables.dsGenKey in variables.annoNew) ||
        ((variables.dsGenKey in variables.annoOld) && variables.annoNew[variables.dsGenKey] == variables.annoOld[variables.dsGenKey]) ||
        ((variables.dsGenKey in variables.annoOld) &&
         int(variables.annoNew[variables.dsGenKey]) == int(variables.annoOld[variables.dsGenKey]) + 1)
      reason: Forbidden
      message: "atlas-cluster-actuator may only see deprecated.daemonset.template.generation increase by one"
    - expression: 'variables.isMainUpdate'
      reason: Forbidden
      message: "atlas-cluster-actuator may only update (patch) the main resource: no create, delete or subresource writes"
    - expression: '!variables.isWorkload || !(request.namespace in variables.refusedNamespaces)'
      reason: Forbidden
      message: "atlas-cluster-actuator may not change workloads in kube-system, flux-system or atlas-system"
    # Top level: everything but metadata, spec and status is unchanged.
    - expression: >-
        !variables.isMainUpdate ||
        (variables.newObj.all(k, k in ["metadata", "spec", "status"] || (k in variables.oldObj && variables.newObj[k] == variables.oldObj[k])) &&
         variables.oldObj.all(k, k in ["metadata", "spec", "status"] || k in variables.newObj))
      reason: Forbidden
      message: "atlas-cluster-actuator may not change top-level fields"
    # metadata: unchanged except the server-maintained fields and, on Flux kinds, the requestedAt annotation.
    - expression: >-
        !variables.isMainUpdate ||
        (variables.newMeta.all(k, k in ["managedFields", "resourceVersion", "generation", "annotations"] || (k in variables.oldMeta && variables.newMeta[k] == variables.oldMeta[k])) &&
         variables.oldMeta.all(k, k in ["managedFields", "resourceVersion", "generation", "annotations"] || k in variables.newMeta) &&
         variables.annoNew.all(k, k in variables.allowedAnno || (k in variables.annoOld && variables.annoNew[k] == variables.annoOld[k])) &&
         variables.annoOld.all(k, k in variables.annoNew))
      reason: Forbidden
      message: "atlas-cluster-actuator may only set metadata.annotations[reconcile.fluxcd.io/requestedAt], on Flux objects"
    # Flux spec: unchanged except spec.suspend.
    - expression: >-
        !variables.isMainUpdate || variables.isWorkload ||
        (variables.specNew.all(k, k == "suspend" || (k in variables.specOld && variables.specNew[k] == variables.specOld[k])) &&
         variables.specOld.all(k, k == "suspend" || k in variables.specNew))
      reason: Forbidden
      message: "atlas-cluster-actuator may only set spec.suspend on Flux objects"
    # Workload spec: unchanged except spec.template.metadata.annotations[kubectl.kubernetes.io/restartedAt].
    - expression: >-
        !variables.isMainUpdate || !variables.isWorkload ||
        (variables.specNew.all(k, k == "template" || (k in variables.specOld && variables.specNew[k] == variables.specOld[k])) &&
         variables.specOld.all(k, k == "template" || k in variables.specNew) &&
         variables.tplNew.all(k, k == "metadata" || (k in variables.tplOld && variables.tplNew[k] == variables.tplOld[k])) &&
         variables.tplOld.all(k, k == "metadata" || k in variables.tplNew) &&
         variables.tplMetaNew.all(k, k == "annotations" || (k in variables.tplMetaOld && variables.tplMetaNew[k] == variables.tplMetaOld[k])) &&
         variables.tplMetaOld.all(k, k == "annotations" || k in variables.tplMetaNew) &&
         variables.tplAnnoNew.all(k, k == "kubectl.kubernetes.io/restartedAt" || (k in variables.tplAnnoOld && variables.tplAnnoNew[k] == variables.tplAnnoOld[k])) &&
         variables.tplAnnoOld.all(k, k in variables.tplAnnoNew))
      reason: Forbidden
      message: "atlas-cluster-actuator may only set spec.template.metadata.annotations[kubectl.kubernetes.io/restartedAt] on workloads"
    # Root Kustomizations: spec.suspend may not become true (olympus-sdk#956). Already true stays admitted, so
    # a reconcile or resume of a suspended root still works.
    - expression: >-
        !variables.isMainUpdate || !variables.isRootKustomization ||
        !("suspend" in variables.specNew && variables.specNew.suspend == true) ||
        ("suspend" in variables.specOld && variables.specOld.suspend == true)
      reason: Forbidden
      message: "atlas-cluster-actuator may not suspend the root Kustomizations flux-system/flux-system and flux-system/atlas-system"
    # managedFields (olympus-sdk#956): each new entry of another manager matches exactly one old entry and each
    # old one at most one new entry (on every key but fieldsV1); every actuator entry is an Update of the
    # main resource; and on every level of the actuator's paths each pair's new node equals its old node but
    # for the dropped keys named there (see the header).
    - expression: >-
        !variables.isMainUpdate ||
        (variables.mfNew.all(e, e.manager == "atlas-cluster-actuator" ||
            variables.mfOld.exists_one(o, o.all(k, k == "fieldsV1" || (k in e && e[k] == o[k])) && e.all(k, k == "fieldsV1" || k in o))) &&
         variables.mfOld.all(o, o.manager == "atlas-cluster-actuator" ||
            !variables.mfNew.exists(e, o.all(k, k == "fieldsV1" || (k in e && e[k] == o[k])) && e.all(k, k == "fieldsV1" || k in o)) ||
            variables.mfNew.exists_one(e, o.all(k, k == "fieldsV1" || (k in e && e[k] == o[k])) && e.all(k, k == "fieldsV1" || k in o))) &&
         variables.mfNew.all(e, e.manager != "atlas-cluster-actuator" ||
            (e.operation == "Update" && (!("subresource" in e) || e.subresource == ""))) &&
         (variables.isWorkload
          ? (variables.fieldsPairs.all(p, p.f.all(k, k in p.g && (k in ["f:spec"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:spec"])) &&
            variables.mfSpec.all(p, p.f.all(k, k in p.g && (k in ["f:template"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:template", "."])) &&
            variables.mfTpl.all(p, p.f.all(k, k in p.g && (k in ["f:metadata"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:metadata", "."])) &&
            variables.mfTplMeta.all(p, p.f.all(k, k in p.g && (k in ["f:annotations"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:annotations", "."])) &&
            variables.mfTplAnno.all(p, p.f.all(k, k in p.g && p.f[k] == p.g[k]) && p.g.all(k, k in p.f || k in [".", "f:kubectl.kubernetes.io/restartedAt"])))
          : (variables.fieldsPairs.all(p, p.f.all(k, k in p.g && (k in ["f:metadata", "f:spec"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:metadata", "f:spec"])) &&
            variables.mfMeta.all(p, p.f.all(k, k in p.g && (k in ["f:annotations"] || p.f[k] == p.g[k])) && p.g.all(k, k in p.f || k in ["f:annotations", "."])) &&
            variables.mfAnno.all(p, p.f.all(k, k in p.g && p.f[k] == p.g[k]) && p.g.all(k, k in p.f || k in [".", "f:reconcile.fluxcd.io/requestedAt"])) &&
            variables.mfSpec.all(p, p.f.all(k, k in p.g && p.f[k] == p.g[k]) && p.g.all(k, k in p.f || k in [".", "f:suspend"])))))
      reason: Forbidden
      message: "atlas-cluster-actuator may not add or change metadata.managedFields entries beyond its own fields"
---
# Enforce (Deny) for every namespace. No paramKind, no matchResources: the policy's own matchConstraints
# and matchConditions scope it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: atlas-cluster-actuator-fields
  labels:
    app.kubernetes.io/name: atlas-cluster-actuator
    app.kubernetes.io/part-of: atlas
spec:
  policyName: atlas-cluster-actuator-fields
  validationActions: ["Deny"]
