apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - externalsecret.yaml
  - ghcr-pull-externalsecret.yaml
  - deployment.yaml
  # Read-only Kubernetes MCP backend (olympus-sdk#916).
  - k8s-mcp-rbac.yaml
  - k8s-mcp-configmap.yaml
  - k8s-mcp-deployment.yaml
  - k8s-mcp-service.yaml
  - k8s-mcp-networkpolicy.yaml
  # Cluster actuator identity, RBAC, replay set, admission policy and egress (olympus-sdk#922).
  # The Deployment and its ExternalSecret come in a later change.
  - actuator-rbac.yaml
  - actuator-configmaps.yaml
  - actuator-admission.yaml
  - actuator-networkpolicy.yaml
