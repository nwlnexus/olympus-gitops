apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  ts.net.server: |
    raptor-mimosa.ts.net:53 {
        errors
        cache 30
        forward . 100.100.100.100
    }
  data-services.server: |
    # Resolves 'ai-hub' short-name → Tailscale IP so cluster pods can reach
    # native data services (PostgreSQL, Redis, ClickHouse, Ollama).
    # PostgreSQL binds to 100.95.232.41 (Tailscale); pg_hba allows 100.64.0.0/10.
    ai-hub:53 {
        errors
        hosts {
            100.95.232.41 ai-hub
            fallthrough
        }
        cache 30
    }
