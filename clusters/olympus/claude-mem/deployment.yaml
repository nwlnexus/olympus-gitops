apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-mem-server
  namespace: claude-mem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-mem-server
  template:
    metadata:
      labels:
        app: claude-mem-server
    spec:
      containers:
        - name: claude-mem-server
          image: ghcr.io/nwlnexus/claude-mem-server:claude-mem-13.7.1
          ports:
            - containerPort: 37877
          env:
            - name: CLAUDE_MEM_RUNTIME
              value: "server-beta"
            - name: CLAUDE_MEM_AUTH_MODE
              value: "api-key"
            - name: CLAUDE_MEM_QUEUE_ENGINE
              value: "bullmq"
            - name: CLAUDE_MEM_CHROMA_ENABLED
              value: "false"
            - name: CLAUDE_MEM_WORKER_PORT
              value: "37877"
            - name: CLAUDE_MEM_SERVER_BETA_PROJECT_ID
              value: "olympus"
            - name: CLAUDE_MEM_SERVER_BETA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claude-mem-credentials
                  key: api-key
            - name: CLAUDE_MEM_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claude-mem-credentials
                  key: database-url
            - name: CLAUDE_MEM_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claude-mem-credentials
                  key: redis-password
            # Redis URL uses Tailscale MagicDNS hostname. Requires cluster pods to resolve
            # and reach tailnet addresses (node-level tailscaled routing advertises pod CIDR
            # through the tailnet). ai-hub carries tag:data-hub per olympus-tailnet ACL.
            - name: CLAUDE_MEM_REDIS_URL
              value: "redis://:$(CLAUDE_MEM_REDIS_PASSWORD)@ai-hub.raptor-mimosa.ts.net:6379"
          # Probes connect to 127.0.0.1 directly — server binds to loopback only
          livenessProbe:
            httpGet:
              path: /health
              port: 37877
              host: "127.0.0.1"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 37877
              host: "127.0.0.1"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: claude-mem-data
              mountPath: /root/.claude-mem
            - name: settings
              mountPath: /root/.claude-mem/settings.json
              subPath: settings.json
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        # socat bridges 0.0.0.0:37878 → 127.0.0.1:37877 (server-beta binds loopback only)
        - name: proxy
          image: alpine/socat:latest
          command:
            - socat
            - TCP-LISTEN:37878,bind=0.0.0.0,fork,reuseaddr
            - TCP:127.0.0.1:37877
          ports:
            - containerPort: 37878
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"

      volumes:
        - name: claude-mem-data
          emptyDir: {}
        - name: settings
          configMap:
            name: claude-mem-settings
