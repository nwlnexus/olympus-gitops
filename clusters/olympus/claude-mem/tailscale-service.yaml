# Tailnet-only access for claude-mem server-beta API.
# Any tailnet-enrolled device reaches this at claude-mem.raptor-mimosa.ts.net:37878.
# No tailscale.com/funnel — tailnet-only.
apiVersion: v1
kind: Service
metadata:
  name: claude-mem-ts
  namespace: claude-mem
  annotations:
    tailscale.com/hostname: "claude-mem"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: claude-mem-server
  ports:
    - name: http
      port: 37878
      targetPort: 37877
      protocol: TCP
