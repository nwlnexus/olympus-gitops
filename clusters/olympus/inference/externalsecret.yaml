# Secrets for LiteLLM (olympus-sdk#569). Nothing here is created by hand; ESO renders both Secrets
# from 1Password (vault Dev) through the ClusterSecretStore `onepassword-connect`.
#
# Secret `litellm`, key LITELLM_MASTER_KEY (env). The proxy refuses to start without a master key.
#   With `custom_auth` configured (custom_auth.py) the master key is NOT accepted on any route, so it
#   only satisfies that boot check; no client ever sends it.
#
# Secret `litellm-client-keys`, one key per client, mounted as files (file name = client name, the
#   scopes are in LITELLM_CLIENT_SCOPES in litellm.yaml). A key is rotated by changing it in
#   1Password: ESO refreshes hourly and custom_auth.py re-reads a changed file without a restart.
#
# TEMPORARY (until the owner creates the 1Password item `litellm-cluster`): both read the existing
# item `litellm` field `master-key`, which is also what the memory workers send today. The target
# state is item `litellm-cluster` (vault Dev) with fields `master-key`, `memory-workers-key` and,
# when the #197 executor exists, `executor-key`; then change the three remoteRefs below and the
# workers' remoteRef (../memory/workers/externalsecret.yaml) to `memory-workers-key` in one PR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .masterKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: litellm
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-client-keys
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/memory-workers -> client `memory-workers`.
    - secretKey: memory-workers
      remoteRef:
        key: litellm
        property: master-key
