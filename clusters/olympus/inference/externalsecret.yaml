# Secrets for LiteLLM (olympus-sdk#569). Nothing here is created by hand; ESO renders both Secrets
# from 1Password (vault Dev) through the ClusterSecretStore `onepassword-connect`.
#
# Secret `litellm`, key LITELLM_MASTER_KEY (env). The proxy refuses to start without a master key.
#   With `custom_auth` configured (custom_auth.py) the master key is NOT accepted on any route, so it
#   only satisfies that boot check; no client ever sends it.
#
# Secret `litellm-client-keys`, one key per client, mounted as files (file name = client name, the
#   scopes are in LITELLM_CLIENT_SCOPES in litellm.yaml). A key is rotated by changing it in
#   1Password: ESO refreshes hourly and custom_auth.py re-reads a changed file without a restart.
#
# Secret `litellm-executor-key` (olympus-sdk#642), a THIRD ExternalSecret on purpose: the executor
#   key is added to 1Password by the owner after this lands. If its field is missing the ESO sync of
#   this one ExternalSecret errors (and no Secret exists), while `litellm` and `litellm-client-keys`
#   keep syncing and the memory-workers key is unaffected. litellm.yaml mounts it with
#   `optional: true` next to litellm-client-keys, as file `executor`.
#
# Secret `litellm-monitor-key` (olympus-sdk#649): the key of the `monitor` client, which the blackbox
#   exporter presents to GET /v1/models (a fourth ExternalSecret for the same reason as the executor
#   key; custom_auth.py limits `monitor` to the model list). The same field is synced a second time
#   into ns observability (observability/litellm-monitor-externalsecret.yaml) for the exporter.
#
# Secret `litellm-knowledge-key` (olympus-sdk#852): the key of the `knowledge` client (the code-knowledge
#   pack job on the olympus-knowledge runner; scope coder-heavy only, 30 rpm / 1 parallel). Separate for the
#   same reason as the executor key. The job reads the same value from op://CI/litellm-knowledge/credential.
#
# Source: 1Password item `litellm-cluster` (vault Dev), fields `master-key`, `memory-workers-key`,
# (owner adds, #642) `executor-key` for the #197 executor, `monitor-key` (#649) and (owner adds, #852)
# `knowledge-key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .masterKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: litellm-cluster
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-client-keys
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/memory-workers -> client `memory-workers`.
    - secretKey: memory-workers
      remoteRef:
        key: litellm-cluster
        property: memory-workers-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-executor-key
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-executor-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/executor -> client `executor`.
    - secretKey: executor
      remoteRef:
        key: litellm-cluster
        property: executor-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-monitor-key
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-monitor-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/monitor -> client `monitor`.
    - secretKey: monitor
      remoteRef:
        key: litellm-cluster
        property: monitor-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-knowledge-key
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-knowledge-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/knowledge -> client `knowledge`.
    - secretKey: knowledge
      remoteRef:
        key: litellm-cluster
        property: knowledge-key
