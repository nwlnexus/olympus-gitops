# Secrets for LiteLLM (olympus-sdk#569). Nothing here is created by hand; ESO renders both Secrets
# from 1Password (vault Dev) through the ClusterSecretStore `onepassword-connect`.
#
# Secret `litellm`, key LITELLM_MASTER_KEY (env). The proxy refuses to start without a master key.
#   With `custom_auth` configured (custom_auth.py) the master key is NOT accepted on any route, so it
#   only satisfies that boot check; no client ever sends it.
#
# Secret `litellm-client-keys`, one key per client, mounted as files (file name = client name, the
#   scopes are in LITELLM_CLIENT_SCOPES in litellm.yaml). A key is rotated by changing it in
#   1Password: ESO refreshes hourly and custom_auth.py re-reads a changed file without a restart.
#
# Source: 1Password item `litellm-cluster` (vault Dev), fields `master-key` and `memory-workers-key`
# (later `executor-key` for the #197 executor, with a file `executor` below).
#
# ROTATION WINDOW (olympus-sdk#569): `memory-workers.previous` still holds the key the workers sent
# before this change (`litellm` / `master-key`). ESO refreshes this Secret and the workers' Secret
# (../memory/workers/externalsecret.yaml) independently, so for a while either key may be in use;
# custom_auth.py accepts both for client `memory-workers`. Remove `memory-workers.previous` in a
# follow-up once the workers run with the new key (their pods restart via reloader on the Secret
# change; check `kubectl -n memory get secret memory-workers` was updated and the extract pod is new).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .masterKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: litellm-cluster
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-client-keys
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # File /etc/litellm/client-keys/memory-workers -> client `memory-workers`.
    - secretKey: memory-workers
      remoteRef:
        key: litellm-cluster
        property: memory-workers-key
    # Rotation window only (see above): the workers' previous key, also client `memory-workers`.
    - secretKey: memory-workers.previous
      remoteRef:
        key: litellm
        property: master-key
