apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  values:
    provider:
      name: cloudflare
    # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
    # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
    # LeastAllocated scoring and the descheduler place it.
    tolerations:
      - key: olympus.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 128Mi
    env:
      - name: CF_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-credentials
            key: api-key
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-credentials
            key: api-email
    domainFilters:
      - nwlnexus.net
      - nwlnexus.xyz
      - nwlnexus.io
    # Single-cluster (olympus) now manages these zones — management-hub retired.
    # sync auto-prunes records when their source is removed; safe because every
    # record carries an olympus-owned TXT registry entry (txtOwnerId/txtPrefix).
    policy: sync
    sources:
      - service
      - ingress
      - traefik-proxy
    txtOwnerId: olympus
    txtPrefix: "olympus-"
    logLevel: info
    logFormat: json
    extraArgs:
      - --traefik-disable-legacy
      - --cloudflare-proxied
