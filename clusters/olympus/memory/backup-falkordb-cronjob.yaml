# Nightly RDB backup of FalkorDB, 15 minutes after the Postgres dump, to
# /backup/falkordb/falkordb-<UTC timestamp>.rdb on the memory-backups PVC (14 kept).
#
# Method: `redis-cli --rdb` pulls an RDB snapshot over the network (the same
# SYNC mechanism a replica uses; the server forks like BGSAVE and streams the
# result, including the FalkorDB module's graph data). That is used instead of
# BGSAVE + file copy because the data PVC is ReadWriteOnce and attached to the
# FalkorDB pod's node: a second pod cannot reliably mount it, and `kubectl cp` would
# need extra RBAC. The redis-cli binary comes from the FalkorDB image itself, so the
# client always matches the server.
# Restore: README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: falkordb-backup
  namespace: memory
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: falkordb-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rdb-dump
              image: falkordb/falkordb:v4.22.2@sha256:03f53c46223ac2c0aab05ede7c6a8d9299255b7fd228909424f2c453f7a8cfcd
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  dir=/backup/falkordb
                  keep=14
                  mkdir -p "$dir"
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  tmp="$dir/.falkordb-${ts}.rdb.tmp"
                  out="$dir/falkordb-${ts}.rdb"
                  trap 'rm -f "$tmp"' EXIT
                  # REDISCLI_AUTH (env) supplies the password.
                  redis-cli -h falkordb -p 6379 --rdb "$tmp"
                  # Sanity: non-empty and carries the RDB magic header.
                  [ -s "$tmp" ]
                  [ "$(head -c 5 "$tmp")" = "REDIS" ]
                  mv "$tmp" "$out"
                  echo "wrote $out ($(wc -c < "$out") bytes)"
                  ls -1 "$dir"/falkordb-*.rdb | sort -r | tail -n +$((keep + 1)) | while read -r old; do
                    echo "pruning $old"
                    rm -f -- "$old"
                  done
                  echo "dumps on disk:"
                  ls -1 "$dir"/falkordb-*.rdb
              env:
                - name: REDISCLI_AUTH
                  valueFrom:
                    secretKeyRef:
                      name: memory-stores
                      key: falkordb-password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: memory-backups
