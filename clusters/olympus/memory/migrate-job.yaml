# Applies the versioned SQL files in migrations/ (mounted from the generated
# `memory-migrations` ConfigMap) to the `memory` database, in filename order,
# recording each applied version in memory.schema_migrations. See README.md for how
# to add a migration.
#
# Flux-friendly re-run pattern: kustomization.yaml generates the ConfigMap with a
# content-hash suffix, so any change to a migration changes the Job's pod template;
# the `force: enabled` annotation makes Flux delete and recreate the Job (its
# template is immutable), which re-runs the runner. Already-applied versions are
# skipped, so a re-run only applies what is new. (Same annotation as
# ../mem0/init-config-job.yaml.)
#
# Rules the runner enforces:
#   - each file runs in ONE transaction together with its ledger INSERT, so a failed
#     migration leaves no partial state and no ledger row;
#   - an applied file whose content has changed (sha256 drift) FAILS the Job. Applied
#     migrations are immutable; fix forward with a new file;
#   - files are named NNNN_description.sql, applied in lexical order.
#
# After the loop, a separate step sets the passwords of the login roles that migration
# 0004 creates (memory_gateway, memory_worker). Passwords never live in git: they come
# from the Secret `memory-stores` (keys gateway-db-password / worker-db-password), reach
# psql through its environment (not argv, not a file, not the ConfigMap) and are never
# echoed. ALTER ROLE ... PASSWORD is idempotent, so every run re-applies them.
# The two new env vars are deliberately NOT `optional: true` (fail closed): while the
# 1Password fields are missing the ExternalSecret cannot sync, the keys are absent from
# the Secret, and the pod waits in CreateContainerConfigError (visible in
# `kubectl -n memory describe pod`, no restarts, backoffLimit untouched) until they
# appear. With `optional: true` the Job would instead start, fail the empty-password
# check, burn through backoffLimit and end Failed.
# Connects as the `postgres` superuser (the only role that exists at 0001).
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-migrate
  namespace: memory
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Same pinned image as postgres.yaml (client tools match the server major).
          image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGHOST=postgres PGPORT=5432 PGUSER=postgres PGDATABASE=memory
              export PGCONNECT_TIMEOUT=5

              i=0
              until pg_isready -q -t 5; do
                i=$((i + 1))
                if [ "$i" -ge 120 ]; then
                  echo "postgres not ready after ${i} attempts; failing so the Job retries."
                  exit 1
                fi
                echo "waiting for postgres (attempt ${i})"
                sleep 5
              done

              for f in /migrations/*.sql; do
                base=$(basename "$f" .sql)
                version=${base%%_*}
                name=${base#*_}
                sum=$(sha256sum "$f" | cut -d' ' -f1)
                # Empty when the ledger does not exist yet (before 0001) or the
                # version has not been applied.
                # Existence is checked in its own statement: Postgres resolves table names at
                # parse time, so referencing memory.schema_migrations inside a CASE fails on
                # the first run even though that branch is never evaluated.
                have=$(psql -Atq -v ON_ERROR_STOP=1 -c "SELECT to_regclass('memory.schema_migrations') IS NOT NULL")
                prior=""
                if [ "$have" = "t" ]; then
                  prior=$(psql -Atq -v ON_ERROR_STOP=1 -c "SELECT coalesce((SELECT checksum FROM memory.schema_migrations WHERE version = '${version}'), '')")
                fi
                if [ -n "$prior" ]; then
                  if [ "$prior" != "$sum" ]; then
                    echo "ERROR: migration ${base} was applied with checksum ${prior} but the file is now ${sum}. Applied migrations are immutable; add a new migration instead."
                    exit 1
                  fi
                  echo "skip   ${base} (already applied)"
                  continue
                fi
                echo "apply  ${base}"
                psql -v ON_ERROR_STOP=1 --single-transaction -q \
                  -f "$f" \
                  -c "INSERT INTO memory.schema_migrations (version, name, checksum) VALUES ('${version}', '${name}', '${sum}')"
              done

              # ---- role passwords (step after the migrations; see header) -----------------
              if [ -z "${GATEWAY_DB_PASSWORD:-}" ] || [ -z "${WORKER_DB_PASSWORD:-}" ]; then
                echo "ERROR: gateway-db-password / worker-db-password in Secret memory-stores are empty; refusing to leave the login roles without a password."
                exit 1
              fi
              # $1 role, $2 password. The password travels in psql's environment (DB_PW);
              # psql's \set backtick runs a shell that expands $DB_PW itself, so the value
              # is on no command line, and :'pw' substitutes it as a quoted literal. The
              # SETs keep the statement out of the server log, including the error log
              # should it fail (log_min_duration_statement is 1000 in postgresql.conf).
              set_role_password() {
                DB_PW=$2 psql -X -q -v ON_ERROR_STOP=1 -v role="$1" <<'SQL'
              SET log_min_duration_statement = -1;
              SET log_min_error_statement = panic;
              \set pw `printf %s "$DB_PW"`
              ALTER ROLE :"role" PASSWORD :'pw';
              SQL
                echo "password set for role $1"
              }
              set_role_password memory_gateway "$GATEWAY_DB_PASSWORD"
              set_role_password memory_worker "$WORKER_DB_PASSWORD"

              echo "migrations complete:"
              psql -v ON_ERROR_STOP=1 -c "SELECT version, name, applied_at FROM memory.schema_migrations ORDER BY version"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stores
                  key: postgres-password
            # Role passwords for migration 0004's login roles. Required (no `optional`),
            # see the header: the Job waits until the 1Password fields exist.
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stores
                  key: gateway-db-password
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stores
                  key: worker-db-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: memory-migrations
