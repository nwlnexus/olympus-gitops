apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied by the Flux Kustomization `memory-embedder` (../../flux-kustomizations/memory-embedder.yaml).
# The `memory` Kustomization (path ../) does not include this directory.
resources:
  - embedder.yaml
  - networkpolicy.yaml
# The init script and the checksum list of the pinned model files. The ConfigMap name carries a
# content hash, so changing either rolls the pods.
configMapGenerator:
  - name: memory-embedder-init
    namespace: memory
    files:
      - fetch-model.sh
      - SHA256SUMS
