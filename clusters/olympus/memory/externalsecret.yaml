# Credentials for both stores, from the 1Password item `memory-stores` (vault Dev).
# The owner must create the item BEFORE merging (see README.md); until then the
# Secret does not exist, the StatefulSet pods sit in CreateContainerConfigError and
# the `memory` Flux Kustomization stays not-Ready. Nothing else is affected.
#
# Required fields (concealed/password type; alphanumeric is strongly preferred, e.g.
# `openssl rand -hex 24`, because the passwords end up in connection URLs later):
#   postgres-password     superuser password of the `postgres` role
#   falkordb-password     FalkorDB `requirepass`
#   gateway-db-password   password of the Postgres login role `memory_gateway` (migration 0004)
#   worker-db-password    password of the Postgres login role `memory_worker` (migration 0004)
# The two role passwords are applied by Job/memory-migrate after the migrations. Until the
# fields exist this ExternalSecret cannot sync (SecretSyncedError), the Secret keeps its
# old keys, and the Job pod waits in CreateContainerConfigError (README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-stores
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-stores
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: postgres-password
      remoteRef:
        key: memory-stores
        property: postgres-password
    - secretKey: falkordb-password
      remoteRef:
        key: memory-stores
        property: falkordb-password
    - secretKey: gateway-db-password
      remoteRef:
        key: memory-stores
        property: gateway-db-password
    - secretKey: worker-db-password
      remoteRef:
        key: memory-stores
        property: worker-db-password
