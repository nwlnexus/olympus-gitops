# Memory workers v1 (nwlnexus/olympus-sdk#453, epic #444, design
# docs/superpowers/specs/2026-10-21-memory-gateway-contract-design.md sections 3.4, 8 and 9;
# packages/memory-workers/README.md in olympus-sdk is the reference for every setting below).
#
# Deployed by its own Flux Kustomization (../../flux-kustomizations/memory-workers.yaml), like the
# gateway, so a broken worker rollout can never make the stores or the gateway unhealthy.
#
# One image, two processes: the LLM process `--stage extract,graph_ingest` (design 14.7,
# olympus-sdk#516, #519: one consumer of the 27B; it also writes the Postgres graph) and `--stage embed`. Workers pull jobs from
# the Postgres queue (connecting as role `memory_worker`); nothing connects to them except
# Prometheus (9090: /metrics, /healthz, /readyz). There is therefore no Service.
# Embed pair: 2 replicas, a node drain may take one, never both. (The extract worker is a single
# replica by design: a budget on it would only block drains, and it is safe to interrupt.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memory-worker-embed
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-worker-embed
    app.kubernetes.io/part-of: memory
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-worker-embed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker-extract
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-worker-extract
    app.kubernetes.io/part-of: memory
    app.kubernetes.io/component: worker
  annotations:
    # stakater reloader (../../reloader): roll the pods when the ConfigMap or Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  # ONE replica, and it must stay one: the extraction model on the A9 is a single GPU slot.
  # Scale to 0 to pause extraction (README.md, "Pausing extraction").
  replicas: 1
  strategy:
    # Never two extract pods at once, not even during a rollout (maxSurge would double the load
    # on the single GPU slot). The queue tolerates the few seconds of downtime: jobs wait.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-worker-extract
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-worker-extract
        app.kubernetes.io/part-of: memory
        app.kubernetes.io/component: worker
      annotations:
        # Scraped by the `kubernetes-pods` job of the cluster's Prometheus (the same mechanism that
        # scrapes the gateway: it keeps prometheus.io/scrape=true and honours the port and path
        # annotations, scheme http). No static job needed.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # No Kubernetes API access is needed: no token is mounted into the pod.
      automountServiceAccountToken: false
      imagePullSecrets:
        # Secret created by ../gateway/ghcr-pull-externalsecret.yaml (same namespace, same private
        # ghcr.io/nwlnexus org). Not duplicated here.
        - name: ghcr-pull
      # SIGTERM: no new claims; the job in flight gets MEMORY_WORKER_SHUTDOWN_GRACE_SECONDS (worker
      # default 20) to commit, then it is released back to the queue without counting an attempt.
      # The pod's grace period must stay above that.
      terminationGracePeriodSeconds: 30
      securityContext:
        # Pod Security `restricted` (enforced by the namespace). uid/gid 10001 is the image's USER.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spreads across the cluster, the arm64 Mac VMs included (owner decision 2026-11-01,
      # olympus-sdk#707; pinned to the agent-services onodes before, #567). No nodeSelector: the
      # agent-services toleration keeps onode-0636e4/062caa usable, the arm64 one opts in to the
      # Mac VMs (the memory-workers image is a multi-arch index: linux/amd64 + linux/arm64).
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: memory-worker
          # Pinned by digest, never by tag: the multi-arch INDEX digest (linux/amd64 + linux/arm64) of
          # tag sha-2d65937, built from olympus-sdk main by .github/workflows/memory-workers.yml
          # (olympus-sdk#707). The embed Deployment below pins the same digest; bump both together.
          image: ghcr.io/nwlnexus/memory-workers@sha256:74795cea2334d01d884d80cd6cd2dc806e7ad4a726856b0a15ac10e5bc63f4c2
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is `python -m memory_workers`; the stages are the argument. One process
          # for every LLM stage (design 14.7/14.8): claim order extract, graph_ingest, then the backfill.
          args: ["--stage", "extract,graph_ingest"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memory-workers-config
          env:
            - name: MEMORY_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: memory-workers-config
                  key: extract-concurrency
            - name: MEMORY_WORKER_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: memory-workers-config
                  key: extract-batch-size
            # Secrets are read from files (a mounted Secret), not from the environment, so they
            # do not show up in `kubectl describe pod` or in a crash dump of the environment.
            # The worker refuses to start if both DATABASE_URL and DATABASE_URL_FILE are set.
            - name: DATABASE_URL_FILE
              value: /run/secrets/memory-workers/DATABASE_URL
            - name: LITELLM_API_KEY_FILE
              value: /run/secrets/memory-workers/LITELLM_API_KEY
          startupProbe:
            # Process liveness: the health server answers as soon as the loop is up.
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # 200 while the last database round trip succeeded recently and the worker is not
            # shutting down. Nothing routes to the pod; this is for the Flux health check and
            # `kubectl get pods`.
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # 503 only when the worker loop itself hung (no tick for 3 x reap interval + 30 s):
            # no database, so a Postgres or LiteLLM outage never restarts the pod.
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The only writable path (TMPDIR and HOME point here in the image).
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/memory-workers
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: memory-workers
            defaultMode: 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker-embed
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-worker-embed
    app.kubernetes.io/part-of: memory
    app.kubernetes.io/component: worker
  annotations:
    # stakater reloader (../../reloader): roll the pods when the ConfigMap or Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  # Two pods x 4 claim loops. Queue claims use FOR UPDATE SKIP LOCKED, so any number of embed
  # workers is safe; two give redundancy across nodes, not throughput.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-worker-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-worker-embed
        app.kubernetes.io/part-of: memory
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spreads across the cluster, the arm64 Mac VMs included (owner decision 2026-11-01,
      # olympus-sdk#707; pinned to the agent-services onodes before, #567). No nodeSelector: the
      # agent-services toleration keeps onode-0636e4/062caa usable, the arm64 one opts in to the
      # Mac VMs (the memory-workers image is a multi-arch index: linux/amd64 + linux/arm64).
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      # Spread by node, soft (ScheduleAnyway): the scheduler scores for an even spread and the descheduler
      # (clusters/olympus/descheduler) rebalances skew later; never leaves a replica Pending (olympus-sdk#707).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: memory-worker-embed
      affinity:
        podAntiAffinity:
          # Spread the two replicas across nodes, but never leave a replica unschedulable
          # when only one node is available (hence preferred, not required).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: memory-worker-embed
      containers:
        - name: memory-worker
          image: ghcr.io/nwlnexus/memory-workers@sha256:74795cea2334d01d884d80cd6cd2dc806e7ad4a726856b0a15ac10e5bc63f4c2
          imagePullPolicy: IfNotPresent
          args: ["--stage", "embed"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memory-workers-config
          env:
            - name: MEMORY_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: memory-workers-config
                  key: embed-concurrency
            - name: MEMORY_WORKER_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: memory-workers-config
                  key: embed-batch-size
            - name: DATABASE_URL_FILE
              value: /run/secrets/memory-workers/DATABASE_URL
            - name: LITELLM_API_KEY_FILE
              value: /run/secrets/memory-workers/LITELLM_API_KEY
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 10m
              memory: 80Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/memory-workers
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: memory-workers
            defaultMode: 0440
