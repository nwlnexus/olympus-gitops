apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied by the Flux Kustomization `memory-workers` (../../flux-kustomizations/memory-workers.yaml).
# The `memory` Kustomization (path ../) does not include this directory.
# Secret `ghcr-pull` (image pull) is created by ../gateway/ghcr-pull-externalsecret.yaml and is
# deliberately not duplicated here; this is why `memory-workers` dependsOn `memory-gateway`.
resources:
  - externalsecret.yaml
  - workers.yaml
  - networkpolicy.yaml
configMapGenerator:
  # memory-workers-config: values in workers-config.env. The generated name has a content hash and
  # kustomize rewrites the envFrom/configMapKeyRef references in workers.yaml to it, so a value change
  # rolls the worker pods (olympus-sdk#591).
  - name: memory-workers-config
    namespace: memory
    envs:
      - workers-config.env
    options:
      labels:
        app.kubernetes.io/name: memory-workers
        app.kubernetes.io/part-of: memory
