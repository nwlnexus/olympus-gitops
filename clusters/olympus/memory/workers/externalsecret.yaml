# Secret `memory-workers` for both worker Deployments. Two keys, both mounted as files
# (DATABASE_URL_FILE / LITELLM_API_KEY_FILE):
#   DATABASE_URL     postgres://memory_worker:<password>@postgres.memory.svc:5432/memory?sslmode=disable
#                    The password is `worker-db-password` of the existing Secret `memory-stores`
#                    (the same value Job/memory-migrate sets on the role with ALTER ROLE; design 3.4).
#                    Rendered into the URL by ESO templating from the 1Password item `memory-stores`
#                    (vault Dev, field `worker-db-password`, already created for the stores), exactly
#                    like ../gateway/externalsecret.yaml. `urlquery` keeps a password with
#                    URL-special characters valid; the item's passwords are hex (README.md of the
#                    parent directory), for which it is a no-op.
#                    sslmode=disable: the Postgres here has no `ssl` setting (config/postgresql.conf)
#                    and is reachable only from inside the namespace (NetworkPolicy).
#   LITELLM_API_KEY  the key the workers send to LiteLLM (memory-extract and memory-embed).
#                    TEMPORARY: this is the LiteLLM master key (1Password item `litellm`, vault Dev,
#                    field `master-key`), the same source as the gateway. Per-client virtual keys,
#                    which give the workers a key of their own that can be revoked and rate limited
#                    separately, come with olympus-sdk#490; replace the remoteRef then.
# Prerequisite: both 1Password items must exist (they do: the gateway already uses them). Until they
# do this ExternalSecret cannot sync and the pods wait in ContainerCreating (the volume cannot mount).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-workers
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-workers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgres://memory_worker:{{ .workerDbPassword | urlquery }}@postgres.memory.svc:5432/memory?sslmode=disable"
        LITELLM_API_KEY: "{{ .litellmKey }}"
  data:
    - secretKey: workerDbPassword
      remoteRef:
        key: memory-stores
        property: worker-db-password
    - secretKey: litellmKey
      remoteRef:
        key: litellm
        property: master-key
