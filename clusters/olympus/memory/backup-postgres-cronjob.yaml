# Nightly logical backup of the `memory` database: pg_dump --format=custom to
# /backup/postgres/memory-<UTC timestamp>.dump on the memory-backups PVC, keeping the
# 14 newest. Restic-free retention: plain `ls | tail | rm`.
#
# Safety properties: the dump is written to a dot-prefixed temp file, verified with
# `pg_restore --list`, and only then renamed into place; retention runs only after a
# verified dump, so a failing database never ages out the good backups. Any failure
# fails the Job (alert MemoryBackupStale fires if no run succeeds for 36h).
# Restore: README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: memory
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          # olympus-sdk#567: the memory stack runs on the agent-services onodes (onode-0636e4/062caa).
          nodeSelector:
            olympus.io/role: agent-services
          tolerations:
            - key: olympus.io/role
              operator: Equal
              value: agent-services
              effect: NoSchedule
          containers:
            - name: pg-dump
              image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGHOST=postgres PGPORT=5432 PGUSER=postgres PGDATABASE=memory
                  export PGCONNECT_TIMEOUT=10
                  dir=/backup/postgres
                  keep=14
                  mkdir -p "$dir"
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  tmp="$dir/.memory-${ts}.dump.tmp"
                  out="$dir/memory-${ts}.dump"
                  trap 'rm -f "$tmp"' EXIT
                  pg_dump --format=custom --compress=6 --file="$tmp"
                  # Fails (and so fails the Job) if the archive is unreadable/truncated.
                  pg_restore --list "$tmp" > /dev/null
                  mv "$tmp" "$out"
                  echo "wrote $out ($(wc -c < "$out") bytes)"
                  # Retention: keep the newest $keep dumps. Names sort chronologically.
                  ls -1 "$dir"/memory-*.dump | sort -r | tail -n +$((keep + 1)) | while read -r old; do
                    echo "pruning $old"
                    rm -f -- "$old"
                  done
                  echo "dumps on disk:"
                  ls -1 "$dir"/memory-*.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: memory-stores
                      key: postgres-password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: memory-backups
