# redis-server settings for FalkorDB (nwlnexus/olympus-sdk#449). Passed as the first
# argument to redis-server (see falkordb.yaml); the password, protected-mode, data dir
# and module are given on the command line there.
#
# Persistence: RDB snapshots AND append-only file. AOF (everysec) bounds loss to ~1s
# on a crash; the RDB preamble keeps AOF rewrites compact and gives restores a plain
# RDB. A restart replays the AOF (Redis prefers AOF when it is enabled).
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 100
save 60 10000

# Container limit is 2Gi. A BGSAVE/AOF-rewrite fork can transiently need extra memory
# (copy-on-write), so cap the dataset at 1280mb and refuse writes beyond it instead of
# evicting graph data (noeviction) or being OOM-killed mid-rewrite.
maxmemory 1280mb
maxmemory-policy noeviction

# Logs to stdout (kubectl logs).
logfile ""
