# Postgres 16 tuning for the memory platform (nwlnexus/olympus-sdk#449).
# This file REPLACES the initdb-generated postgresql.conf (the server is started with
# -c config_file=/etc/postgresql/postgresql.conf), so every setting we rely on is
# listed here. pg_hba.conf stays the one initdb wrote (scram-sha-256 for host
# connections); network reachability is restricted by networkpolicy.yaml.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# Memory: container limit is 2Gi; shared_buffers 512MB + ~100 backends fit with headroom.
shared_buffers = 512MB
effective_cache_size = 1536MB
# /dev/shm is a 256Mi memory-backed emptyDir (postgres.yaml); posix DSM is used by
# parallel query and parallel pgvector index builds.
dynamic_shared_memory_type = posix

# Logging: to stderr (kubectl logs). Slow statements over 1s.
log_min_duration_statement = 1000
log_timezone = 'UTC'
timezone = 'UTC'
