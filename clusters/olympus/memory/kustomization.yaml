apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - migrate-job.yaml
  - backup-pvc.yaml
  - backup-postgres-cronjob.yaml
# Config files live next to the manifests and become hash-suffixed ConfigMaps, so a
# change to any of them rolls the consuming pod (StatefulSet/Job) automatically.
configMapGenerator:
  - name: postgres-config
    namespace: memory
    files:
      - postgresql.conf=config/postgresql.conf
  - name: memory-migrations
    namespace: memory
    files:
      - migrations/0001_init.sql
      - migrations/0002_core.sql
      - migrations/0003_queue_and_graph.sql
      - migrations/0004_roles.sql
      - migrations/0005_postgres_graph.sql
      - migrations/0006_graph_cleanup.sql
      - migrations/0007_knowledge.sql
      - migrations/0008_capture_key_per_client.sql
      - migrations/0009_closure_suggestion.sql
      - migrations/0010_fact_extract_provenance.sql
      - migrations/0011_audit_actions_union.sql
      - migrations/0012_recall_usage.sql
      - migrations/0013_graph_detach_repair.sql
      - migrations/0014_graph_retry_failed_audit.sql
      - migrations/0015_graph_forget_hardening.sql
