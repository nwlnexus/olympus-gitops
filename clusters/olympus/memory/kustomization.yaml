apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - falkordb.yaml
  - migrate-job.yaml
  - backup-pvc.yaml
  - backup-postgres-cronjob.yaml
  - backup-falkordb-cronjob.yaml
# Config files live next to the manifests and become hash-suffixed ConfigMaps, so a
# change to any of them rolls the consuming pod (StatefulSet/Job) automatically.
configMapGenerator:
  - name: postgres-config
    namespace: memory
    files:
      - postgresql.conf=config/postgresql.conf
  - name: falkordb-config
    namespace: memory
    files:
      - falkordb.conf=config/falkordb.conf
  - name: memory-migrations
    namespace: memory
    files:
      - migrations/0001_init.sql
      - migrations/0002_core.sql
      - migrations/0003_queue_and_graph.sql
      - migrations/0004_roles.sql
      - migrations/0007_knowledge.sql
