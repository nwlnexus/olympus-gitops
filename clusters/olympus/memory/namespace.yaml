# Memory platform data stores (nwlnexus/olympus-sdk#449, epic #444, spec D3/D4/5.2).
# `restricted` is enforced: the Postgres store runs as uid/gid 999, non-root, no privilege
# escalation, all capabilities dropped, seccomp RuntimeDefault (see postgres.yaml), and so
# do the migration Job and the backup CronJob. The pgvector image is the official postgres
# image (supports `--user 999:999`) and needs no root at runtime. (FalkorDB, the second
# store, was removed under olympus-sdk#456.)
apiVersion: v1
kind: Namespace
metadata:
  name: memory
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
