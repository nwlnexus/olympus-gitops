# Memory platform data stores (nwlnexus/olympus-sdk#449, epic #444, spec D3/D4/5.2).
# `restricted` is enforced: both stores run as uid/gid 999, non-root, no privilege
# escalation, all capabilities dropped, seccomp RuntimeDefault (see postgres.yaml and
# falkordb.yaml), and so do the migration Job and the backup CronJobs. Neither image
# needs root at runtime: the pgvector image is the official postgres image (supports
# `--user 999:999`), and FalkorDB's data directory is a mounted PVC that fsGroup makes
# writable (the image's own entrypoint is bypassed, see falkordb.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: memory
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
