# Secret `memory-gateway` for the gateway pods. Two keys, both mounted as files:
#   DATABASE_URL     postgres://memory_gateway:<password>@postgres.memory.svc:5432/memory?sslmode=disable
#                    The password is `gateway-db-password` of the existing Secret `memory-stores`
#                    (the same value Job/memory-migrate sets on the role with ALTER ROLE). It is
#                    rendered into the URL by ESO templating from the 1Password item `memory-stores`
#                    (vault Dev, field `gateway-db-password`, already created for the stores).
#                    `urlquery` keeps a password with URL-special characters valid; the item's
#                    passwords are hex (README.md of the parent directory), for which it is a no-op.
#                    sslmode=disable: the Postgres here has no `ssl` setting (config/postgresql.conf)
#                    and is reachable only from inside the namespace (NetworkPolicy).
#   LITELLM_API_KEY  the key the gateway sends to LiteLLM for query embeddings.
#                    TEMPORARY: this is the LiteLLM master key (1Password item `litellm`, vault Dev,
#                    field `master-key`). Per-client virtual keys, which give the gateway a key of
#                    its own that can be revoked and rate limited separately, come with
#                    olympus-sdk#490; replace the remoteRef then.
# Prerequisite: 1Password item `litellm` with field `master-key` must exist. Until it does this
# ExternalSecret cannot sync and the pods wait in ContainerCreating (the volume cannot mount).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-gateway
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-gateway
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgres://memory_gateway:{{ .gatewayDbPassword | urlquery }}@postgres.memory.svc:5432/memory?sslmode=disable"
        LITELLM_API_KEY: "{{ .litellmKey }}"
  data:
    - secretKey: gatewayDbPassword
      remoteRef:
        key: memory-stores
        property: gateway-db-password
    - secretKey: litellmKey
      remoteRef:
        key: litellm
        property: master-key
