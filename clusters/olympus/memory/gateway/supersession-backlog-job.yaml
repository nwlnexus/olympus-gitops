# One-shot: clear the supersession suggestion backlog left by the one-time graph backfill (olympus-sdk#966, epic #965).
#
# Steps run in order as init containers, then the main container, all with the gateway image and the gateway's
# credentials (role memory_gateway, exactly what `kubectl -n memory exec deploy/memory-gateway -- node
# dist/admin/cli.js ...` would use; the bulk close records its decisions as client internal:admin, which only that
# role may create):
#   1. consolidate --apply        the nightly consolidation, now also closing suggestions whose older fact is an event
#                                 or has expired (reason in each decision note)
#   2. supersession stats         what is still pending, by rule, proposer, kinds, expiry and day created
#   3. supersession close         everything still pending that the backfill created (before the cut-off), as obsolete,
#                                 one audit row per batch; facts are not touched
#   4. supersession reopen (dry)  proves the close can be undone: lists what `reopen --since ... --apply` would reopen
# Each step prints one JSON object to the pod log (`kubectl -n memory logs job/memory-supersession-backlog-966 --all-containers`).
#
# No ttlSecondsAfterFinished: Flux would recreate a deleted Job and run it again. A follow-up commit removes this file
# (Flux prunes the Job). Undo, if ever needed: `supersession reopen --since 2026-11-17T00:00:00Z --apply`.
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-supersession-backlog-966
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-supersession-backlog
    app.kubernetes.io/part-of: memory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-supersession-backlog
        app.kubernetes.io/part-of: memory
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/nwlnexus/memory-gateway@sha256:3e4f38aca664d4b0445d804cc548fcef04439faebe906aed7b3045bbc4cb9dc2
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const net = require('node:net')
              const deadline = Date.now() + 120000
              const attempt = () => {
                const s = net.connect({ host: 'postgres.memory.svc', port: 5432, timeout: 3000 })
                s.once('connect', () => { s.destroy(); console.log('postgres reachable'); process.exit(0) })
                const retry = (e) => {
                  s.destroy()
                  if (Date.now() > deadline) { console.error('postgres unreachable after 120 s: ' + (e && e.code)); process.exit(1) }
                  setTimeout(attempt, 2000)
                }
                s.once('error', retry)
                s.once('timeout', () => retry({ code: 'ETIMEDOUT' }))
              }
              attempt()
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: &small
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: consolidate
          image: ghcr.io/nwlnexus/memory-gateway@sha256:3e4f38aca664d4b0445d804cc548fcef04439faebe906aed7b3045bbc4cb9dc2
          imagePullPolicy: IfNotPresent
          command: [node, dist/admin/cli.js, consolidate, --apply, --json, --actor, supersession-backlog-966]
          env: &env
            - name: DATABASE_URL_FILE
              value: /run/secrets/memory-gateway/DATABASE_URL
            - name: LOG_LEVEL
              value: info
          securityContext: *sc
          resources: &work
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts: &mounts
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/memory-gateway
              readOnly: true
        - name: stats
          image: ghcr.io/nwlnexus/memory-gateway@sha256:3e4f38aca664d4b0445d804cc548fcef04439faebe906aed7b3045bbc4cb9dc2
          imagePullPolicy: IfNotPresent
          command: [node, dist/admin/cli.js, supersession, stats, --json]
          env: *env
          securityContext: *sc
          resources: *work
          volumeMounts: *mounts
        - name: close
          image: ghcr.io/nwlnexus/memory-gateway@sha256:3e4f38aca664d4b0445d804cc548fcef04439faebe906aed7b3045bbc4cb9dc2
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/admin/cli.js
            - supersession
            - close
            # The backfill ran 2026-11-08 to 2026-11-16 06:00 UTC; suggestions created later stay for the judge.
            - --created-before
            - "2026-11-16T12:00:00Z"
            - --note
            - "backfill-era bulk close (olympus-sdk#966): proposed by the one-time graph backfill, not reviewed"
            - --apply
            - --json
            - --actor
            - supersession-backlog-966
          env: *env
          securityContext: *sc
          resources: *work
          volumeMounts: *mounts
      containers:
        - name: reopen-dry-run
          image: ghcr.io/nwlnexus/memory-gateway@sha256:3e4f38aca664d4b0445d804cc548fcef04439faebe906aed7b3045bbc4cb9dc2
          imagePullPolicy: IfNotPresent
          command: [node, dist/admin/cli.js, supersession, reopen, --since, "2026-11-17T00:00:00Z", --json]
          env: *env
          securityContext: *sc
          resources: *small
          volumeMounts: *mounts
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: secrets
          secret:
            secretName: memory-gateway
            defaultMode: 0440
