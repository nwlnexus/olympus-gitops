# Image pull secret for the private ghcr.io/nwlnexus/memory-gateway image. Same source as
# ../../ingress-discovery/ghcr-pull-externalsecret.yaml:
# 1Password item `gh-pull-secret` (vault Dev), fields `username` and `credential` (a PAT with
# read:packages on the nwlnexus org). Not needed if the package is made public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: gh-pull-secret
        property: username
    - secretKey: token
      remoteRef:
        key: gh-pull-secret
        property: credential
