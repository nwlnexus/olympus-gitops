# Secret `memory-knowledge-indexer` for the knowledge indexer CronJob (knowledge-indexer-cronjob.yaml).
# Two keys, both mounted as files:
#   DATABASE_URL     postgres://memory_worker:<password>@postgres.memory.svc:5432/memory?sslmode=disable
#                    Same source and template as ../workers/externalsecret.yaml (1Password item
#                    `memory-stores`, field `worker-db-password`): the indexer writes as role memory_worker,
#                    to which migration 0007 grants SELECT/INSERT/UPDATE/DELETE on memory.knowledge_page.
#   SSH_PRIVATE_KEY  a read-only GitHub deploy key of nwlnexus/second-brain (OpenSSH ed25519 private key).
#                    1Password item `second-brain-deploy-key` (vault Dev), field `private-key-b64`: the key
#                    base64-encoded on one line (ESO's 1Password Connect provider handles single-line fields;
#                    same convention as ../../arc/externalsecret.yaml `private-key-b64`), decoded here.
# OWNER PREREQUISITE (once):
#   ssh-keygen -t ed25519 -N '' -C memory-knowledge-indexer -f second-brain-deploy
#   gh repo deploy-key add second-brain-deploy.pub -R nwlnexus/second-brain -t memory-knowledge-indexer   # read-only
#   create the 1Password item with field private-key-b64 = $(base64 -w0 second-brain-deploy); shred both files.
# Until the item exists this ExternalSecret cannot sync and the indexer pod waits in Init.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-knowledge-indexer
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-knowledge-indexer
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgres://memory_worker:{{ .workerDbPassword | urlquery }}@postgres.memory.svc:5432/memory?sslmode=disable"
        SSH_PRIVATE_KEY: "{{ .deployKeyB64 | b64dec }}"
  data:
    - secretKey: workerDbPassword
      remoteRef:
        key: memory-stores
        property: worker-db-password
    - secretKey: deployKeyB64
      remoteRef:
        key: second-brain-deploy-key
        property: private-key-b64
---
# Secret `memory-knowledge-indexer-app`: a CI-only key of the olympus-arc GitHub App (olympus-sdk#853, code-knowledge
# spec D17: the existing App, no new App and no deploy key). NOT `arc-github-app`: that is ARC's own key, and it
# carries org self-hosted-runner admin; it never leaves the arc-runners namespace. The CI key (1Password item
# `olympus-arc`, vault CI, created for W4 olympus-sdk#852; fields private-key-b64, app-id) is mounted ONLY into the
# indexer's `app-token` init container, which mints a short-lived installation token narrowed to repository
# nwlnexus/olympus-knowledge with contents: read (`node dist/knowledge/app-token-cli.js`) for the second clone. The key
# never reaches the clone or index containers; the token lives in the pod's emptyDir for the clone and is then deleted.
# The installation id (172916382) is not secret and is set in the CronJob until the item carries an installation-id
# field. The ClusterSecretStore reads vaults Dev and CI (Dev first: no Dev item may be titled `olympus-arc`).
# Until the item exists this ExternalSecret does not sync; the CronJob's volume is optional, so the pod still starts,
# the code source is skipped and logged, and the wiki index runs as before.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-knowledge-indexer-app
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-knowledge-indexer-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: APP_ID
      remoteRef:
        key: olympus-arc
        property: app-id
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: olympus-arc
        property: private-key-b64
        decodingStrategy: Base64
