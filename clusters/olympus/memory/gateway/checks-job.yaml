# One-shot, read-only (olympus-sdk#1019 24 h check, #967 SR2 count). Removed after it has run.
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-checks-1019
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-checks
    app.kubernetes.io/part-of: memory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-checks
        app.kubernetes.io/part-of: memory
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/nwlnexus/memory-gateway@sha256:8cfd9a6171d55386c675ee246ac9d7534df4d4d5e8c3858256b3c495c80fcde0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const net = require('node:net')
              const deadline = Date.now() + 120000
              const attempt = () => {
                const s = net.connect({ host: 'postgres.memory.svc', port: 5432, timeout: 3000 })
                s.once('connect', () => { s.destroy(); console.log('postgres reachable'); process.exit(0) })
                const retry = (e) => {
                  s.destroy()
                  if (Date.now() > deadline) { console.error('postgres unreachable after 120 s: ' + (e && e.code)); process.exit(1) }
                  setTimeout(attempt, 2000)
                }
                s.once('error', retry)
                s.once('timeout', () => retry({ code: 'ETIMEDOUT' }))
              }
              attempt()
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: checks
          image: ghcr.io/nwlnexus/memory-gateway@sha256:8cfd9a6171d55386c675ee246ac9d7534df4d4d5e8c3858256b3c495c80fcde0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('node:fs'); const { Pool } = require('pg');
              const url = fs.readFileSync(process.env.DATABASE_URL_FILE, 'utf8').trim();
              const pool = new Pool({ connectionString: url, max: 1 });
              const Q1 = `SELECT count(*) AS repo_single_valued_edges_since_deploy
              FROM memory.entity_edge ed
              JOIN memory.entity e ON e.uuid = ed.source_uuid
              JOIN memory.graph_predicate p ON p.name = ed.name AND p.single_valued AND p.name <> 'REPLACED_BY'
              WHERE ed.created_at >= '2026-11-18T12:39:00Z'
                AND (e.labels @> ARRAY['repository']::text[]
                     OR ((cardinality(e.labels) = 0 OR e.labels && ARRAY['other','project']::text[])
                         AND (e.name ~ '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' OR strpos(lower(e.name), 'github.com/') > 0)))`;
              const Q2 = `SELECT to_char(created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD') AS day, count(*) AS new_suggestions
              FROM memory.supersession_suggestion WHERE created_at >= '2026-11-14T00:00:00Z' GROUP BY 1 ORDER BY 1`;
              const Q3 = `SELECT to_char(created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD') AS day, state, count(*) AS n
              FROM memory.supersession_suggestion WHERE created_at >= '2026-11-14T00:00:00Z' GROUP BY 1, 2 ORDER BY 1, 2`;
              (async () => {
                for (const [n, q] of [['Q1', Q1], ['Q2', Q2], ['Q3', Q3]]) {
                  console.log(n, JSON.stringify((await pool.query(q)).rows));
                }
                await pool.end();
              })().catch((e) => { console.error(e.message); process.exit(1); });
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/consolidate/DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/consolidate
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: secrets
          secret:
            secretName: memory-purge
            defaultMode: 0440
