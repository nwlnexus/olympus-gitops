apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied by the Flux Kustomization `memory-gateway` (../../flux-kustomizations/memory-gateway.yaml),
# which is NOT registered in ../../kustomization.yaml until the image digest in gateway.yaml is real.
# The `memory` Kustomization (path ../) does not include this directory.
resources:
  - externalsecret.yaml
  - ghcr-pull-externalsecret.yaml
  - gateway.yaml
  - tailscale-service.yaml
  - networkpolicy.yaml
  # Knowledge indexer (olympus-sdk#563): nightly wiki index, runs the gateway image.
  - knowledge-indexer-externalsecret.yaml
  - knowledge-indexer-cronjob.yaml
  # Forget purge (olympus-sdk#734): daily `memory-admin purge`, runs the gateway image as memory_worker.
  - purge-externalsecret.yaml
  - purge-cronjob.yaml
  # Fact consolidation (olympus-sdk#455): nightly `memory-admin consolidate` (dedupe/decay), gateway image as memory_worker.
  - consolidate-cronjob.yaml
