# Memory gateway (nwlnexus/olympus-sdk#450 task G10, epic #444, design
# docs/superpowers/specs/2026-10-21-memory-gateway-contract-design.md sections 5.6, 6.1 and 9).
#
# NOT ENABLED BY DEFAULT: this directory is deployed by its own Flux Kustomization
# (../../flux-kustomizations/memory-gateway.yaml), which is not listed in the root
# kustomization.yaml. See README.md in this directory ("Enabling") for the two steps.
#
# Two replicas of the TypeScript gateway (MCP + REST on :8080, metrics on :9090, never routed).
# Reachability: ClusterIP Service `memory-gateway` (80 -> 8080, in-cluster and blackbox probe) and
# the Tailscale LoadBalancer Service `memory-ts` (tailscale-service.yaml, tailnet host `memory`).
# Public path (olympus-sdk#736): the cloudflared tunnel rule for memory.nwlnexus.io points at Service
# `memory-gateway` (olympus-infra roles/cloudflare-access); networkpolicy.yaml admits the cloudflared pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-gateway-config
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: memory
data:
  # Listeners (defaults of src/config.ts, spelled out so the Service/probe/NetworkPolicy ports
  # have one visible source).
  MEMORY_HOST: "0.0.0.0"
  MEMORY_PORT: "8080"
  MEMORY_METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  # No LITELLM_BASE_URL: the data-hub LiteLLM is retired (olympus-sdk#569) and the cluster LiteLLM
  # has no embedding alias, so query embeddings come only from memory-embedder below (with it down,
  # recall degrades to text-only, design 6.3). MEMORY_EMBED_ALIAS is the alias name recorded with
  # the embeddings (768 dimensions, design 3.2).
  MEMORY_EMBED_ALIAS: "memory-embed"
  # Query embeddings from the dedicated in-cluster service (olympus-sdk#529).
  MEMORY_EMBED_BASE_URL: "http://memory-embedder.memory.svc/v1"
  MEMORY_EMBED_MODEL: "nomic-embed-text-v1.5"
  # --- Cloudflare Access (design 5.2, 5.6) -------------------------------------------------
  # Printed by olympus-infra `playbooks/push/cloudflare-access.yml` (olympus-sdk#736), Access application
  # `memory` on memory.nwlnexus.io, created 2026-11-04. The gateway requires both or neither
  # (src/config.ts). With both set, /readyz waits for the JWKS fetched from the team domain over 443
  # (allowed by `allow-gateway-egress`, Cloudflare ranges), so a wrong value keeps both pods NotReady,
  # tailnet path included. Gateway keys (Authorization: Bearer mgw_...) keep working on the tailnet;
  # the public Host requires a verified Access JWT (olympus-sdk#735).
  MEMORY_ACCESS_TEAM_DOMAIN: "https://nwlnexus.cloudflareaccess.com"
  MEMORY_ACCESS_AUD: "3304a440d0d40f598b35935bede6ff9d03ba514107fc739a4542b165e92e36b7"
---
apiVersion: v1
kind: Service
metadata:
  name: memory-gateway
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: memory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memory-gateway
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: memory
spec:
  # Two replicas: a node drain may take one, never both.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-gateway
  namespace: memory
  labels:
    app.kubernetes.io/name: memory-gateway
    app.kubernetes.io/part-of: memory
  annotations:
    # stakater reloader (../../reloader): roll the pods when the ConfigMap or Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-gateway
        app.kubernetes.io/part-of: memory
      annotations:
        # Scraped by the `kubernetes-pods` job of the cluster's Prometheus (verified against the
        # live config on 2026-10-21: it keeps prometheus.io/scrape=true and honours the
        # prometheus.io/port and prometheus.io/path annotations, scheme http). No static job needed.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # No Kubernetes API access is needed: no token is mounted into the pod.
      automountServiceAccountToken: false
      imagePullSecrets:
        # The ghcr.io/nwlnexus/memory-gateway package is private until the owner makes it public.
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        # Pod Security `restricted` (enforced by the namespace). uid/gid 10001 is the image's USER.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spreads across the cluster, the arm64 Mac VMs included (owner decision 2026-11-01,
      # olympus-sdk#707; pinned to the agent-services onodes before, #567). No nodeSelector: the
      # agent-services toleration keeps onode-0636e4/062caa usable, the arm64 one opts in to the
      # Mac VMs (the memory-gateway image is a multi-arch index: linux/amd64 + linux/arm64).
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      # Spread by node, soft (ScheduleAnyway): the scheduler scores for an even spread and the descheduler
      # (clusters/olympus/descheduler) rebalances skew later; never leaves a replica Pending (olympus-sdk#707).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: memory-gateway
      affinity:
        podAntiAffinity:
          # Spread the two replicas across nodes, but never leave a replica unschedulable
          # when only one node is available (hence preferred, not required).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: memory-gateway
      containers:
        - name: memory-gateway
          # Pinned by digest, never by tag: the multi-arch INDEX digest (linux/amd64 + linux/arm64) of
          # tag sha-9630d3f, built from olympus-sdk main by .github/workflows/memory-gateway.yml
          # (olympus-sdk#707). To bump: `docker buildx imagetools inspect
          # ghcr.io/nwlnexus/memory-gateway:sha-<short>` and take the index digest.
          # knowledge-indexer-cronjob.yaml pins the same digest; bump both together.
          image: ghcr.io/nwlnexus/memory-gateway@sha256:f44de64ef0e9838f414a86aa09de140f4395e11d16b18ba52d72e861c457c0e6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memory-gateway-config
          env:
            # Secrets are read from files (a mounted Secret), not from the environment, so they
            # do not show up in `kubectl describe pod` or in a crash dump of the environment.
            - name: DATABASE_URL_FILE
              value: /run/secrets/memory-gateway/DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # SELECT 1 within 1 s, plus the Access JWKS when Access is configured (design 6.1).
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Process liveness only: no database, so a Postgres outage never restarts the pods.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 40m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The only writable path (TMPDIR and HOME point here in the image).
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/memory-gateway
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: memory-gateway
            defaultMode: 0440
