# Secret `memory-purge` for the purge CronJob (purge-cronjob.yaml): one key, mounted as a file.
#   DATABASE_URL  postgres://memory_worker:<password>@postgres.memory.svc:5432/memory?sslmode=disable
#                 Same source and template as ../workers/externalsecret.yaml and
#                 knowledge-indexer-externalsecret.yaml (1Password item `memory-stores`, field
#                 `worker-db-password`). Role memory_worker is the one with DELETE on fact_revision and
#                 capture_queue (migration 0004); memory_gateway has neither, so the purge cannot run as it.
# No new 1Password item: the field already exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-purge
  namespace: memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: memory-purge
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgres://memory_worker:{{ .workerDbPassword | urlquery }}@postgres.memory.svc:5432/memory?sslmode=disable"
  data:
    - secretKey: workerDbPassword
      remoteRef:
        key: memory-stores
        property: worker-db-password
