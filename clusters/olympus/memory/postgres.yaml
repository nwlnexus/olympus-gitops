# Postgres 16 + pgvector for episodes, facts, embeddings and the capture queue
# (spec 5.2). Single instance. State: 50Gi `qnap-iscsi` PVC (allowVolumeExpansion,
# reclaimPolicy Retain: the PV survives deletion of the PVC/StatefulSet).
#
# Scheduling: pinned to the agent-services onodes (olympus-sdk#567, owner decision
# 2026-10-28) with nodeSelector `olympus.io/role: agent-services` plus the matching
# NoSchedule toleration. The PVC is qnap-iscsi RWO with no PV node affinity (Trident runs
# on every node), so moving nodes is a detach/attach: a brief outage, not a data move.
#
# Reachability: ClusterIP `postgres` for clients, headless `postgres-headless` for the
# StatefulSet identity. No Ingress/Tailscale/Cloudflare object exists for it.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: memory
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: memory
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: memory
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  serviceName: postgres-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # olympus-sdk#567: the memory stack runs on the agent-services onodes (onode-0636e4/062caa).
      nodeSelector:
        olympus.io/role: agent-services
      tolerations:
        - key: olympus.io/role
          operator: Equal
          value: agent-services
          effect: NoSchedule
      containers:
        - name: postgres
          # pgvector/pgvector:pg16 (= 0.8.7-pg16, Debian bookworm), multi-arch index
          # digest resolved from the Docker Hub registry API on 2026-10-20. To bump:
          # re-resolve the digest for the new tag and update tag + digest together.
          image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: memory
            # Only read on the FIRST start (empty PGDATA). Rotating the 1Password
            # field later does not change the role password: ALTER ROLE it (README).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stores
                  key: postgres-password
            # Subdirectory of the mount: the ext4 volume root has lost+found, which
            # initdb refuses to use as a data directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, memory]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, memory]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, memory]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          configMap:
            name: postgres-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: qnap-iscsi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
