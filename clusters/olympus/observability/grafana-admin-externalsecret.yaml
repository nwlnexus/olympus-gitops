apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  # ESO matches 1Password fields by LABEL on olympus-obs-stack:
  #   obs-stack-user = Grafana admin username, obs-stack-pass = admin password.
  data:
    - secretKey: admin-user
      remoteRef:
        key: olympus-obs-stack
        property: obs-stack-user
    - secretKey: admin-password
      remoteRef:
        key: olympus-obs-stack
        property: obs-stack-pass
