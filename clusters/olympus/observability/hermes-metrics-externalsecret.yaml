# Bearer token for Prometheus's `hermes` scrape job (GET https://api.nwlnexus.io/metrics, olympus-sdk#1165).
# The token is a Hermes API token holding only `metrics:read` and the `read-only` marker, minted by the owner in
# IRIS (Admin, API tokens) and kept in 1Password vault Dev, item `hermes-metrics`, field `token`. Prometheus
# mounts the Secret as /etc/prometheus/hermes/token (prometheus-helmrelease.yaml, server.extraSecretMounts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-metrics-token
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: hermes-metrics-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hermes-metrics
        property: token
