apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  # The healthchecks.io ping URL for the Watchdog dead-man's switch (https://hc-ping.com/<uuid>). Mounted
  # into the Alertmanager pod as /etc/alertmanager/deadman/ping_url (webhook url_file), so the URL stays
  # out of the alertmanager ConfigMap. The 1Password item must exist before this is applied: without the
  # Secret the Alertmanager pod cannot mount it and does not start.
  target:
    name: alertmanager-deadman
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ping_url
      remoteRef:
        key: alertmanager-deadman
        property: ping_url
