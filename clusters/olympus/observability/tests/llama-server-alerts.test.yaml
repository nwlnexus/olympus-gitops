# Unit tests for the llama-server alerts (olympus-sdk#588).
# Run with tests/check_prometheus.py (it extracts the rules from the HelmRelease first).
rule_files:
  - alerting_rules.yml
evaluation_interval: 1m

tests:
  # --- DataHubLlamaServerWedged: processing > 0 and no decode progress for 10m, for 5m ----------
  - name: a request in flight with a frozen decode counter fires
    interval: 1m
    input_series:
      - series: 'llamacpp:requests_processing{instance="100.95.232.41:8082",instance_name="llama-qwen25-7b",host="datahub"}'
        values: "1x40"
      - series: 'llamacpp:n_decode_total{instance="100.95.232.41:8082",instance_name="llama-qwen25-7b",host="datahub"}'
        values: "100x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: DataHubLlamaServerWedged
        exp_alerts: []
      - eval_time: 25m
        alertname: DataHubLlamaServerWedged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: "100.95.232.41:8082"
            exp_annotations:
              summary: "llama-server 100.95.232.41:8082 has a request in flight but is not decoding."
              description: "llamacpp:requests_processing has been above 0 with no decode progress for 15m on 100.95.232.41:8082. The server is wedged; the data-hub watchdog should have restarted it. Check the llama-server launchd job and log on data-hub."

  - name: a busy server that keeps decoding, and an idle one, are quiet
    interval: 1m
    input_series:
      - series: 'llamacpp:requests_processing{instance="100.95.232.41:8081",host="datahub"}'
        values: "1x40"
      - series: 'llamacpp:n_decode_total{instance="100.95.232.41:8081",host="datahub"}'
        values: "0+10x40"
      - series: 'llamacpp:requests_processing{instance="100.95.232.41:8083",host="datahub"}'
        values: "0x40"
      - series: 'llamacpp:n_decode_total{instance="100.95.232.41:8083",host="datahub"}'
        values: "50x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: DataHubLlamaServerWedged
        exp_alerts: []

  # --- InferenceInstanceRestarted (any reset in 15m) and InferenceInstanceRestartLoop (>= 3 in 1h) ---
  - name: one reset fires Restarted on that instance only; the loop alert stays quiet
    interval: 1m
    input_series:
      - series: 'llamacpp:n_decode_total{instance="100.89.177.55:8081",instance_name="llama-qwen36-27b",host="a9"}'
        values: "100 200 300 5 50 100 150 200 250 300 350 400"
      - series: 'llamacpp:n_decode_total{instance="100.95.232.41:8081",instance_name="llama-qwen36-27b",host="datahub"}'
        values: "100 200 300 400 500 600 700 800 900 1000 1100 1200"
    alert_rule_test:
      - eval_time: 11m
        alertname: InferenceInstanceRestarted
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: "100.89.177.55:8081"
              instance_name: llama-qwen36-27b
              host: a9
            exp_annotations:
              summary: "llama-server llama-qwen36-27b on a9 restarted."
              description: "The llamacpp:n_decode_total counter on 100.89.177.55:8081 reset in the last 15m: the process restarted (crash, watchdog or deploy). A one-off after a deploy is expected; repeats mean InferenceInstanceRestartLoop. Check the inference-server-* unit (a9) or the launchd job (data-hub) and its watchdog log."
      - eval_time: 11m
        alertname: InferenceInstanceRestartLoop
        exp_alerts: []

  - name: three resets within the hour fire the loop alert, two do not
    interval: 1m
    input_series:
      - series: 'llamacpp:n_decode_total{instance="100.95.232.41:8082",instance_name="llama-qwen25-7b",host="datahub"}'
        values: "100 200 5 50 3 40 2 40 80 120 160 200"
      - series: 'llamacpp:n_decode_total{instance="100.89.177.55:8082",instance_name="llama-qwen35-9b",host="a9"}'
        values: "100 200 300 5 50 100 3 40 80 120 160 200"
    alert_rule_test:
      - eval_time: 11m
        alertname: InferenceInstanceRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: "100.95.232.41:8082"
              instance_name: llama-qwen25-7b
              host: datahub
            exp_annotations:
              summary: "llama-server llama-qwen25-7b on datahub restarted 3 times in the last hour."
              description: "The llamacpp:n_decode_total counter reset 3 times in 1h on 100.95.232.41:8082: the process is crash-looping or its watchdog keeps killing it. Read the server log and the watchdog's decision log."

  - name: a steadily increasing counter never fires either alert
    interval: 1m
    input_series:
      - series: 'llamacpp:n_decode_total{instance="100.89.177.55:8083",host="a9"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: InferenceInstanceRestarted
        exp_alerts: []
      - eval_time: 45m
        alertname: InferenceInstanceRestartLoop
        exp_alerts: []

  # --- MemoryExtractLLMFailing: >= 3 failures and 0 ok in 30m, for 10m --------------------------
  - name: failures with no successes fire after 10m
    interval: 1m
    input_series:
      - series: 'memory_worker_llm_requests_total{alias="memory-extract",outcome="timeout"}'
        values: "0+1x60"
      - series: 'memory_worker_llm_requests_total{alias="memory-extract",outcome="ok"}'
        values: "5x60"
    alert_rule_test:
      - eval_time: 8m
        alertname: MemoryExtractLLMFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: MemoryExtractLLMFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The memory-extract LLM alias is failing and nothing is succeeding."
              description: "At least 3 memory-extract requests failed (timeout, http_5xx or network_error) in 30m with no successes. Check LiteLLM and llama-server (qwen25-7b, :8082) on data-hub."

  - name: failures alongside successes, or too few failures, are quiet
    interval: 1m
    input_series:
      - series: 'memory_worker_llm_requests_total{alias="memory-extract",outcome="http_5xx"}'
        values: "0+1x60"
      - series: 'memory_worker_llm_requests_total{alias="memory-extract",outcome="ok"}'
        values: "0+1x60"
      - series: 'memory_worker_llm_requests_total{alias="memory-embed",outcome="timeout"}'
        values: "0+5x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: MemoryExtractLLMFailing
        exp_alerts: []
