# Unit tests for the ci-runners-macos group (olympus-sdk#392): the native macOS JIT runners' heartbeat gauges, pushed
# over OTLP by nix-darwin-hm's io.olympus.ci-runner-heartbeat and remote-written by the otel collector as
# {job="ci-runner", host_name="<host>"} (plus service_name and otel_scope_name, kept here to match the real series).
# Run with tests/check_prometheus.py (it extracts the rules from the HelmRelease first).
rule_files:
  - alerting_rules.yml
evaluation_interval: 1m

tests:
  # --- never reported: nothing fires ------------------------------------------------------------
  - name: a healthy host and hosts that never reported raise nothing
    interval: 1m
    input_series:
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="data-hub", service_name="ci-runner", otel_scope_name="io.olympus.ci-runner-heartbeat"}'
        values: "1x60"
      - series: 'ci_runner_runner_up{job="ci-runner", host_name="data-hub", service_name="ci-runner", otel_scope_name="io.olympus.ci-runner-heartbeat"}'
        values: "1x60"
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="data-hub", service_name="ci-runner", otel_scope_name="io.olympus.ci-runner-heartbeat"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: MacCIRunnerDaemonDown
        exp_alerts: []
      - eval_time: 60m
        alertname: MacCIRunnerWipeFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: MacCIRunnerNotRegistered
        exp_alerts: []

  # --- MacCIRunnerHeartbeatMissing ----------------------------------------------------------------
  - name: a host that stops pushing fires after the 5m lookback plus 10m; the one still pushing does not
    interval: 1m
    input_series:
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x30 _x60"
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts: []
      # last sample at 30m, absent from 36m, firing after 10m pending
      - eval_time: 40m
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts: []
      - eval_time: 50m
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-01
            exp_annotations:
              summary: "No CI runner heartbeat from mmini-01 for 15m."
              description: "mmini-01 reported within the last 7 days but has pushed no ci_runner_* gauges for about 15m. The Mac is down or asleep, off the tailnet, or its heartbeat daemon fails (`sudo launchctl print system/io.olympus.ci-runner-heartbeat`, `sudo cat /var/log/ci-runner-heartbeat.log`). Its runner may still take jobs; check the org runners list. A host retired on purpose keeps firing for 7 days."

  - name: a host last seen more than 7 days ago no longer fires
    interval: 1h
    input_series:
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x2 _x200"
    alert_rule_test:
      - eval_time: 24h
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-02
            exp_annotations:
              summary: "No CI runner heartbeat from mmini-02 for 15m."
              description: "mmini-02 reported within the last 7 days but has pushed no ci_runner_* gauges for about 15m. The Mac is down or asleep, off the tailnet, or its heartbeat daemon fails (`sudo launchctl print system/io.olympus.ci-runner-heartbeat`, `sudo cat /var/log/ci-runner-heartbeat.log`). Its runner may still take jobs; check the org runners list. A host retired on purpose keeps firing for 7 days."
      # last sample at 2h; 7d later (170h) it has aged out
      - eval_time: 180h
        alertname: MacCIRunnerHeartbeatMissing
        exp_alerts: []

  # --- MacCIRunnerDaemonDown ----------------------------------------------------------------------
  - name: the loop daemon not running fires after 10m; a launchd restart blip does not
    interval: 1m
    input_series:
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x5 0x30"
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="data-hub", service_name="ci-runner"}'
        values: "1x5 0 1x29"
    alert_rule_test:
      - eval_time: 12m
        alertname: MacCIRunnerDaemonDown
        exp_alerts: []
      - eval_time: 20m
        alertname: MacCIRunnerDaemonDown
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-01
            exp_annotations:
              summary: "The CI runner daemon on mmini-01 is not running."
              description: "launchd reports io.olympus.ci-runner as not running for 10m, so mmini-01 takes no macOS jobs. On the host (LAN sshd, admin): `sudo launchctl print system/io.olympus.ci-runner`, `sudo tail -n 50 /var/log/ci-runner.log`, then `sudo launchctl kickstart -k system/io.olympus.ci-runner` (arc/README.md, Runbook \"macOS runners\")."

  # --- MacCIRunnerWipeFailing ---------------------------------------------------------------------
  - name: a wipe failing for 15m fires; one failed wipe that the next iteration fixes does not
    interval: 1m
    input_series:
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x5 0x30"
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x5 0x3 1x27"
    alert_rule_test:
      - eval_time: 15m
        alertname: MacCIRunnerWipeFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: MacCIRunnerWipeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-01
            exp_annotations:
              summary: "The runner user wipe keeps failing on mmini-01."
              description: "The last wipe of _ghrunner on mmini-01 failed and has not succeeded for 15m; the loop registers no runner until it does, so the host takes no jobs. The log names what survived (processes, launchd services, files): `sudo grep 'wipe:' /var/log/ci-runner.log | tail`. Something a job left behind that the wipe cannot remove needs a look before it is cleared by hand."

  # --- MacCIRunnerNotRegistered -------------------------------------------------------------------
  - name: loop up with no runner for 30m fires; a failing wipe raises only MacCIRunnerWipeFailing
    interval: 1m
    input_series:
      # mmini-01: loop running, wipe fine, no runner (credentials or API)
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x50"
      - series: 'ci_runner_runner_up{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x5 0x45"
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="mmini-01", service_name="ci-runner"}'
        values: "1x50"
      # mmini-02: no runner because the wipe fails
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x50"
      - series: 'ci_runner_runner_up{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x5 0x45"
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="mmini-02", service_name="ci-runner"}'
        values: "1x5 0x45"
      # data-hub: the runner restarts between jobs (seconds; one sample at 0) and keeps running
      - series: 'ci_runner_daemon_up{job="ci-runner", host_name="data-hub", service_name="ci-runner"}'
        values: "1x50"
      - series: 'ci_runner_runner_up{job="ci-runner", host_name="data-hub", service_name="ci-runner"}'
        values: "1x10 0 1x39"
      - series: 'ci_runner_last_wipe_ok{job="ci-runner", host_name="data-hub", service_name="ci-runner"}'
        values: "1x50"
    alert_rule_test:
      - eval_time: 30m
        alertname: MacCIRunnerNotRegistered
        exp_alerts: []
      - eval_time: 45m
        alertname: MacCIRunnerNotRegistered
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-01
            exp_annotations:
              summary: "mmini-01 has had no registered CI runner for 30m."
              description: "The runner loop on mmini-01 is running but no runner of _ghrunner has been up for 30m, so the host takes no jobs. `sudo tail -n 50 /var/log/ci-runner.log`: \"waiting for the credential files\", \"could not get a JIT config\" (App key or installation, GitHub API) or \"network isolation not in force\" (pf)."
      - eval_time: 45m
        alertname: MacCIRunnerWipeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              host_name: mmini-02
            exp_annotations:
              summary: "The runner user wipe keeps failing on mmini-02."
              description: "The last wipe of _ghrunner on mmini-02 failed and has not succeeded for 15m; the loop registers no runner until it does, so the host takes no jobs. The log names what survived (processes, launchd services, files): `sudo grep 'wipe:' /var/log/ci-runner.log | tail`. Something a job left behind that the wipe cannot remove needs a look before it is cleared by hand."
