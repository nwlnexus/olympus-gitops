# Tailnet-only remote-write receiver endpoint for the mgmt Prometheus, so per-cluster
# otel collectors can remote-write metrics over the tailnet (never CF). The remote-write
# receiver is already enabled (--web.enable-remote-write-receiver). Tailnet-only (no funnel).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ts
  namespace: observability
  annotations:
    tailscale.com/hostname: "obs-prometheus"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
