# Bearer token for the blackbox exporter's authenticated LiteLLM /v1/models probe (olympus-sdk#649).
# Same 1Password field as inference/externalsecret.yaml (ExternalSecret litellm-monitor-key there);
# ESO syncs it a second time here because a Secret cannot be mounted across namespaces. The exporter
# mounts it as /etc/blackbox/litellm/token (blackbox-exporter-helmrelease.yaml, module litellm_models).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-monitor-key
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: litellm-monitor-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: litellm-cluster
        property: monitor-key
