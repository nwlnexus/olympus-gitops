apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      # Pinned. Source: https://prometheus-community.github.io/helm-charts
      # (HelmRepository prometheus-community). Chart tgz sha256 (index digest):
      # e341b17f202c7ff95cae056d23a481d8080aa3dc1dbaaa5d68296595b8b90ace
      # appVersion v0.29.0 (image quay.io/prometheus/blackbox-exporter, chart default tag).
      version: "11.20.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Probes the data-hub host services (Mac Studio, not a cluster) from inside the
    # cluster, over the tailnet, so a service that is up on localhost but not on its
    # tailnet address is still seen as down. Scraped by the prometheus-server
    # `blackbox-*` jobs (extraScrapeConfigs in prometheus-helmrelease.yaml).
    # Service: blackbox-exporter.observability.svc:9115
    fullnameOverride: blackbox-exporter
    replicas: 1
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
    # Bearer token of the LiteLLM `monitor` client (olympus-sdk#649): Secret litellm-monitor-key
    # (litellm-monitor-externalsecret.yaml), read by module litellm_models below.
    extraSecretMounts:
      - name: litellm-monitor-key
        secretName: litellm-monitor-key
        mountPath: /etc/blackbox/litellm
        readOnly: true
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: "ip4"
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: "ip4"
        # Authenticated GET /v1/models on the cluster LiteLLM (olympus-sdk#649). The token file is
        # re-read on every probe, so a rotated key needs no restart. The probe fails when the body
        # lacks any configured alias (inference/litellm-config.yaml; the `monitor` scope in
        # inference/litellm.yaml lists the same four), which covers an empty list too.
        litellm_models:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1"]
            valid_status_codes: [200]
            preferred_ip_protocol: "ip4"
            authorization:
              type: Bearer
              credentials_file: /etc/blackbox/litellm/token
            fail_if_body_not_matches_regexp:
              - '"id"\s*:\s*"memory-extract"'
              - '"id"\s*:\s*"coder-light"'
              - '"id"\s*:\s*"coder-medium"'
              - '"id"\s*:\s*"coder-heavy"'
