apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "6.55.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  # S3 credentials injected from the obs-s3 ESO secret (kept out of Git).
  valuesFrom:
    - kind: Secret
      name: obs-s3
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: obs-s3
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: loki.storage.s3.secretAccessKey
  values:
    # Single-binary mode — right scale for a homelab; chunks on QNAP S3.
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: https://192.168.253.10:8010
          region: us-east-1
          s3ForcePathStyle: true
          insecure: false
          # QNAP S3 serves a self-signed cert → skip verification.
          http_config:
            insecure_skip_verify: true
      limits_config:
        retention_period: 744h   # 31d
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      # Keep WAL/cache local on qnap-iscsi.
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: qnap-iscsi
        size: 10Gi
    # Disable the SSD/distributed components + caches + test/canary for single-binary.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
