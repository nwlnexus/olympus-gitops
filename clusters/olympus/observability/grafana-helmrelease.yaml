apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    # Admin creds from 1Password (olympus-obs-stack) via the grafana-admin secret.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Dashboards/users on qnap-iscsi (Trident now applies fsGroup via fsType=ext4;
    # Grafana runs as uid 472).
    # The data volume is a ReadWriteOnce qnap-iscsi PVC: a RollingUpdate starts the new pod before the old
    # one releases the volume, so it can never attach (2026-10-27: Init stuck 6h, Flux upgrade stalled).
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      storageClassName: qnap-iscsi
      size: 5Gi
    # Prometheus datasource (in-cluster). Loki/Tempo added in Phase 3.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-server.observability.svc.cluster.local
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.observability.svc.cluster.local:3100
            access: proxy
          - name: Tempo
            type: tempo
            uid: tempo
            url: http://tempo.observability.svc.cluster.local:3100
            access: proxy
          # Prometheus Alertmanager, so firing/resolved alerts (and silences) are visible under
          # Grafana → Alerting with the "Alertmanager" picker; the alert e-mails link here too.
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            url: http://prometheus-alertmanager.observability.svc.cluster.local:9093
            access: proxy
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
    # File-based dashboard provider + grafana.com dashboard import (downloaded by an
    # init container at startup; needs egress to grafana.com).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          # Dashboards kept as code in this repo (dashboards/*.json -> ConfigMap via kustomize), mounted by
          # `dashboardsConfigMaps` below at /var/lib/grafana/dashboards/agents.
          - name: agents
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/agents
    dashboardsConfigMaps:
      agents: grafana-dashboard-agent-sessions
    dashboards:
      default:
        # "Traefik Official Kubernetes Dashboard" (native v3 Prometheus metrics).
        traefik-official-k8s:
          gnetId: 17347
          revision: 9
          datasource: Prometheus
        # Node Exporter Full — node CPU/mem/disk/net (filter by cluster/instance).
        node-exporter-full:
          gnetId: 1860
          revision: 45
          datasource: Prometheus
        # Kubernetes object state from kube-state-metrics.
        kube-state-metrics-v2:
          gnetId: 13332
          revision: 12
          datasource: Prometheus
    grafana.ini:
      server:
        root_url: https://grafana.nwlnexus.net
    service:
      type: ClusterIP
    # UI is exposed via Traefik IngressRoute (grafana.nwlnexus.net), not the chart ingress.
    ingress:
      enabled: false
