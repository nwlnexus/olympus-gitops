apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: grafana.nwlnexus.net
    external-dns.alpha.kubernetes.io/target: ing.compute.nwlnexus.net
    # App-launcher discovery (issue #117) — canary opt-in.
    launcher.olympus.io/enabled: "true"
    launcher.olympus.io/display-name: "Grafana"
    launcher.olympus.io/group: "Observability"
    launcher.olympus.io/icon: "gauge"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.nwlnexus.net`)
      kind: Rule
      services:
        - name: grafana
          port: 80
  tls:
    secretName: grafana-tls
