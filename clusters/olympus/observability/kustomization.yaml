apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - helmrepository.yaml
  - blackbox-exporter-helmrelease.yaml
  - prometheus-helmrelease.yaml
  - grafana-admin-externalsecret.yaml
  - grafana-helmrelease.yaml
  - grafana-certificate.yaml
  - grafana-ingressroute.yaml
  - loki-helmrelease.yaml
  - tempo-helmrelease.yaml
  - tempo-tailscale-service.yaml
  - loki-tailscale-service.yaml
  - prometheus-tailscale-service.yaml
  - alertmanager-resend-externalsecret.yaml
configMapGenerator:
  # Grafana dashboards as code; mounted by the `agents` dashboard provider in grafana-helmrelease.yaml.
  # The name is fixed (no hash suffix) because the HelmRelease values refer to it.
  - name: grafana-dashboard-agent-sessions
    namespace: observability
    files:
      - dashboards/agent-sessions.json
    options:
      disableNameSuffixHash: true
