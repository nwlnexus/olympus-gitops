apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "29.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Central metrics store: receives remote-write from the olympus otel agent
    # over the tailnet AND scrapes olympus's own targets.
    server:
      retention: "30d"
      persistentVolume:
        enabled: true
        storageClass: qnap-iscsi
        size: 50Gi
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Alertmanager → Resend email (Phase 7). Server auto-wires to the bundled AM.
    alertmanager:
      enabled: true
      persistence:
        enabled: true
        storageClass: qnap-iscsi
        size: 2Gi
      # Resend API key (ESO) mounted as a file → kept out of the alertmanager ConfigMap.
      extraSecretMounts:
        - name: resend
          secretName: alertmanager-resend
          mountPath: /etc/alertmanager/secrets
          readOnly: true
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp.resend.com:587
          smtp_from: alerts@mail.nwlnexus.net
          smtp_auth_username: resend
          smtp_auth_password_file: /etc/alertmanager/secrets/api_key
          smtp_require_tls: true
        route:
          receiver: email
          group_by: [alertname, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # Watchdog always fires; sink it (reserve for a future dead-man's-switch).
            - matchers:
                - 'alertname="Watchdog"'
              receiver: 'null'
        receivers:
          - name: email
            email_configs:
              - to: nigel.williamslucas@gmail.com
                send_resolved: true
          - name: 'null'
    # data-hub host probes via blackbox-exporter (observability/blackbox-exporter).
    # data-hub is a Mac Studio host, not a cluster; addresses are its tailnet IP
    # (100.95.232.41) on purpose: the probes must fail if a service is not bound to
    # the tailnet address (Postgres has been bound to 127.0.0.1 only since July after
    # a boot-time bind race with tailscaled; see DataHubPostgresNotOnTailnet).
    # TODO(olympus-sdk#447): add an authenticated LiteLLM /v1/models check (needs a
    # bearer key) and alert on an empty model list. Needs a Secret and a mechanism
    # beyond a plain http_2xx probe, so it is deferred until the key exists.
    extraScrapeConfigs: |
      - job_name: blackbox-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["blackbox-exporter.observability.svc:9115"]
      - job_name: blackbox-datahub-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://100.95.232.41:4000/health/liveliness"]
            labels:
              service: litellm
          - targets: ["http://100.95.232.41:8081/health"]
            labels:
              service: llama-qwen36-27b
          - targets: ["http://100.95.232.41:8082/health"]
            labels:
              service: llama-qwen25-7b
          - targets: ["http://100.95.232.41:8083/health"]
            labels:
              service: llama-nomic
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      - job_name: blackbox-datahub-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["100.95.232.41:5432"]
            labels:
              service: postgres
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # llama-server on data-hub (olympus-sdk#588): one instance per model, native /metrics.
      - job_name: datahub-llama-server
        metrics_path: /metrics
        scrape_interval: 30s
        static_configs:
          - targets: ["100.95.232.41:8081"]
            labels:
              instance_name: llama-qwen36-27b
          - targets: ["100.95.232.41:8082"]
            labels:
              instance_name: llama-qwen25-7b
          - targets: ["100.95.232.41:8083"]
            labels:
              instance_name: llama-nomic
      # Memory platform stores (olympus-sdk#449). TCP connect to the ClusterIP Services
      # in ns `memory`; allowed by the NetworkPolicy there (blackbox-exporter only).
      # The cluster has no Prometheus operator, so these static jobs (not
      # ServiceMonitors) are how the stores are watched. A tcp_connect to a Service
      # with no ready endpoints fails, so a down or NotReady pod reads as probe_success 0.
      - job_name: blackbox-memory-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["postgres.memory.svc:5432"]
            labels:
              service: memory-postgres
          - targets: ["falkordb.memory.svc:6379"]
            labels:
              service: memory-falkordb
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Memory gateway (olympus-sdk#450 task G10, design section 9): http_2xx probe of /readyz through
      # the ClusterIP Service, so a gateway with no ready endpoint, or one whose database is
      # unreachable, reads as probe_success 0. Allowed by the gateway NetworkPolicy
      # (memory/gateway/networkpolicy.yaml: blackbox-exporter -> 8080). The gateway's own metrics on
      # :9090 are scraped by the default `kubernetes-pods` job via the prometheus.io/* pod
      # annotations (checked against the live config), so no static job is needed for them.
      - job_name: blackbox-memory-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://memory-gateway.memory.svc/readyz"]
            labels:
              service: memory-gateway
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Memory embedder (olympus-sdk#529, epic #444): http_2xx probe of TEI's /health through the
      # ClusterIP Service, so a deployment with no ready endpoint (pods still downloading or warming
      # up the model, crashed, or the QNAP cache unavailable) reads as probe_success 0. Allowed by
      # memory/embedder/networkpolicy.yaml (blackbox-exporter -> 8080). The embedder's own metrics
      # (te_*) are scraped by the default `kubernetes-pods` job via the prometheus.io/* pod annotations.
      - job_name: blackbox-memory-embedder
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://memory-embedder.memory.svc/health"]
            labels:
              service: memory-embedder
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: fleet-infra
            rules:
              - alert: Watchdog
                expr: vector(1)
                labels:
                  severity: none
                annotations:
                  summary: "Alerting pipeline alive (always firing)."
              - alert: NodeFilesystemAlmostFull
                expr: >-
                  100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100
                  / node_filesystem_size_bytes) > 85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Filesystem >85% full on {{ $labels.cluster }}/{{ $labels.instance }} ({{ $labels.mountpoint }})."
              - alert: NodeHighMemory
                expr: >-
                  (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Memory >90% used on {{ $labels.cluster }}/{{ $labels.instance }}."
              - alert: KubeNodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} on {{ $labels.cluster }} not Ready >5m."
              # Cluster-aware reboot (olympus-sdk#304, design 2026-10-25 section 3.6): a node is
              # never left cordoned silently, whoever cordoned it (an Olympus reboot saga, the
              # system-upgrade-controller or a manual `kubectl cordon`). Independent of Hermes.
              # The expr and `for` are the design's, verbatim; severity and annotations are additions.
              - alert: OlympusNodeCordonedTooLong
                expr: kube_node_spec_unschedulable == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} on {{ $labels.cluster }} has been cordoned for more than 30m."
                  description: "{{ $labels.node }} is unschedulable. If an Olympus reboot saga owns it, `kubectl -n kube-system get lease olympus-node-maintenance` shows the saga id and node; recover per olympus-sdk docs/runbooks/2026-10-c2a-rollout.md section 16 (`atlas fleet sagas --active`). No Lease means someone else cordoned it (system-upgrade-controller, an operator): check before `kubectl uncordon`."
              - alert: KubePodCrashLooping
                expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.cluster }} crash-looping."
              - alert: TargetDown
                expr: up == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Target {{ $labels.job }} ({{ $labels.instance }}) on {{ $labels.cluster }} down >10m."
          - name: data-hub
            rules:
              # Fires per probed data-hub service (litellm, llama-*). Postgres has its own
              # alert below, so it is excluded here to avoid a duplicate page.
              # TODO: raise litellm to severity critical once the memory workers depend
              # on it (olympus-sdk#444 wave 2+); route-by-label is already in place via
              # the `service` label.
              - alert: DataHubServiceDown
                expr: probe_success{job=~"blackbox-datahub-.*", service!="postgres"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "data-hub service {{ $labels.service }} is failing its probe for >10m."
                  description: "Probe of {{ $labels.instance }} (job {{ $labels.job }}) from the cluster has failed for 10m. Check the service on data-hub and that it is bound to the tailnet IP."
              # The failure that went unnoticed from July: Postgres bound to 127.0.0.1
              # only. The probe targets the tailnet address, so this fires in that case.
              - alert: DataHubPostgresNotOnTailnet
                expr: probe_success{job="blackbox-datahub-tcp", service="postgres"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Postgres on data-hub is not accepting connections on its tailnet address."
                  description: "TCP connect to {{ $labels.instance }} has failed for 10m. Known cause: the boot-time bind race, where postgres starts before tailscaled is up, fails to bind the tailnet IP and falls back to 127.0.0.1 only. Check `lsof -iTCP:5432 -sTCP:LISTEN` on data-hub and restart the Postgres LaunchDaemon once tailscaled is up."
              # llama-server (olympus-sdk#588). Wedged: a request holds a slot but no token has been
              # decoded for 10m (the watchdog on data-hub restarts it; this alerts if that fails).
              - alert: DataHubLlamaServerWedged
                expr: max by (instance) (llamacpp:requests_processing) > 0 and on(instance) increase(llamacpp:n_decode_total[10m]) == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "llama-server {{ $labels.instance }} has a request in flight but is not decoding."
                  description: "llamacpp:requests_processing has been above 0 with no decode progress for 15m on {{ $labels.instance }}. The server is wedged; the data-hub watchdog should have restarted it. Check the llama-server launchd job and log on data-hub."
              - alert: DataHubLlamaServerRestarting
                expr: resets(llamacpp:n_decode_total[1h]) >= 2
                labels:
                  severity: warning
                annotations:
                  summary: "llama-server {{ $labels.instance }} restarted {{ $value }} times in the last hour."
                  description: "The llamacpp:n_decode_total counter reset at least twice in 1h on {{ $labels.instance }}: the process is crash-looping or the watchdog keeps restarting it. Check the llama-server log on data-hub."
              - alert: MemoryExtractLLMFailing
                expr: sum(increase(memory_worker_llm_requests_total{alias="memory-extract",outcome=~"timeout|http_5xx|network_error"}[30m])) >= 3 and sum(increase(memory_worker_llm_requests_total{alias="memory-extract",outcome="ok"}[30m])) == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "The memory-extract LLM alias is failing and nothing is succeeding."
                  description: "At least 3 memory-extract requests failed (timeout, http_5xx or network_error) in 30m with no successes. Check LiteLLM and llama-server (qwen25-7b, :8082) on data-hub."
              - alert: BlackboxExporterDown
                expr: absent(up{job="blackbox-exporter"} == 1)
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "blackbox-exporter is not being scraped successfully (data-hub probes are blind)."
          - name: memory
            rules:
              # Memory platform stores (ns memory): probes come from the
              # blackbox-memory-tcp job above.
              - alert: MemoryStoreDown
                expr: probe_success{job="blackbox-memory-tcp"} == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Memory store {{ $labels.service }} is not accepting connections."
                  description: "TCP connect to {{ $labels.instance }} from the cluster has failed for 10m. Check `kubectl -n memory get pods,pvc` and the pod logs; a missing Secret `memory-stores` (1Password item of the same name) or an unattached iSCSI volume are the usual causes."
              # kubelet_volume_stats_* is exposed twice (jobs kubernetes-nodes and
              # kubernetes-api-servers), hence max by (...). Covers the two data PVCs
              # (data-postgres-0, data-falkordb-0) and the NFS backup PVC when it reports stats.
              - alert: MemoryStorePVCFillingUp
                expr: >-
                  max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="memory"})
                  / max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="memory"})
                  > 0.8
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "PVC {{ $labels.persistentvolumeclaim }} in ns memory is {{ $value | humanizePercentage }} full."
                  description: "qnap-iscsi allows online expansion: patch the PVC's spec.resources.requests.storage (StatefulSet volumeClaimTemplates are immutable, so see memory/README.md for the procedure)."
              # No successful backup for 36h, or no success ever and the CronJob is
              # already older than 36h (kube_cronjob_status_last_successful_time is
              # absent until the first success).
              - alert: MemoryBackupStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="memory"} > 129600)
                  or
                  (
                    time() - kube_cronjob_created{namespace="memory"} > 129600
                    unless on (namespace, cronjob)
                    kube_cronjob_status_last_successful_time{namespace="memory"}
                  )
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "CronJob {{ $labels.cronjob }} in ns memory has had no successful run for >36h."
                  description: "Check `kubectl -n memory get jobs,pods` and the Job logs; the backup PVC memory-backups (qnap-nfs) being unwritable or full is the likely cause."
              # Memory gateway and queue (olympus-sdk#450 task G10, design section 9). The queue
              # gauges are exported by the gateway (Q-QUEUE-METRICS, every 30 s, both replicas, hence
              # max by); scraped through the kubernetes-pods job. The expr/for/severity are the
              # design's, verbatim; the annotations are additions.
              - alert: MemoryQueueBacklogOld
                expr: max by (stage) (memory_queue_oldest_pending_age_seconds{stage=~"extract|embed|graph_ingest"}) > 14400
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has a job pending for more than 4h."
                  description: "The oldest pending `{{ $labels.stage }}` job is {{ $value | humanizeDuration }} old. Workers (olympus-sdk#453) are not keeping up or are down; LiteLLM on data-hub is the usual dependency. `kubectl -n memory exec deploy/memory-gateway -- node dist/admin/cli.js queue stats`."
              - alert: MemoryQueueBacklogStuck
                expr: max by (stage) (memory_queue_oldest_pending_age_seconds) > 86400
                for: 30m
                labels: { severity: critical }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has a job pending for more than 24h."
                  description: "The oldest pending `{{ $labels.stage }}` job is {{ $value | humanizeDuration }} old. Captured memory is not being processed."
              - alert: MemoryQueueDeadLetters
                expr: max by (stage) (memory_queue_jobs{state="dead"}) > 0
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has dead jobs."
                  description: "{{ $value }} `{{ $labels.stage }}` job(s) exhausted their attempts. Inspect with `queue stats`, fix the cause, then `queue requeue-dead` (memory-admin CLI in the gateway image)."
              # The "fifth unused memory system" alarm (design section 9 / platform spec section 9).
              # Note: a counter with labels has no series until its first increment, so this stays
              # silent (empty vector) on a gateway that has never received a capture, and for 24h
              # after the last one; that is the design's expression, kept as written.
              - alert: MemoryCaptureStalled
                expr: sum(increase(memory_capture_received_total{result="created"}[24h])) == 0
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "No memory capture was stored in the last 24h."
                  description: "Hooks are not delivering (gateway key revoked, hook broken after a Claude Code upgrade, gateway unreachable) or nobody used Claude Code. Check the gateway logs and `memory_capture_received_total`."
              # probe: job blackbox-memory-http, /readyz through the blackbox exporter.
              - alert: MemoryGatewayDown
                expr: probe_success{job="blackbox-memory-http"} == 0   # http probe of /readyz via the blackbox exporter
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "The memory gateway is not ready."
                  description: "GET {{ $labels.instance }} has failed for 10m: no ready gateway pod, or Postgres (or the Access JWKS, when configured) is unreachable. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-gateway` and the pod logs."
              # --- Memory embedder (olympus-sdk#529): text-embeddings-inference on CPU, ns memory ---------
              # probe: job blackbox-memory-embedder, /health through the Service. Any ready replica
              # keeps it green, so this means NO replica can serve (the real outage).
              - alert: MemoryEmbedderDown
                expr: probe_success{job="blackbox-memory-embedder"} == 0
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "The memory embedder is not serving."
                  description: "GET {{ $labels.instance }} has failed for 10m: no ready embedder pod. Embeddings (worker embed stage, gateway recall) are failing or queueing. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder`; Init:Error means the model download from huggingface.co or the cache PVC failed (`kubectl -n memory logs <pod> -c fetch-model`), otherwise the pod logs."
              # The pods' own series, scraped by the kubernetes-pods job. absent() covers "no pod is
              # being scraped at all", which the probe cannot tell apart from a slow start.
              - alert: MemoryEmbedderMetricsAbsent
                expr: absent(up{job="kubernetes-pods", namespace="memory", app_kubernetes_io_name="memory-embedder"} == 1)
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "No memory embedder pod is being scraped."
                  description: "Prometheus has had no successful scrape of any memory-embedder pod for 10m (not running, not scheduled, or the NetworkPolicy/annotations are wrong). `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder -o wide`."
              - alert: MemoryEmbedderDegraded
                expr: count(up{job="kubernetes-pods", namespace="memory", app_kubernetes_io_name="memory-embedder"} == 1) < 2
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "Only {{ $value }} of 2 memory embedder replicas is being scraped."
                  description: "One replica has been missing for 30m; capacity is halved and a second failure is an outage. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder -o wide` (a node drain, a stuck model download or a failed scheduling are the usual causes)."
              # te_request_count counts every request, te_request_success the 2xx ones; the rest are
              # 4xx/5xx (including 429 when --max-concurrent-requests is exceeded).
              - alert: MemoryEmbedderErrorRate
                expr: >-
                  (
                    1 - sum(rate(te_request_success{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))
                    / sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))
                  ) > 0.05
                  and sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m])) > 0.05
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "More than 5% of memory embedder requests are failing."
                  description: "{{ $value | humanizePercentage }} of /v1/embeddings requests failed over 5m. 429 means the replicas are saturated (see MemoryEmbedderSlow, scale the Deployment), 4xx means a client is sending bad input, 5xx means a pod problem (`kubectl -n memory logs deploy/memory-embedder`)."
              # End-to-end request time as the server sees it (queue + tokenisation + inference).
              # A healthy replica answers a 100-token fact in well under a second and a 2,000-token
              # document in a few seconds; sustained p95 above 8s means the pods are saturated.
              - alert: MemoryEmbedderSlow
                expr: >-
                  histogram_quantile(0.95, sum by (le) (rate(te_request_duration_bucket{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))) > 8
                  and sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m])) > 0.05
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Memory embedder p95 latency is above 8s."
                  description: "p95 /v1/embeddings latency is {{ $value | humanizeDuration }} over 5m. The embedder is saturated (offered load above its CPU capacity: see memory/embedder/README.md, \"Sizing\") or CPU-throttled on the node. Check `te_queue_size` and `kubectl -n memory top pods`."
          - name: agent-sessions
            rules:
              # Claude Code session telemetry (olympus-sdk#565, spec decision H12): the agent host and the Macs
              # export OTLP to the otel collector (otel-collector/helmrelease.yaml, pipeline metrics/agents),
              # which sums the delta counters and remote-writes them here. `account` is the resource attribute
              # nix sets per Claude account (personal, work). Thresholds are a first guess: tune them from the
              # "agent sessions" dashboard after a week of data.
              - alert: AgentTokensPerHourHigh
                expr: >-
                  sum by (account) (increase(claude_code_token_usage_tokens_total{type!="cacheRead"}[1h])) > 10000000
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Account {{ $labels.account }} used more than 10M input, output and cache-write tokens in the last hour."
                  description: "{{ $value | humanize }} tokens (cache reads excluded) in the last hour for account {{ $labels.account }}. Open the \"agent sessions\" dashboard (tokens by repo and model) to find the runaway session; a looping goal or a fan-out of subagents is the usual cause."
              - alert: AgentCostPerHourHigh
                expr: >-
                  sum by (account) (increase(claude_code_cost_usage_USD_total[1h])) > 25
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Account {{ $labels.account }} spent more than $25 in the last hour."
                  description: "${{ $value | humanize }} of API cost in the last hour for account {{ $labels.account }}. Open the \"agent sessions\" dashboard (cost by repo and model) to find the runaway session; a looping goal or a fan-out of subagents is the usual cause."
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
      # Surface `cluster` on mgmt's kube_* series via the service-endpoints labelmap
      # (uniform with the remote clusters, whose otel relabel sets cluster).
      customLabels:
        cluster: olympus
    prometheus-node-exporter:
      enabled: false
