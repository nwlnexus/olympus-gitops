apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "29.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Central metrics store: receives remote-write from the olympus otel agent
    # over the tailnet AND scrapes olympus's own targets.
    server:
      retention: "30d"
      persistentVolume:
        enabled: true
        storageClass: qnap-iscsi
        size: 50Gi
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      resources:
        # Request = 7-day p95 working set 1862Mi x 1.2 = 2240Mi. Limit raised 2Gi -> 3Gi (owner decision
        # 2026-11-01): the 7-day peak of 1994Mi was 97% of the old limit (docs/sizing/2026-11-01-requests.md).
        requests:
          cpu: 40m
          memory: 2240Mi
        limits:
          memory: 3Gi
    # Alertmanager → Resend email (Phase 7). Server auto-wires to the bundled AM.
    configmapReload:
      prometheus:
        resources:
          # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
          requests:
            cpu: 10m
            memory: 48Mi
    alertmanager:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      # Alertmanager itself is ClusterIP-only; the "View in Alertmanager" button in the e-mails
      # opens Grafana's alert list instead (Alertmanager datasource in grafana-helmrelease.yaml).
      baseURL: https://grafana.nwlnexus.net/alerting/list
      # baseURL sets --web.external-url, and Alertmanager takes its PATH as the route prefix: the API moved
      # to /alerting/list/api/v2/alerts, Prometheus kept posting to /api/v2/alerts and got 404, and no alert
      # e-mail went out from 2026-10-29 to 2026-11-06 (4860 notifier errors). Keep the e-mail link, serve
      # the API at the root for Prometheus and the Grafana datasource.
      extraArgs:
        web.route-prefix: /
      persistence:
        enabled: true
        storageClass: qnap-iscsi
        size: 2Gi
      # Resend API key (ESO) mounted as a file → kept out of the alertmanager ConfigMap.
      extraSecretMounts:
        - name: resend
          secretName: alertmanager-resend
          mountPath: /etc/alertmanager/secrets
          readOnly: true
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp.resend.com:587
          smtp_from: alerts@mail.nwlnexus.net
          smtp_auth_username: resend
          smtp_auth_password_file: /etc/alertmanager/secrets/api_key
          smtp_require_tls: true
        route:
          receiver: email
          group_by: [alertname, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # Watchdog always fires; sink it (reserve for a future dead-man's-switch).
            - matchers:
                - 'alertname="Watchdog"'
              receiver: 'null'
        receivers:
          - name: email
            email_configs:
              - to: nigel.williamslucas@gmail.com
                send_resolved: true
          - name: 'null'
    # data-hub host probes via blackbox-exporter (observability/blackbox-exporter).
    # data-hub is a Mac Studio host, not a cluster; addresses are its tailnet IP
    # (100.95.232.41) on purpose: the probes must fail if a service is not bound to
    # the tailnet address.
    extraScrapeConfigs: |
      - job_name: blackbox-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["blackbox-exporter.observability.svc:9115"]
      - job_name: blackbox-datahub-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://100.95.232.41:8082/health"]
            labels:
              service: llama-qwen25-7b
          - targets: ["http://100.95.232.41:8083/health"]
            labels:
              service: llama-nomic
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # llama-server on data-hub (olympus-sdk#588): one instance per model, native /metrics.
      - job_name: datahub-llama-server
        metrics_path: /metrics
        scrape_interval: 30s
        static_configs:
          - targets: ["100.95.232.41:8082"]
            labels:
              instance_name: llama-qwen25-7b
              host: datahub
          - targets: ["100.95.232.41:8083"]
            labels:
              instance_name: llama-nomic
              host: datahub
      # The five llama-server instances on the A9 (olympus-sdk#530/#569/#460). Reached over the
      # tailnet from tag:k8s (ACL tag:k8s -> tag:inference tcp:8081-8085); the inference
      # NetworkPolicy only governs pods in ns inference, not Prometheus egress. `host` separates
      # the two hosts for the restart alerts below.
      - job_name: a9-llama-server
        metrics_path: /metrics
        scrape_interval: 30s
        static_configs:
          - targets: ["100.89.177.55:8081"]
            labels:
              instance_name: llama-qwen36-27b
              host: a9
          - targets: ["100.89.177.55:8082"]
            labels:
              instance_name: llama-qwen35-9b
              host: a9
          - targets: ["100.89.177.55:8084"]
            labels:
              instance_name: llama-qwen36-35b-a3b
              host: a9
          - targets: ["100.89.177.55:8085"]
            labels:
              instance_name: llama-qwen36-27b-coder
              host: a9
          - targets: ["100.89.177.55:8083"]
            labels:
              instance_name: llama-nomic
              host: a9
      # Memory platform stores (olympus-sdk#449). TCP connect to the ClusterIP Services
      # in ns `memory`; allowed by the NetworkPolicy there (blackbox-exporter only).
      # The cluster has no Prometheus operator, so these static jobs (not
      # ServiceMonitors) are how the stores are watched. A tcp_connect to a Service
      # with no ready endpoints fails, so a down or NotReady pod reads as probe_success 0.
      - job_name: blackbox-memory-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["postgres.memory.svc:5432"]
            labels:
              service: memory-postgres
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Memory gateway (olympus-sdk#450 task G10, design section 9): http_2xx probe of /readyz through
      # the ClusterIP Service, so a gateway with no ready endpoint, or one whose database is
      # unreachable, reads as probe_success 0. Allowed by the gateway NetworkPolicy
      # (memory/gateway/networkpolicy.yaml: blackbox-exporter -> 8080). The gateway's own metrics on
      # :9090 are scraped by the default `kubernetes-pods` job via the prometheus.io/* pod
      # annotations (checked against the live config), so no static job is needed for them.
      - job_name: blackbox-memory-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://memory-gateway.memory.svc/readyz"]
            labels:
              service: memory-gateway
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Memory embedder (olympus-sdk#529, epic #444): http_2xx probe of TEI's /health through the
      # ClusterIP Service, so a deployment with no ready endpoint (pods still downloading or warming
      # up the model, crashed, or the QNAP cache unavailable) reads as probe_success 0. Allowed by
      # memory/embedder/networkpolicy.yaml (blackbox-exporter -> 8080). The embedder's own metrics
      # (te_*) are scraped by the default `kubernetes-pods` job via the prometheus.io/* pod annotations.
      - job_name: blackbox-memory-embedder
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://memory-embedder.memory.svc/health"]
            labels:
              service: memory-embedder
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Inference routing (olympus-sdk#569, HW11): LiteLLM in ns `inference`. A dedicated pod job (the
      # pods carry no prometheus.io/* annotations) so it can drop labels the generic kubernetes-pods
      # job would keep: `hashed_api_key` (LiteLLM writes the RAW presented key there when it refuses a
      # request) plus `client_ip` and `user_agent` (cardinality). Clients stay identifiable by
      # `api_key_alias` (= client name, inference/custom_auth.py). Allowed by
      # inference/networkpolicy.yaml (Prometheus -> 4000).
      - job_name: inference-litellm
        metrics_path: /metrics/
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [inference]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: litellm;4000
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        metric_relabel_configs:
          - regex: hashed_api_key|client_ip|user_agent
            action: labeldrop
      # LiteLLM readiness through its Service, and the A9 llama-server backends it routes to (the
      # data-hub 7B behind the coder-light fallback is probed by blackbox-datahub-http, under a
      # different `service` name, so InferenceAllBackendsDown selects both sides by name). llama-server
      # /health is a status read that does not take the inference slot; the A9's own watchdog polls it
      # too. Allowed by
      # inference/networkpolicy.yaml (blackbox-exporter -> 4000) and the tailnet ACL
      # (tag:k8s -> tag:inference tcp:8081-8085). Only llama-qwen35-9b (coder-light) has a data-hub
      # fallback (olympus-sdk#701); the other A9 backends have none.
      - job_name: blackbox-inference-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://litellm.inference.svc:4000/health/readiness"]
            labels:
              service: litellm
              host: cluster
          - targets: ["http://100.89.177.55:8081/health"]
            labels:
              service: llama-qwen36-27b
              host: a9
          - targets: ["http://100.89.177.55:8082/health"]
            labels:
              service: llama-qwen35-9b
              host: a9
          - targets: ["http://100.89.177.55:8084/health"]
            labels:
              service: llama-qwen36-35b-a3b
              host: a9
          - targets: ["http://100.89.177.55:8085/health"]
            labels:
              service: llama-qwen36-27b-coder
              host: a9
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # Authenticated LiteLLM model list (olympus-sdk#649, was #447): module litellm_models presents the
      # `monitor` client key and requires every configured alias in the /v1/models body. HTTP 200 with
      # an alias missing (or an empty list) gives probe_success 0 and probe_http_status_code 200
      # (LiteLLMModelListEmpty); 401/403/5xx or a timeout give probe_success 0 with another code.
      # Allowed by inference/networkpolicy.yaml (blackbox-exporter -> 4000).
      - job_name: blackbox-litellm-models
        metrics_path: /probe
        params:
          module: [litellm_models]
        scrape_interval: 1m
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://litellm.inference.svc:4000/v1/models"]
            labels:
              service: litellm
              host: cluster
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # CI egress proxy (olympus-sdk#407, ../ci-egress/, ../arc/README.md "Egress proxy"): an HTTPS GET through
      # squid as a runner makes it (module http_via_ci_egress). GitHub's /rate_limit does not count against the
      # unauthenticated API quota, which the CI jobs share (same public IP). probe_success 0 = the proxy is down,
      # refuses GitHub (allowlist) or GitHub is unreachable from it.
      - job_name: blackbox-ci-egress
        metrics_path: /probe
        params:
          module: [http_via_ci_egress]
        scrape_interval: 60s
        scrape_timeout: 15s
        static_configs:
          - targets: ["https://api.github.com/rate_limit"]
            labels:
              service: ci-egress-proxy
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      # ARC, the CI runner scale sets on the cluster (olympus-sdk#392, epic #383; ../arc/README.md, "Monitoring").
      # The controller and one listener pod per scale set serve metrics on the container port named
      # `metrics` (8080; ../arc/helmrelease-controller.yaml `metrics:`). Allowed by
      # ../arc/networkpolicy-metrics.yaml (Prometheus -> arc-system 8080 only). No `namespace` target
      # Embedded etcd of the k3s servers (olympus-sdk#908): k3s serves etcd's /metrics on <node-ip>:2381 with
      # `etcd-expose-metrics: true` (olympus-infra roles/k3s, tasks/etcd-metrics.yml; a host nftables table there
      # admits only the pod network and the cluster nodes to that port, which NetworkPolicy cannot do for a host
      # port). One target per etcd member, found by the label k3s puts on every server; instance = node name.
      - job_name: etcd
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_node_role_kubernetes_io_etcd]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.+)
            target_label: __address__
            replacement: $1:2381
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
      # label: the gha_* series carry their own `namespace` (the scale set's, arc-runners) and `name`
      # (the scale set) labels, which a target label would rename to exported_*.
      - job_name: arc-controller
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [arc-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name]
            regex: controller-manager;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      # One target per scale set. `scale_set` is added because the job counters and histograms
      # (gha_started/completed_jobs_total, gha_job_startup/execution_duration_seconds) carry no scale
      # set label of their own.
      - job_name: arc-listeners
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [arc-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name]
            regex: runner-scale-set-listener;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_actions_github_com_scale_set_name]
            target_label: scale_set
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: fleet-infra
            rules:
              - alert: Watchdog
                expr: vector(1)
                labels:
                  severity: none
                annotations:
                  summary: "Alerting pipeline alive (always firing)."
              - alert: NodeFilesystemAlmostFull
                expr: >-
                  100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100
                  / node_filesystem_size_bytes) > 85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Filesystem >85% full on {{ $labels.cluster }}/{{ $labels.instance }} ({{ $labels.mountpoint }})."
              - alert: NodeHighMemory
                expr: >-
                  (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Memory >90% used on {{ $labels.cluster }}/{{ $labels.instance }}."
              - alert: KubeNodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} on {{ $labels.cluster }} not Ready >5m."
              # Cluster-aware reboot (olympus-sdk#304, design 2026-10-25 section 3.6): a node is
              # never left cordoned silently, whoever cordoned it (an Olympus reboot saga, the
              # system-upgrade-controller or a manual `kubectl cordon`). Independent of Hermes.
              # The expr and `for` are the design's, verbatim; severity and annotations are additions.
              - alert: OlympusNodeCordonedTooLong
                expr: kube_node_spec_unschedulable == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} on {{ $labels.cluster }} has been cordoned for more than 30m."
                  description: "{{ $labels.node }} is unschedulable. If an Olympus reboot saga owns it, `kubectl -n kube-system get lease olympus-node-maintenance` shows the saga id and node; recover per olympus-sdk docs/runbooks/2026-10-c2a-rollout.md section 16 (`atlas fleet sagas --active`). No Lease means someone else cordoned it (system-upgrade-controller, an operator): check before `kubectl uncordon`."
              - alert: KubePodCrashLooping
                expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.cluster }} crash-looping."
              - alert: TargetDown
                expr: up == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Target {{ $labels.job }} ({{ $labels.instance }}) on {{ $labels.cluster }} down >10m."
          - name: data-hub
            rules:
              # Fires per probed data-hub service (llama-*). The data-hub LiteLLM is retired
              # (olympus-sdk#569); the cluster LiteLLM has its own alerts (group inference).
              - alert: DataHubServiceDown
                expr: probe_success{job="blackbox-datahub-http"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "data-hub service {{ $labels.service }} is failing its probe for >10m."
                  description: "Probe of {{ $labels.instance }} (job {{ $labels.job }}) from the cluster has failed for 10m. Check the service on data-hub and that it is bound to the tailnet IP."
              # llama-server (olympus-sdk#588). Wedged: a request holds a slot but no token has been
              # decoded for 10m (the watchdog on data-hub restarts it; this alerts if that fails).
              - alert: DataHubLlamaServerWedged
                expr: max by (instance) (llamacpp:requests_processing{host="datahub"}) > 0 and on(instance) increase(llamacpp:n_decode_total{host="datahub"}[10m]) == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "llama-server {{ $labels.instance }} has a request in flight but is not decoding."
                  description: "llamacpp:requests_processing has been above 0 with no decode progress for 15m on {{ $labels.instance }}. The server is wedged; the data-hub watchdog should have restarted it. Check the llama-server launchd job and log on data-hub."
              # Restarts on either host: llamacpp:n_decode_total is a monotonic counter that resets
              # to 0 when the process restarts (crash, watchdog kill, deploy). The 15m window outlasts
              # the 30s scrape so a single restart is always seen; the alert clears 15m later.
              - alert: InferenceInstanceRestarted
                expr: resets(llamacpp:n_decode_total[15m]) > 0
                labels:
                  severity: warning
                annotations:
                  summary: "llama-server {{ $labels.instance_name }} on {{ $labels.host }} restarted."
                  description: "The llamacpp:n_decode_total counter on {{ $labels.instance }} reset in the last 15m: the process restarted (crash, watchdog or deploy). A one-off after a deploy is expected; repeats mean InferenceInstanceRestartLoop. Check the inference-server-* unit (a9) or the launchd job (data-hub) and its watchdog log."
              - alert: InferenceInstanceRestartLoop
                expr: resets(llamacpp:n_decode_total[1h]) >= 3
                labels:
                  severity: warning
                annotations:
                  summary: "llama-server {{ $labels.instance_name }} on {{ $labels.host }} restarted {{ $value }} times in the last hour."
                  description: "The llamacpp:n_decode_total counter reset {{ $value }} times in 1h on {{ $labels.instance }}: the process is crash-looping or its watchdog keeps killing it. Read the server log and the watchdog's decision log."
              - alert: MemoryExtractLLMFailing
                expr: sum(increase(memory_worker_llm_requests_total{alias="memory-extract",outcome=~"timeout|http_5xx|network_error"}[30m])) >= 3 and sum(increase(memory_worker_llm_requests_total{alias="memory-extract",outcome="ok"}[30m])) == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "The memory-extract LLM alias is failing and nothing is succeeding."
                  description: "At least 3 memory-extract requests failed (timeout, http_5xx or network_error) in 30m with no successes. Check the cluster LiteLLM and the A9 llama-server on :8081 (qwen3.6-27b)."
              - alert: BlackboxExporterDown
                expr: absent(up{job="blackbox-exporter"} == 1)
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "blackbox-exporter is not being scraped successfully (data-hub probes are blind)."
          - name: memory
            rules:
              # Memory platform stores (ns memory): probes come from the
              # blackbox-memory-tcp job above.
              - alert: MemoryStoreDown
                expr: probe_success{job="blackbox-memory-tcp"} == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Memory store {{ $labels.service }} is not accepting connections."
                  description: "TCP connect to {{ $labels.instance }} from the cluster has failed for 10m. Check `kubectl -n memory get pods,pvc` and the pod logs; a missing Secret `memory-stores` (1Password item of the same name) or an unattached iSCSI volume are the usual causes."
              # kubelet_volume_stats_* is exposed twice (jobs kubernetes-nodes and
              # kubernetes-api-servers), hence max by (...). Covers the data PVC
              # (data-postgres-0) and the NFS backup PVC when it reports stats.
              - alert: MemoryStorePVCFillingUp
                expr: >-
                  max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="memory"})
                  / max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="memory"})
                  > 0.8
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "PVC {{ $labels.persistentvolumeclaim }} in ns memory is {{ $value | humanizePercentage }} full."
                  description: "qnap-iscsi allows online expansion: patch the PVC's spec.resources.requests.storage (StatefulSet volumeClaimTemplates are immutable, so see memory/README.md for the procedure)."
              # No successful backup for 36h, or no success ever and the CronJob is
              # already older than 36h (kube_cronjob_status_last_successful_time is
              # absent until the first success). Scoped to the Postgres backup CronJob: the knowledge
              # indexer (olympus-sdk#563) has its own rules below.
              - alert: MemoryBackupStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="memory", cronjob="postgres-backup"} > 129600)
                  or
                  (
                    time() - kube_cronjob_created{namespace="memory", cronjob="postgres-backup"} > 129600
                    unless on (namespace, cronjob)
                    kube_cronjob_status_last_successful_time{namespace="memory", cronjob="postgres-backup"}
                  )
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "CronJob {{ $labels.cronjob }} in ns memory has had no successful run for >36h."
                  description: "Check `kubectl -n memory get jobs,pods` and the Job logs; the backup PVC memory-backups (qnap-nfs) being unwritable or full is the likely cause."
              # Knowledge indexer (olympus-sdk#563, gateway design section 15.6): CronJob
              # memory/memory-knowledge-indexer, nightly at 02:40 UTC. No Prometheus operator, so no
              # ServiceMonitor: kube-state-metrics provides the CronJob series and the gateway pods
              # (kubernetes-pods job) the memory_knowledge_* gauges.
              # The latest scheduled run has not succeeded: last_successful_time stays before
              # last_schedule_time. A healthy run finishes in minutes, so 2h means it failed (or hangs).
              # Resolves with the next successful run (manual: kubectl -n memory create job
              # --from=cronjob/memory-knowledge-indexer knowledge-index-manual).
              - alert: MemoryKnowledgeIndexerFailing
                expr: >-
                  max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace="memory", cronjob="memory-knowledge-indexer"})
                  - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="memory", cronjob="memory-knowledge-indexer"})
                  > 0
                for: 2h
                labels:
                  severity: warning
                annotations:
                  summary: "The last knowledge indexer run has not succeeded."
                  description: "CronJob memory-knowledge-indexer was scheduled and has not completed successfully for 2h, so the wiki index (memory.knowledge_page) is stale. `kubectl -n memory get jobs,pods -l app.kubernetes.io/name=memory-knowledge-indexer` and the logs of containers `clone` (deploy key, Secret memory-knowledge-indexer, GitHub) and `index` (embedder, database, guards)."
              # Nothing indexed for 36h, by the index's own clock (max indexed_at, exported by the gateway;
              # 0 when the table is empty). Also catches a CronJob that never succeeded, was suspended or
              # deleted, which the rule above cannot see.
              - alert: MemoryKnowledgeIndexStale
                expr: time() - max(memory_knowledge_last_indexed_timestamp_seconds) > 129600
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "The wiki knowledge index has not been refreshed for more than 36h."
                  description: "The newest row of memory.knowledge_page is {{ $value | humanizeDuration }} old (or the table is empty). The `knowledge` tool and the session-start wiki hits serve stale or no pages. Check CronJob memory-knowledge-indexer (`kubectl -n memory get cronjob,jobs`) and see MemoryKnowledgeIndexerFailing."
              # Forget purge (olympus-sdk#734, contract section 10.3): CronJob memory/memory-purge, daily at
              # 04:17 UTC. No successful run for 48h (two missed runs), or no success ever and the CronJob is
              # already older than 48h (kube_cronjob_status_last_successful_time is absent until the first
              # success).
              # (the first arm then stays silent only while the series exists and is fresh).
              # Resolves with the next successful run (manual: kubectl -n memory create job
              # --from=cronjob/memory-purge purge-manual).
              - alert: MemoryPurgeStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="memory", cronjob="memory-purge"} > 172800)
                  or
                  (
                    time() - kube_cronjob_created{namespace="memory", cronjob="memory-purge"} > 172800
                    unless on (namespace, cronjob)
                    kube_cronjob_status_last_successful_time{namespace="memory", cronjob="memory-purge"}
                  )
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "The forget purge has not succeeded for 48h."
                  description: "CronJob memory-purge has had no successful run for more than 48h, so memories users forgot are hidden but their text is still in the database (olympus-sdk#734). `kubectl -n memory get cronjob,jobs,pods -l app.kubernetes.io/name=memory-purge` and the Job logs: a permission error means role memory_worker lost DELETE on fact_revision/capture_queue (migration 0004), 'unknown command' means the image digest predates `memory-admin purge`."
              # Fact consolidation (olympus-sdk#455, contract section 16.2): CronJob memory/memory-consolidate, daily at
              # 07:20 UTC. Same shape as MemoryPurgeStale: no success for 48h, or never and older than 48h.
              - alert: MemoryConsolidateStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="memory", cronjob="memory-consolidate"} > 172800)
                  or
                  (
                    time() - kube_cronjob_created{namespace="memory", cronjob="memory-consolidate"} > 172800
                    unless on (namespace, cronjob)
                    kube_cronjob_status_last_successful_time{namespace="memory", cronjob="memory-consolidate"}
                  )
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "The fact consolidation has not succeeded for 48h."
                  description: "CronJob memory-consolidate has had no successful run for more than 48h, so restated facts stay duplicated and stale facts are not deprecated (olympus-sdk#455). `kubectl -n memory get cronjob,jobs,pods -l app.kubernetes.io/name=memory-consolidate` and the Job logs: 'unknown command' means the image digest predates `memory-admin consolidate`; a permission error means role memory_worker lost UPDATE on fact (migration 0004)."
              # Memory gateway and queue (olympus-sdk#450 task G10, design section 9). The queue
              # gauges are exported by the gateway (Q-QUEUE-METRICS, every 30 s, both replicas, hence
              # max by); scraped through the kubernetes-pods job. The expr/for/severity are the
              # design's, verbatim; the annotations are additions.
              - alert: MemoryQueueBacklogOld
                expr: max by (stage) (memory_queue_oldest_pending_age_seconds{stage=~"extract|embed|graph_ingest"}) > 14400
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has a job pending for more than 4h."
                  description: "The oldest pending `{{ $labels.stage }}` job is {{ $value | humanizeDuration }} old. Workers (olympus-sdk#453) are not keeping up or are down; the cluster LiteLLM and the A9 llama-server are the usual dependency. `kubectl -n memory exec deploy/memory-gateway -- node dist/admin/cli.js queue stats`."
              - alert: MemoryQueueBacklogStuck
                expr: max by (stage) (memory_queue_oldest_pending_age_seconds) > 86400
                for: 30m
                labels: { severity: critical }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has a job pending for more than 24h."
                  description: "The oldest pending `{{ $labels.stage }}` job is {{ $value | humanizeDuration }} old. Captured memory is not being processed."
              - alert: MemoryQueueDeadLetters
                expr: max by (stage) (memory_queue_jobs{state="dead"}) > 0
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Memory queue stage {{ $labels.stage }} has dead jobs."
                  description: "{{ $value }} `{{ $labels.stage }}` job(s) exhausted their attempts. Inspect with `queue stats`, fix the cause, then `queue requeue-dead` (memory-admin CLI in the gateway image)."
              # The "fifth unused memory system" alarm (design section 9 / platform spec section 9).
              # Note: a counter with labels has no series until its first increment, so this stays
              # silent (empty vector) on a gateway that has never received a capture, and for 24h
              # after the last one; that is the design's expression, kept as written.
              - alert: MemoryCaptureStalled
                expr: sum(increase(memory_capture_received_total{result="created"}[24h])) == 0
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "No memory capture was stored in the last 24h."
                  description: "Hooks are not delivering (gateway key revoked, hook broken after a Claude Code upgrade, gateway unreachable) or nobody used Claude Code. Check the gateway logs and `memory_capture_received_total`."
              # probe: job blackbox-memory-http, /readyz through the blackbox exporter.
              - alert: MemoryGatewayDown
                expr: probe_success{job="blackbox-memory-http"} == 0   # http probe of /readyz via the blackbox exporter
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "The memory gateway is not ready."
                  description: "GET {{ $labels.instance }} has failed for 10m: no ready gateway pod, or Postgres (or the Access JWKS, when configured) is unreachable. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-gateway` and the pod logs."
              # --- Memory embedder (olympus-sdk#529): text-embeddings-inference on CPU, ns memory ---------
              # probe: job blackbox-memory-embedder, /health through the Service. Any ready replica
              # keeps it green, so this means NO replica can serve (the real outage).
              - alert: MemoryEmbedderDown
                expr: probe_success{job="blackbox-memory-embedder"} == 0
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "The memory embedder is not serving."
                  description: "GET {{ $labels.instance }} has failed for 10m: no ready embedder pod. Embeddings (worker embed stage, gateway recall) are failing or queueing. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder`; Init:Error means the model download from huggingface.co or the cache PVC failed (`kubectl -n memory logs <pod> -c fetch-model`), otherwise the pod logs."
              # The pods' own series, scraped by the kubernetes-pods job. absent() covers "no pod is
              # being scraped at all", which the probe cannot tell apart from a slow start.
              - alert: MemoryEmbedderMetricsAbsent
                expr: absent(up{job="kubernetes-pods", namespace="memory", app_kubernetes_io_name="memory-embedder"} == 1)
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "No memory embedder pod is being scraped."
                  description: "Prometheus has had no successful scrape of any memory-embedder pod for 10m (not running, not scheduled, or the NetworkPolicy/annotations are wrong). `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder -o wide`."
              - alert: MemoryEmbedderDegraded
                expr: count(up{job="kubernetes-pods", namespace="memory", app_kubernetes_io_name="memory-embedder"} == 1) < 2
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "Only {{ $value }} of 2 memory embedder replicas is being scraped."
                  description: "One replica has been missing for 30m; capacity is halved and a second failure is an outage. `kubectl -n memory get pods -l app.kubernetes.io/name=memory-embedder -o wide` (a node drain, a stuck model download or a failed scheduling are the usual causes)."
              # te_request_count counts every request, te_request_success the 2xx ones; the rest are
              # 4xx/5xx (including 429 when --max-concurrent-requests is exceeded).
              - alert: MemoryEmbedderErrorRate
                expr: >-
                  (
                    1 - sum(rate(te_request_success{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))
                    / sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))
                  ) > 0.05
                  and sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m])) > 0.05
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "More than 5% of memory embedder requests are failing."
                  description: "{{ $value | humanizePercentage }} of /v1/embeddings requests failed over 5m. 429 means the replicas are saturated (see MemoryEmbedderSlow, scale the Deployment), 4xx means a client is sending bad input, 5xx means a pod problem (`kubectl -n memory logs deploy/memory-embedder`)."
              # End-to-end request time as the server sees it (queue + tokenisation + inference).
              # A healthy replica answers a 100-token fact in well under a second and a 2,000-token
              # document in a few seconds; sustained p95 above 8s means the pods are saturated.
              - alert: MemoryEmbedderSlow
                expr: >-
                  histogram_quantile(0.95, sum by (le) (rate(te_request_duration_bucket{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m]))) > 8
                  and sum(rate(te_request_count{namespace="memory", app_kubernetes_io_name="memory-embedder"}[5m])) > 0.05
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Memory embedder p95 latency is above 8s."
                  description: "p95 /v1/embeddings latency is {{ $value | humanizeDuration }} over 5m. The embedder is saturated (offered load above its CPU capacity: see memory/embedder/README.md, \"Sizing\") or CPU-throttled on the node. Check `te_queue_size` and `kubectl -n memory top pods`."
          - name: memory-graph
            rules:
              # Postgres graph (olympus-sdk#519 task A1, contract section 9 "Amended 2026-10-21"). Gauges
              # memory_graph_* come from the gateway (Q-GRAPH-METRICS every 30 s, both replicas, hence max);
              # memory_worker_* from the LLM worker (memory-worker-extract). Scraped through kubernetes-pods.
              # The expr/for/severity are the design's, verbatim; the annotations are additions.
              - alert: MemoryGraphBackfillStalled
                expr: |
                  max(memory_graph_facts{state="without_graph"}) > 100
                  and max(memory_graph_facts{state="without_graph"} offset 2d) <= max(memory_graph_facts{state="without_graph"})
                  and on() max(memory_worker_graph_backfill_enabled) == 1
                  unless on() max(memory_worker_paused) > 0
                for: 6h
                labels: { severity: warning }
                annotations:
                  summary: "The memory graph backfill has made no progress in 2 days."
                  description: "{{ $value }} current facts still have no graph, no fewer than 2 days ago, while the backfill is on (MEMORY_GRAPH_ENABLED and MEMORY_GRAPH_BACKFILL) and the worker is not paused. The backfill only runs inside MEMORY_EXTRACT_WINDOW and when the LLM worker is idle: check `kubectl -n memory logs deploy/memory-worker-extract`, the A9 llama-server, and `memory_worker_backfill_enqueued_total`."
              - alert: MemoryGraphExtractionFailing
                expr: |
                  sum(increase(memory_worker_graph_extractions_total{outcome="failed"}[24h]))
                    / clamp_min(sum(increase(memory_worker_graph_extractions_total[24h])), 1) > 0.05
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "More than 5% of memory graph extractions failed in 24h."
                  description: "{{ $value | humanizePercentage }} of graph-v1 answers were unusable after the feedback retry (the PoC measured 0%). A model or prompt change is the likely cause. Failed facts get graph_mode 'failed' and wait for `memory-admin graph retry-failed --apply` once the cause is fixed."
              - alert: MemorySupersessionReviewBacklog
                expr: max(memory_graph_suggestions_pending) > 200
                for: 7d
                labels: { severity: warning }
                annotations:
                  summary: "More than 200 supersession suggestions have waited for review for a week."
                  description: "{{ $value }} suggestions are pending. Suggestions nobody reviews lose their value: `kubectl -n memory exec deploy/memory-gateway -- node dist/admin/cli.js supersession list`, then `supersession accept|reject <id> --apply`."
              - alert: MemoryWorkerPausedLong
                expr: max(memory_worker_paused) > 0
                for: 24h
                labels: { severity: warning }
                annotations:
                  summary: "Memory LLM work has been paused for more than 24h."
                  description: "A `memory-admin worker pause` has held for over a day (bounded to 7 days); it was probably forgotten. Live extraction (scope llm) or the backfill (scope backfill) is stopped. Resume with `kubectl -n memory exec deploy/memory-gateway -- node dist/admin/cli.js worker resume --scope <scope> --apply`."
          - name: inference
            rules:
              # Cluster LiteLLM (olympus-sdk#569, HW11). Probes: job blackbox-inference-http above;
              # LiteLLM metrics: job inference-litellm. Backends: A9 first;
              # only coder-light has a data-hub fallback (olympus-sdk#701).
              - alert: LiteLLMDown
                expr: probe_success{job="blackbox-inference-http", service="litellm"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "The cluster LiteLLM (inference/litellm) has no ready endpoint."
                  description: "GET {{ $labels.instance }} has failed for 5m: no LiteLLM pod is ready, so memory extraction stops. Check `kubectl -n inference get pods,events` and the Flux Kustomization `inference`."
              # Authenticated model list (olympus-sdk#649): LiteLLM answered 200 but /v1/models lacks a
              # configured alias (a bad config or a reload that dropped models), so requests for it fail
              # while readiness stays green. Probe: job blackbox-litellm-models.
              - alert: LiteLLMModelListEmpty
                expr: probe_success{job="blackbox-litellm-models"} == 0 and on(instance) probe_http_status_code{job="blackbox-litellm-models"} == 200
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "The cluster LiteLLM model list is empty or missing an alias."
                  description: "GET {{ $labels.instance }} answered 200 for 10m but the body lacks one of memory-extract, coder-light, coder-medium, coder-heavy. Compare `kubectl -n inference logs deploy/litellm` and the loaded ConfigMap with inference/litellm-config.yaml; `monitor` scope is LITELLM_CLIENT_SCOPES in inference/litellm.yaml."
              # The check itself is blind: 401/403 (monitor key missing or rotated without a sync), 5xx or
              # no answer. LiteLLMDown covers a LiteLLM with no ready pod; this one is the key and route side.
              - alert: LiteLLMModelsProbeFailing
                expr: probe_success{job="blackbox-litellm-models"} == 0 and on(instance) probe_http_status_code{job="blackbox-litellm-models"} != 200
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "The authenticated LiteLLM /v1/models probe cannot get a model list."
                  description: "GET {{ $labels.instance }} has failed for 15m with a non-200 answer or none. 401 or 403: the `monitor` key is missing or stale (1Password litellm-cluster `monitor-key`; ExternalSecrets litellm-monitor-key in ns inference and observability). Otherwise check `probe_http_status_code` and the blackbox-exporter logs."
              # Only coder-light (llama-qwen35-9b) has a data-hub fallback (llama-qwen25-7b, :8082).
              - alert: InferenceBackendDown
                expr: probe_success{job="blackbox-inference-http", host="a9", service="llama-qwen35-9b"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "A9 backend {{ $labels.service }} is down; LiteLLM is serving coder-light from data-hub."
                  description: "GET {{ $labels.instance }} has failed for 5m. LiteLLM falls back to the data-hub 7B (coder-light-datahub, slower). Check the inference-server-* systemd unit and its watchdog on a9-mega."
              # Every other A9 backend has no fallback: the aliases it serves fail straight to the client.
              - alert: InferenceBackendDownNoFallback
                expr: probe_success{job="blackbox-inference-http", host="a9", service!="llama-qwen35-9b"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "A9 backend {{ $labels.service }} is down and has no fallback."
                  description: "GET {{ $labels.instance }} has failed for 5m. The aliases it serves (memory-extract, coder-heavy, coder-medium) have no data-hub fallback, so requests to them fail; the memory worker retries extract jobs itself. Check the inference-server-* systemd unit and its watchdog on a9-mega."
              - alert: InferenceAllBackendsDown
                expr: (probe_success{job="blackbox-inference-http", host="a9", service="llama-qwen35-9b"} == 0) and on() (probe_success{job="blackbox-datahub-http", service="llama-qwen25-7b"} == 0)
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "coder-light is down on both the A9 and data-hub."
                  description: "Both backends for coder-light (A9 llama-qwen35-9b, data-hub llama-qwen25-7b) have failed their /health probe for 5m. There is no further fallback: requests to coder-light fail."
              - alert: LiteLLMFailoverActive
                expr: sum by (requested_model) ((increase(litellm_deployment_successful_fallbacks_total{job="inference-litellm"}[15m]) > 0) or (litellm_deployment_successful_fallbacks_total{job="inference-litellm"} unless litellm_deployment_successful_fallbacks_total{job="inference-litellm"} offset 15m)) > 0
                labels:
                  severity: warning
                annotations:
                  summary: "LiteLLM fell back from the A9 to data-hub for {{ $labels.requested_model }}."
                  description: "{{ $value | humanize }} requests for {{ $labels.requested_model }} were served by the data-hub fallback in the last 15m because the A9 deployment failed. Check InferenceBackendDown and litellm_deployment_failure_responses_total by exception_class."
              - alert: LiteLLMFallbackFailed
                expr: sum by (requested_model) ((increase(litellm_deployment_failed_fallbacks_total{job="inference-litellm"}[15m]) > 0) or (litellm_deployment_failed_fallbacks_total{job="inference-litellm"} unless litellm_deployment_failed_fallbacks_total{job="inference-litellm"} offset 15m)) > 0
                labels:
                  severity: critical
                annotations:
                  summary: "LiteLLM requests for {{ $labels.requested_model }} failed on the A9 and on the data-hub fallback."
                  description: "{{ $value | humanize }} requests for {{ $labels.requested_model }} failed on both backends in the last 15m; the client got the error."
              - alert: LiteLLMHighErrorRate
                expr: >-
                  sum(rate(litellm_proxy_total_requests_metric_total{job="inference-litellm", status_code=~"5.."}[15m]))
                  / sum(rate(litellm_proxy_total_requests_metric_total{job="inference-litellm"}[15m])) > 0.1
                  and sum(increase(litellm_proxy_total_requests_metric_total{job="inference-litellm", status_code=~"5.."}[15m])) >= 3
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "More than 10% of LiteLLM requests return 5xx."
                  description: "{{ $value | humanizePercentage }} of requests through the cluster LiteLLM returned 5xx over 15m. See litellm_proxy_failed_requests_metric_total by requested_model and exception_class."
          - name: agent-sessions
            rules:
              # Claude Code session telemetry (olympus-sdk#565, spec decision H12): the agent host and the Macs
              # export OTLP to the otel collector (otel-collector/helmrelease.yaml, pipeline metrics/agents),
              # which sums the delta counters and remote-writes them here. `account` is the resource attribute
              # nix sets per Claude account (personal, work). Thresholds are a first guess: tune them from the
              # "agent sessions" dashboard after a week of data.
              - alert: AgentTokensPerHourHigh
                expr: >-
                  sum by (account) (increase(claude_code_token_usage_tokens_total{type!="cacheRead"}[1h])) > 10000000
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Account {{ $labels.account }} used more than 10M input, output and cache-write tokens in the last hour."
                  description: "{{ $value | humanize }} tokens (cache reads excluded) in the last hour for account {{ $labels.account }}. Open the \"agent sessions\" dashboard (tokens by repo and model) to find the runaway session; a looping goal or a fan-out of subagents is the usual cause."
              - alert: AgentCostPerHourHigh
                expr: >-
                  sum by (account) (increase(claude_code_cost_usage_USD_total[1h])) > 25
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Account {{ $labels.account }} used more than $25 of API-equivalent Claude usage in the last hour."
                  description: "${{ $value | humanize }} of API-equivalent usage (list price; on a Max plan this counts against the plan, it is not billed) in the last hour for account {{ $labels.account }}. Open the \"agent sessions\" dashboard (cost by repo and model) to find the runaway session; a looping goal or a fan-out of subagents is the usual cause."
          - name: ci-egress-proxy
            rules:
              # CI egress proxy (olympus-sdk#407, ../ci-egress/). Every job on the cluster runners reaches GitHub through
              # it (the runner itself too), so down = all on-cluster CI fails. Fallback: arc/README.md "Egress proxy".
              # Denials (HTTP 403 from the allowlist) are alerted by the Loki ruler (loki-rules-ci-egress.yaml).
              - alert: CiEgressProxyDown
                expr: >-
                  max(kube_deployment_status_replicas_available{namespace="ci-egress", deployment="egress-proxy"}) < 1
                  or absent(kube_deployment_status_replicas_available{namespace="ci-egress", deployment="egress-proxy"})
                for: 2m
                labels: { severity: critical }
                annotations:
                  summary: "The CI egress proxy (ci-egress/egress-proxy) has no available replica."
                  description: "No Ready squid pod for 2m: every job on olympus-linux, olympus-gate, olympus-kvm and olympus-arm64 fails (the runner reaches GitHub through the proxy). `kubectl -n ci-egress get pods,events` and `kubectl -n ci-egress logs deploy/egress-proxy`; a bad squid.conf shows there (ci-egress/configmap.yaml, roll back by reverting). Fallback: arc/README.md, \"Egress proxy\"."
              - alert: CiEgressProxyDegraded
                expr: max(kube_deployment_status_replicas_available{namespace="ci-egress", deployment="egress-proxy"}) < 2
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "The CI egress proxy has had only {{ $value }} available replica(s) for 30m."
                  description: "One node failure away from all on-cluster CI failing. `kubectl -n ci-egress get pods -o wide,events`: the two replicas need two eligible nodes (required anti-affinity)."
              - alert: CiEgressProbeFailing
                expr: probe_success{job="blackbox-ci-egress"} == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "HTTPS to GitHub through the CI egress proxy has failed for 5m."
                  description: "The blackbox probe of {{ $labels.instance }} through egress-proxy.ci-egress.svc:3128 fails while runner jobs need the same path. Pods up but failing: squid's allowlist refuses api.github.com (ci-egress/configmap.yaml), its upstream DNS or internet egress is broken (ci-egress/networkpolicy.yaml), or GitHub is down. `kubectl -n ci-egress logs deploy/egress-proxy | grep api.github.com`."
          - name: arc-ci-runners
            rules:
              # CI runner scale sets on the cluster (olympus-sdk#392, epic #383). Scrape jobs arc-controller and
              # arc-listeners above; procedures in clusters/olympus/arc/README.md ("Runbook"). The macOS JIT runners
              # on the Macs are not ARC: group ci-runners-macos below.
              - alert: ArcControllerDown
                expr: absent(up{job="arc-controller"} == 1)
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "The ARC controller (arc-system) is not being scraped."
                  description: "No successful scrape of the gha-rs-controller for 10m. Without it no listener or runner is reconciled, so CI on olympus-linux, olympus-gate, olympus-kvm and olympus-arm64 stops once the current runners finish. `kubectl -n arc-system get pods,events` and `kubectl -n arc-system logs deploy/arc-gha-rs-controller`. Fallback to hosted runners: arc/README.md, Runbook."
              # Either the controller reports the listener as not running (gha_controller_running_listeners carries the
              # AutoscalingListener's name, <set>-<hash>-listener) or the listener's own target is down.
              - alert: ArcListenerDown
                expr: >-
                  (max by (name) (gha_controller_running_listeners{job="arc-controller"}) == 0)
                  or
                  label_replace(max by (scale_set) (up{job="arc-listeners"}) == 0, "name", "$1", "scale_set", "(.*)")
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: "ARC listener {{ $labels.name }} is down."
                  description: "The listener for {{ $labels.name }} has not been running or scrapeable for 10m. A scale set without a listener takes no jobs: they stay queued on GitHub. `kubectl -n arc-system get pods -l app.kubernetes.io/component=runner-scale-set-listener` and the listener logs; a GitHub App or network problem shows there. Restart: delete the listener pod (the controller recreates it)."
              # Jobs are assigned to the scale set but none runs: no node or quota for the runner pod, or the 0.15.0
              # stuck-queue bug (actions-runner-controller#4715). NOT a drain: with maxRunners 0 the listener does
              # not acquire jobs at all (gha_assigned_jobs stays 0; drain test 2026-11-07), see ArcScaleSetDrained.
              - alert: ArcJobsStuckInQueue
                expr: >-
                  max by (name) (gha_assigned_jobs{job="arc-listeners"}) > 0
                  and max by (name) (gha_running_jobs{job="arc-listeners"}) == 0
                for: 20m
                labels: { severity: warning }
                annotations:
                  summary: "Scale set {{ $labels.name }} has {{ $value }} assigned job(s) and nothing running for 20m."
                  description: "gha_assigned_jobs > 0 with gha_running_jobs == 0 for 20m. Check in order: Pending runner pods (`kubectl -n arc-runners get pods,ephemeralrunners`; no node, quota, Insufficient olympus.io/kvm), and the stuck-queue bug #4715 (restart the listener: `kubectl -n arc-system delete pod -l actions.github.com/scale-set-name={{ $labels.name }}`)."
              # A drained set takes no jobs and nothing else reports it: queued jobs wait on GitHub invisibly (the
              # listener does not acquire them, so ArcJobsStuckInQueue stays silent). A reminder, not an outage.
              - alert: ArcScaleSetDrained
                expr: max by (name) (gha_max_runners{job="arc-listeners"}) == 0
                for: 2h
                labels: { severity: warning }
                annotations:
                  summary: "Scale set {{ $labels.name }} has been drained (maxRunners 0) for 2h."
                  description: "Jobs for {{ $labels.name }} wait on GitHub and are not visible in these metrics. Either fall back to hosted runners (arc/README.md, Runbook) or restore maxRunners from Git; after a kubectl drain, also unsuspend the HelmRelease (`kubectl -n arc-runners get helmrelease {{ $labels.name }} -o jsonpath='{.spec.suspend}'`)."
              # Queue time = runner assigned minus job assigned to the scale set (listener histogram). At least 3 jobs in
              # the hour so one slow start does not page.
              - alert: ArcJobQueueTimeHigh
                expr: >-
                  histogram_quantile(0.9, sum by (le, scale_set) (rate(gha_job_startup_duration_seconds_bucket{job="arc-listeners"}[1h]))) > 1200
                  and sum by (scale_set) (increase(gha_job_startup_duration_seconds_count{job="arc-listeners"}[1h])) >= 3
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "p90 job queue time on {{ $labels.scale_set }} is {{ $value | humanizeDuration }} over the last hour."
                  description: "CI jobs wait more than 20 minutes for a runner on {{ $labels.scale_set }}. The pool is saturated (see ArcQuotaSaturated and the \"CI runners\" dashboard) or runner pods are slow to start or schedule. Raising maxRunners needs the quota and node headroom in arc/README.md."
              # Failed EphemeralRunners hold their slot until deleted (0.15.0 bugs #4712/#4718, non-quota 403s).
              - alert: ArcEphemeralRunnersFailed
                expr: max by (name) (gha_controller_failed_ephemeral_runners{job="arc-controller"}) > 0
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Scale set {{ $labels.name }} has {{ $value }} failed ephemeral runner(s)."
                  description: "Failed EphemeralRunners keep their slot until deleted (actions-runner-controller#4712/#4718). `kubectl -n arc-runners get ephemeralrunners` and `kubectl -n arc-runners delete ephemeralrunner <name>` after reading its status."
              - alert: ArcRunnerPodPending
                expr: max by (namespace, pod) (kube_pod_status_phase{namespace="arc-runners", phase="Pending"}) == 1
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "Runner pod {{ $labels.pod }} has been Pending for 15m."
                  description: "`kubectl -n arc-runners describe pod {{ $labels.pod }}`: no node with room (olympus-arm64 needs a Mac VM, olympus-kvm a labelled KVM node with a free olympus.io/kvm), or the quota. A job is waiting on it."
              # used/hard per quota and resource; hard 0 (pvc, services, kvm on the non-KVM quota) is excluded.
              - alert: ArcQuotaSaturated
                expr: >-
                  max by (namespace, resourcequota, resource) (kube_resourcequota{namespace=~"arc-runners|arc-system", type="used"})
                  / max by (namespace, resourcequota, resource) (kube_resourcequota{namespace=~"arc-runners|arc-system", type="hard"} > 0)
                  >= 0.9
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "Quota {{ $labels.namespace }}/{{ $labels.resourcequota }} is at {{ $value | humanizePercentage }} of {{ $labels.resource }}."
                  description: "At 100% new runner pods are rejected and jobs queue. Sustained saturation means CI needs more capacity: raise maxRunners and the quotas together (arc/quota.yaml keeps the sums), only with node headroom."
          - name: cluster-nodes
            rules:
              # Node and control-plane health while CI runs (olympus-sdk#392). The onodes are k3s servers whose etcd and
              # containerd share the root disk with the runner pods' emptyDirs. kube_node_status_condition and the
              # node-exporter series are each scraped twice (kube-state-metrics + service endpoints), hence max by.
              - alert: KubeNodePressure
                expr: max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"}) == 1
                for: 5m
                labels: { severity: warning }
                annotations:
                  summary: "Node {{ $labels.node }} reports {{ $labels.condition }}."
                  description: "The kubelet on {{ $labels.node }} has reported {{ $labels.condition }} for 5m and is evicting or refusing pods. If CI is running there, drain the scale set (arc/README.md, Runbook) and check `kubectl describe node {{ $labels.node }}`."
              # kubelet eviction-hard is nodefs.available<10% (arc/README.md, kubelet reserves); etcd on the onodes
              # stops writing when its disk is full. 12% leaves a margin before eviction starts.
              - alert: ClusterNodeRootDiskLow
                expr: >-
                  min by (node) (node_filesystem_avail_bytes{job="kubernetes-service-endpoints", service="node-exporter", mountpoint="/"})
                  / max by (node) (node_filesystem_size_bytes{job="kubernetes-service-endpoints", service="node-exporter", mountpoint="/"})
                  < 0.12
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: "Root disk on {{ $labels.node }} has only {{ $value | humanizePercentage }} free."
                  description: "Below 10% the kubelet evicts pods; on the onodes etcd and containerd share this disk and etcd stops accepting writes when it is full. Drain CI if it runs there, then free space (`crictl rmi --prune`, journal, old images)."
              - alert: ClusterNodeRootDiskFillingUp
                expr: >-
                  predict_linear(min by (node) (node_filesystem_avail_bytes{job="kubernetes-service-endpoints", service="node-exporter", mountpoint="/"})[6h:5m], 24 * 3600) < 0
                  and
                  min by (node) (node_filesystem_avail_bytes{job="kubernetes-service-endpoints", service="node-exporter", mountpoint="/"})
                  / max by (node) (node_filesystem_size_bytes{job="kubernetes-service-endpoints", service="node-exporter", mountpoint="/"})
                  < 0.4
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "Root disk on {{ $labels.node }} will be full within 24h at the current rate."
                  description: "Linear prediction over the last 6h reaches zero free space within 24h (less than 40% free now). Find the writer (`du -xh / | sort -h`, container images, CI emptyDirs) before ClusterNodeRootDiskLow fires."
              # Apiserver-side etcd request latency (end to end, as the apiserver sees it). Non-list operations;
              # their 7-day p99 peak was under 0.1s (2026-11-07). etcd's own disk latency: the two rules below.
              - alert: EtcdRequestLatencyHigh
                expr: >-
                  histogram_quantile(0.99, sum by (le, instance) (rate(etcd_request_duration_seconds_bucket{job="kubernetes-api-servers", operation!~"list.*"}[5m]))) > 0.5
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "etcd request p99 seen by the apiserver {{ $labels.instance }} is {{ $value | humanizeDuration }}."
                  description: "Non-list etcd requests from the apiserver take over 0.5s at p99 (normal: under 0.1s). Disk contention on the control-plane onodes is the usual cause; CI runs on the same disks. Compare with busy runners on the \"CI runners\" dashboard and drain CI (arc/README.md, Runbook) if they coincide."
              # etcd's own disk latency, per member (scrape job `etcd`, olympus-sdk#908). etcd's guidance: WAL fsync p99
              # under 10ms and backend commit p99 under 25ms on healthy disks; sustained values above these thresholds
              # mean leader elections and slow writes are close. CI runners share the root disk with etcd on the
              # control-plane nodes, so these are the metrics to check before and after any runner capacity change.
              - alert: EtcdWalFsyncSlow
                expr: >-
                  histogram_quantile(0.99, sum by (le, instance) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m]))) > 0.025
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "etcd WAL fsync p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}."
                  description: "WAL fsync p99 on {{ $labels.instance }} has been over 25ms for 10m (healthy: under 10ms). Every etcd write waits for this fsync, so slow fsyncs delay all writes and can cost leader elections. Usual cause: disk contention from CI runner pods on the same node (\"CI runners\" dashboard, `kubectl get pods -A -o wide --field-selector spec.nodeName={{ $labels.instance }}`). Drain CI if they coincide (arc/README.md, Runbook) and do not raise runner capacity while this fires."
              - alert: EtcdBackendCommitSlow
                expr: >-
                  histogram_quantile(0.99, sum by (le, instance) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[5m]))) > 0.05
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "etcd backend commit p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}."
                  description: "Backend (bbolt) commit p99 on {{ $labels.instance }} has been over 50ms for 10m (healthy: under 25ms). Slow commits back up the apply loop and show as EtcdRequestLatencyHigh next. Check disk contention on that node first (CI runners, image pulls, `iostat -x 5` on the node), then the database size (`etcd_mvcc_db_total_size_in_bytes{job=\"etcd\"}`; defragment one member at a time if it is large). Do not raise runner capacity while this fires."
          - name: ci-runners-macos
            rules:
              # Native macOS JIT runners on data-hub, mmini-01 and mmini-02 (olympus-sdk#392; not ARC). Each Mac's
              # root LaunchDaemon io.olympus.ci-runner-heartbeat (nix-darwin-hm d.server.ciRunner.heartbeat) pushes
              # gauges every 60s over OTLP to the otel collector (obs-otlp, pipeline metrics/agents), which
              # remote-writes them here as {job="ci-runner", host_name="<host>"}. Hosts that never reported (not
              # deployed yet) raise nothing: the heartbeat alert only covers hosts seen in the last 7d, the others need
              # a series to exist. No alert on registration age: a JIT runner re-registers only after a job, so an
              # idle host keeps one registration for days; ci_runner_runner_up covers "no registered runner".
              # Procedures: clusters/olympus/arc/README.md, Runbook "macOS runners".
              - alert: MacCIRunnerHeartbeatMissing
                expr: >-
                  max by (host_name) (max_over_time(ci_runner_daemon_up{job="ci-runner"}[7d]))
                  unless on (host_name) max by (host_name) (ci_runner_daemon_up{job="ci-runner"})
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "No CI runner heartbeat from {{ $labels.host_name }} for 15m."
                  description: "{{ $labels.host_name }} reported within the last 7 days but has pushed no ci_runner_* gauges for about 15m. The Mac is down or asleep, off the tailnet, or its heartbeat daemon fails (`sudo launchctl print system/io.olympus.ci-runner-heartbeat`, `sudo cat /var/log/ci-runner-heartbeat.log`). Its runner may still take jobs; check the org runners list. A host retired on purpose keeps firing for 7 days."
              # launchd restarts the loop (KeepAlive, 30s throttle), so 10m down means launchd gave up on it, e.g. a
              # missing executable at boot (mmini-01, 2026-10-31).
              - alert: MacCIRunnerDaemonDown
                expr: max by (host_name) (ci_runner_daemon_up{job="ci-runner"}) == 0
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: "The CI runner daemon on {{ $labels.host_name }} is not running."
                  description: "launchd reports io.olympus.ci-runner as not running for 10m, so {{ $labels.host_name }} takes no macOS jobs. On the host (LAN sshd, admin): `sudo launchctl print system/io.olympus.ci-runner`, `sudo tail -n 50 /var/log/ci-runner.log`, then `sudo launchctl kickstart -k system/io.olympus.ci-runner` (arc/README.md, Runbook \"macOS runners\")."
              # The loop fails closed: with a failed wipe it registers no runner and retries with backoff (30s to
              # 5m), so 0 for 15m means repeated failures, not one.
              - alert: MacCIRunnerWipeFailing
                expr: max by (host_name) (ci_runner_last_wipe_ok{job="ci-runner"}) == 0
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "The runner user wipe keeps failing on {{ $labels.host_name }}."
                  description: "The last wipe of _ghrunner on {{ $labels.host_name }} failed and has not succeeded for 15m; the loop registers no runner until it does, so the host takes no jobs. The log names what survived (processes, launchd services, files): `sudo grep 'wipe:' /var/log/ci-runner.log | tail`. Something a job left behind that the wipe cannot remove needs a look before it is cleared by hand."
              # The loop is running and the wipe is fine, yet no runner has been registered for 30m: credentials
              # missing or rejected, GitHub API errors, or the pf check failing (the loop backs off; its log says why).
              - alert: MacCIRunnerNotRegistered
                expr: >-
                  max by (host_name) (ci_runner_daemon_up{job="ci-runner"}) == 1
                  and on (host_name) max by (host_name) (ci_runner_runner_up{job="ci-runner"}) == 0
                  unless on (host_name) max by (host_name) (ci_runner_last_wipe_ok{job="ci-runner"}) == 0
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: "{{ $labels.host_name }} has had no registered CI runner for 30m."
                  description: "The runner loop on {{ $labels.host_name }} is running but no runner of _ghrunner has been up for 30m, so the host takes no jobs. `sudo tail -n 50 /var/log/ci-runner.log`: \"waiting for the credential files\", \"could not get a JIT config\" (App key or installation, GitHub API) or \"network isolation not in force\" (pf)."
          - name: knowledge-layer
            rules:
              # Code knowledge layer (olympus-sdk#854, HW20-W9; runbook docs/runbooks/2026-11-08-code-knowledge-layer.md
              # in olympus-sdk). The pack job (knowledge-pack.yml, one per repo and run) pushes one sample of each gauge
              # over OTLP to the otel collector (netpol egress-otel-knowledge, arc/networkpolicy.yaml), which remote-writes
              # them here as {job="knowledge-pack", repo="<name>"}; contract packages/knowledge-gen/CONTRACT.md 5.1.
              # Samples are sparse (one per run), so every rule reads *_over_time with a lookback, never the instant value.
              # lag = how long the source commit a run was asked for has been missing from olympus-knowledge: a failed
              # run keeps pushing a growing lag (the 15-minute poll retries), a success pushes 0.
              - alert: KnowledgePackStale
                expr: max by (repo) (last_over_time(knowledge_pack_lag_seconds{job="knowledge-pack"}[1d])) > 6 * 3600
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: "The code knowledge pack for {{ $labels.repo }} trails its main by {{ $value | humanizeDuration }}."
                  description: "olympus-knowledge repos/{{ $labels.repo }}/meta.json is more than 6h behind the commit the last pack run was asked for, and the runs since have failed. Find the failed run: `gh run list -R nwlnexus/olympus-sdk --workflow knowledge-fleet.yml` (knowledge.yml for olympus-sdk) and read the Generate step; exit 3 is a redaction refusal, 4 a validation failure, 5 a tool or clone failure. Runbook: docs/runbooks/2026-11-08-code-knowledge-layer.md (olympus-sdk)."
              # The Monday 03:10 UTC forced run refreshes generated_at for every repo, so 8 days without a refresh means
              # that run failed for the repo or the pipeline is off (KNOWLEDGE_ENABLED, the olympus-knowledge runner).
              # A repo that never reported raises nothing; a paused pipeline fires after 8 days (silence it for a planned pause).
              - alert: KnowledgePackWeeklyMissed
                expr: time() - max by (repo) (last_over_time(knowledge_pack_generated_timestamp_seconds{job="knowledge-pack"}[30d])) > 8 * 86400
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: "The code knowledge pack for {{ $labels.repo }} was last generated {{ $value | humanizeDuration }} ago."
                  description: "No pack run has refreshed repos/{{ $labels.repo }}/meta.json in over 8 days although the weekly full regenerate (Monday 03:10 UTC, knowledge-fleet.yml) should. Check that the variable KNOWLEDGE_ENABLED is true, that the olympus-knowledge runner (`kubectl -n arc-runners get pods`) is up, and the last Monday run of knowledge-fleet.yml."
              # inference_failing_streak is kept in meta.json by the generator: consecutive runs that attempted inference and
              # ended stale (both providers down, previous values kept) or unavailable. ok and partial reset it, skipped and
              # --no-infer runs leave it. It is exact where PromQL over sparse samples would not be.
              - alert: KnowledgeInferenceFailing
                expr: max by (repo) (last_over_time(knowledge_pack_inference_failing_streak{job="knowledge-pack"}[7d])) >= 3
                labels: { severity: warning }
                annotations:
                  summary: "Inference has failed for {{ $value }} consecutive code knowledge runs of {{ $labels.repo }}."
                  description: "{{ $labels.repo }}'s last {{ $value }} pack runs that attempted inference ended stale or unavailable: LiteLLM (coder-heavy) and the Workers AI fallback both failed, so the inferred fields keep their previous values marked stale_inference. See the LiteLLM and InferenceBackend alerts, then the Generate step log (`inference: litellm failed ...`). After the providers are back, force a full regenerate (`gh workflow run knowledge-fleet.yml -R nwlnexus/olympus-sdk -f repo=all -f force=true`)."
              # Workers AI is the fallback only: tens of calls on a bad day. Neurons are estimated from the tokens the API
              # reported times the pinned rates (60000 / 90909 per M input / output tokens for qwen2.5-coder-32b), summed over
              # a rolling 24h. The free allowance is 10,000 neurons per day for the whole account (memory uses it too);
              # 25,000 is about $0.17 a day above it.
              - alert: KnowledgeWorkersAINeuronCeiling
                expr: sum(sum_over_time(knowledge_pack_workers_ai_neurons_estimate{job="knowledge-pack"}[24h])) > 25000
                labels: { severity: warning }
                annotations:
                  summary: "The code knowledge fallback used about {{ $value | humanize }} Workers AI neurons in 24h."
                  description: "The pack job's Workers AI fallback is estimated at {{ $value | humanize }} neurons over the last 24h (ceiling 25,000). A fallback that runs all day means LiteLLM coder-heavy is down or failing every call: check LiteLLMDown, InferenceBackendDown and the A9, or pause generation (variable KNOWLEDGE_ENABLED=false). The Cloudflare dashboard (Workers AI) is the authoritative neuron count."
              # CONTRACT.md BUDGETS.factsBytes (144 KiB: 32 KiB, 96 KiB by olympus-sdk#854, 144 KiB by olympus-sdk#885 for
              # the developer-tooling rows, about 50 KiB on olympus-sdk). Samples come from runs that wrote a tree, so a
              # week of lookback.
              - alert: KnowledgeFactsLarge
                expr: max by (repo) (last_over_time(knowledge_pack_facts_bytes{job="knowledge-pack"}[7d])) > 144 * 1024
                labels: { severity: warning }
                annotations:
                  summary: "facts.json for {{ $labels.repo }} is {{ $value | humanize1024 }}B, above the 144 KiB target."
                  description: "repos/{{ $labels.repo }}/facts.json passed the 144 KiB target (the generator also warns in meta.json). Technologies, external_systems and tooling carry most of the bytes; shorten evidence excerpts or cap evidence per row or rows per kind in packages/knowledge-gen rather than raising the target again (runbook section \"facts.json size\")."
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
      # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
      # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
      # LeastAllocated scoring and the descheduler place it.
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 112Mi
      # Surface `cluster` on mgmt's kube_* series via the service-endpoints labelmap
      # (uniform with the remote clusters, whose otel relabel sets cluster).
      customLabels:
        cluster: olympus
    prometheus-node-exporter:
      enabled: false
