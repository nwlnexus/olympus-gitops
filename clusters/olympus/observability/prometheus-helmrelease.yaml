apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "29.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Central metrics store: receives remote-write from the olympus otel agent
    # over the tailnet AND scrapes olympus's own targets.
    server:
      retention: "30d"
      persistentVolume:
        enabled: true
        storageClass: qnap-iscsi
        size: 50Gi
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Alertmanager → Resend email (Phase 7). Server auto-wires to the bundled AM.
    alertmanager:
      enabled: true
      persistence:
        enabled: true
        storageClass: qnap-iscsi
        size: 2Gi
      # Resend API key (ESO) mounted as a file → kept out of the alertmanager ConfigMap.
      extraSecretMounts:
        - name: resend
          secretName: alertmanager-resend
          mountPath: /etc/alertmanager/secrets
          readOnly: true
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp.resend.com:587
          smtp_from: alerts@mail.nwlnexus.net
          smtp_auth_username: resend
          smtp_auth_password_file: /etc/alertmanager/secrets/api_key
          smtp_require_tls: true
        route:
          receiver: email
          group_by: [alertname, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # Watchdog always fires; sink it (reserve for a future dead-man's-switch).
            - matchers:
                - 'alertname="Watchdog"'
              receiver: 'null'
        receivers:
          - name: email
            email_configs:
              - to: nigel.williamslucas@gmail.com
                send_resolved: true
          - name: 'null'
    # data-hub host probes via blackbox-exporter (observability/blackbox-exporter).
    # data-hub is a Mac Studio host, not a cluster; addresses are its tailnet IP
    # (100.95.232.41) on purpose: the probes must fail if a service is not bound to
    # the tailnet address (Postgres has been bound to 127.0.0.1 only since July after
    # a boot-time bind race with tailscaled; see DataHubPostgresNotOnTailnet).
    # TODO(olympus-sdk#447): add an authenticated LiteLLM /v1/models check (needs a
    # bearer key) and alert on an empty model list. Needs a Secret and a mechanism
    # beyond a plain http_2xx probe, so it is deferred until the key exists.
    extraScrapeConfigs: |
      - job_name: blackbox-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["blackbox-exporter.observability.svc:9115"]
      - job_name: blackbox-datahub-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["http://100.95.232.41:4000/health/liveliness"]
            labels:
              service: litellm
          - targets: ["http://100.95.232.41:11434/api/tags"]
            labels:
              service: ollama
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
      - job_name: blackbox-datahub-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["100.95.232.41:5432"]
            labels:
              service: postgres
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: fleet-infra
            rules:
              - alert: Watchdog
                expr: vector(1)
                labels:
                  severity: none
                annotations:
                  summary: "Alerting pipeline alive (always firing)."
              - alert: NodeFilesystemAlmostFull
                expr: >-
                  100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100
                  / node_filesystem_size_bytes) > 85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Filesystem >85% full on {{ $labels.cluster }}/{{ $labels.instance }} ({{ $labels.mountpoint }})."
              - alert: NodeHighMemory
                expr: >-
                  (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Memory >90% used on {{ $labels.cluster }}/{{ $labels.instance }}."
              - alert: KubeNodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} on {{ $labels.cluster }} not Ready >5m."
              - alert: KubePodCrashLooping
                expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.cluster }} crash-looping."
              - alert: TargetDown
                expr: up == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Target {{ $labels.job }} ({{ $labels.instance }}) on {{ $labels.cluster }} down >10m."
          - name: data-hub
            rules:
              # Fires per probed data-hub service (litellm, ollama). Postgres has its own
              # alert below, so it is excluded here to avoid a duplicate page.
              # TODO: raise litellm to severity critical once the memory workers depend
              # on it (olympus-sdk#444 wave 2+); route-by-label is already in place via
              # the `service` label.
              - alert: DataHubServiceDown
                expr: probe_success{job=~"blackbox-datahub-.*", service!="postgres"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "data-hub service {{ $labels.service }} is failing its probe for >10m."
                  description: "Probe of {{ $labels.instance }} (job {{ $labels.job }}) from the cluster has failed for 10m. Check the service on data-hub and that it is bound to the tailnet IP."
              # The failure that went unnoticed from July: Postgres bound to 127.0.0.1
              # only. The probe targets the tailnet address, so this fires in that case.
              - alert: DataHubPostgresNotOnTailnet
                expr: probe_success{job="blackbox-datahub-tcp", service="postgres"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Postgres on data-hub is not accepting connections on its tailnet address."
                  description: "TCP connect to {{ $labels.instance }} has failed for 10m. Known cause: the boot-time bind race, where postgres starts before tailscaled is up, fails to bind the tailnet IP and falls back to 127.0.0.1 only. Check `lsof -iTCP:5432 -sTCP:LISTEN` on data-hub and restart the Postgres LaunchDaemon once tailscaled is up."
              - alert: BlackboxExporterDown
                expr: absent(up{job="blackbox-exporter"} == 1)
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "blackbox-exporter is not being scraped successfully (data-hub probes are blind)."
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
      # Surface `cluster` on mgmt's kube_* series via the service-endpoints labelmap
      # (uniform with the remote clusters, whose otel relabel sets cluster).
      customLabels:
        cluster: olympus
    prometheus-node-exporter:
      enabled: false
