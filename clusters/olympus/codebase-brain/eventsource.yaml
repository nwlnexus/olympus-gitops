# GitHub push EventSource — HMAC only (org webhook created in GitHub UI).
# No apiToken: Argo does not create/manage hooks. Secret = docs-api-key/webhook-secret.
# Webhook URL: https://brain-events.nwlnexus.net/push
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-push
  namespace: codebase-brain
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push:
      # Org-level webhook delivers all repos; Sensor allowlist filters.
      organizations:
        - nwlnexus
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
      events:
        - push
      # apiToken omitted — webhook is managed in the GitHub org UI
      webhookSecret:
        name: codebase-brain-github-webhook
        key: secret
      active: true
      contentType: json
      insecure: false
      deleteHookOnFinish: false
