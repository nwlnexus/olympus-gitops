# GitHub push EventSource — HMAC only (org webhook created in GitHub UI).
# No apiToken: Argo does not create/manage hooks. Secret = docs-api-key/webhook-secret.
# Webhook URL: https://brain-events.nwlnexus.net/push
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-push
  namespace: codebase-brain
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push:
      owner: nwlnexus
      repositories:
        - olympus-sdk
        - olympus-gitops
        - olympus-infra
        - nix-darwin-hm
        - moneta
        - nix-op-secrets
        - second-brain
        - olympus-tailnet
        - homebrew-olympus
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
      events:
        - push
      # +optional apiToken omitted — webhook is managed outside the cluster
      webhookSecret:
        name: codebase-brain-github-webhook
        key: secret
      active: true
      contentType: json
      insecure: false
      deleteHookOnFinish: false
