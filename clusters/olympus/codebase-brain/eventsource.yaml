# GitHub push EventSource — HMAC verified; Sensor filters to main + allowlist.
# Webhook URL: https://brain-events.nwlnexus.net/push
#
# Create the org (or per-repo) webhook in GitHub UI once, OR let EventSource
# create it via apiToken (field `token` on 1Password item codebase-brain-github-webhook).
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-push
  namespace: codebase-brain
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push:
      owner: nwlnexus
      repositories:
        - olympus-sdk
        - olympus-gitops
        - olympus-infra
        - nix-darwin-hm
        - moneta
        - nix-op-secrets
        - second-brain
        - olympus-tailnet
        - homebrew-olympus
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
        url: https://brain-events.nwlnexus.net
      events:
        - push
      apiToken:
        name: codebase-brain-github-webhook
        key: token
      webhookSecret:
        name: codebase-brain-github-webhook
        key: secret
      active: true
      contentType: json
      insecure: false
      deleteHookOnFinish: false
