# Image pull secret for private ghcr.io/nwlnexus/codebase-brain.
# Reuses 1Password item `gh-pull-secret` (vault Dev) — same as mem0 / ingress-discovery.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: gh-pull-secret
        property: username
    - secretKey: token
      remoteRef:
        key: gh-pull-secret
        property: credential
