# GitHub App credentials for minting short-lived installation tokens → Job GH_TOKEN.
#
# OPERATOR PREREQUISITE — 1Password Dev vault item `codebase-docs-pipeline-gh-app`:
#   app-id, installation-id (string fields)
#   private-key.pem — document/file attachment; title/filename MUST be `private-key.pem`
#     (ESO OnePassword Connect addresses documents by title as `property`)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-github-app
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: private-key.pem
