# GitHub App credentials for minting short-lived installation tokens → Job GH_TOKEN.
#
# 1Password Dev item `codebase-docs-pipeline-gh-app`:
#   app-id, installation-id (string fields)
#   private-key — concealed field holding base64(PEM), no line wraps
#     (Connect collapses newlines in concealed fields; base64 preserves the PEM)
# Encode on macOS:
#   base64 -i ./private-key.pem | tr -d '\n' | pbcopy
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-github-app
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: private-key
        decodingStrategy: Base64
