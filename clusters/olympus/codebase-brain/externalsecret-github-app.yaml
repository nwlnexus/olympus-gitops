# GitHub App credentials for minting short-lived installation tokens → Job GH_TOKEN.
#
# 1Password Dev item `codebase-docs-pipeline-gh-app`:
#   app-id, installation-id (string fields)
#   private-key — concealed TEXT field with full PEM contents
#     (OnePassword Connect cannot read file attachments as ItemFields —
#      paste the .pem into a field named `private-key`, keep the file if you want)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-github-app
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: codebase-docs-pipeline-gh-app
        property: private-key
