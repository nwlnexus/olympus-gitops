# GitHub webhook HMAC + API token for the Argo Events EventSource.
#
# OPERATOR PREREQUISITE — 1Password Dev vault item `codebase-brain-github-webhook`:
#   secret — HMAC shared secret on the GitHub webhook
#   token  — fine-grained PAT (or classic) able to manage repo/org hooks for
#            EventSource webhook CRUD only — NOT used as Job GH_TOKEN
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-github-webhook
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-github-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret
      remoteRef:
        key: codebase-brain-github-webhook
        property: secret
    - secretKey: token
      remoteRef:
        key: codebase-brain-github-webhook
        property: token
