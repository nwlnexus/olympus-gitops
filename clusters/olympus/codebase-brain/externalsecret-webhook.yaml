# GitHub webhook HMAC secret for the Argo Events EventSource.
# Same value as the GitHub org webhook "Secret" field.
# Source: 1Password Dev → docs-api-key → webhook-secret
# (No PAT / apiToken — org webhook is created in the GitHub UI.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-github-webhook
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-github-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret
      remoteRef:
        key: docs-api-key
        property: webhook-secret
