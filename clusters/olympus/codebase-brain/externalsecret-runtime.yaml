# Runtime Job env (Anthropic + R2 + Slack). GH_TOKEN is minted per Workflow from
# codebase-brain-github-app — never a long-lived PAT in this Secret.
#
# 1Password (Dev vault):
#   docs-api-key            → credential, r2-endpoint, r2-access-key-id, r2-secret-access-key
#   automation-slack-bot    → slack_webhook
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codebase-brain-secrets
  namespace: codebase-brain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: codebase-brain-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ANTHROPIC_API_KEY: "{{ .anthropic }}"
        AWS_ENDPOINT_URL: "{{ .r2_endpoint }}"
        AWS_ACCESS_KEY_ID: "{{ .r2_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .r2_secret_access_key }}"
        SLACK_WEBHOOK_URL: "{{ .slack_webhook_url }}"
  data:
    - secretKey: anthropic
      remoteRef:
        key: docs-api-key
        property: credential
    - secretKey: r2_endpoint
      remoteRef:
        key: docs-api-key
        property: r2-endpoint
    - secretKey: r2_access_key_id
      remoteRef:
        key: docs-api-key
        property: r2-access-key-id
    - secretKey: r2_secret_access_key
      remoteRef:
        key: docs-api-key
        property: r2-secret-access-key
    - secretKey: slack_webhook_url
      remoteRef:
        key: automation-slack-bot
        property: slack_webhook
