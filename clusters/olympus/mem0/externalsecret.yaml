apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mem0-credentials
  namespace: mem0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: mem0-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: mem0-server
        property: api-key
    - secretKey: openai-api-key
      remoteRef:
        key: mem0-server
        property: openai-api-key
