# Image pull secret for the private ghcr.io/nwlnexus/openmemory-* images.
# Unlike the public claude-mem-server image, these packages are private, so the
# openmemory + openmemory-ui Deployments pull via this dockerconfigjson secret.
# Source: 1Password item `mem0-server` fields `ghcr-username` (a GitHub user with
# read access to the nwlnexus org packages) and `ghcr-token` (PAT with read:packages).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: mem0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: mem0-server
        property: ghcr-username
    - secretKey: token
      remoteRef:
        key: mem0-server
        property: ghcr-token
