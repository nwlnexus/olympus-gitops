apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmemory-data
  namespace: mem0
spec:
  # Persists the SQLite registry at /usr/src/openmemory/openmemory.db — the
  # source-of-truth metadata store the MCP search relies on. Losing it orphans
  # the Qdrant vectors from their app-level records.
  # qnap-iscsi (Trident) — proven SC on this cluster; Longhorn fails mkfs on these nodes.
  storageClassName: qnap-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
