# mem0-init-config — one-shot post-deploy reconciler for the OpenMemory backend config.
#
# WHY THIS EXISTS:
#   OpenMemory selects the Qdrant vector store from the QDRANT_HOST/QDRANT_PORT env
#   vars, but env alone leaves embedding_model_dims at mem0's hardcoded default of 1536.
#   The configured embedder (Ollama nomic-embed-text) emits 768-dim vectors, so without
#   this override the Qdrant collection is created with the wrong dimensionality and every
#   add/search silently mismatches. Setting embedding_model_dims is only possible via the
#   config API; this Job sets it once the API is reachable.
#
# WHY THE /mem0/vector_store SUB-ENDPOINT (not the root PUT /api/v1/config):
#   In this OpenMemory revision (b44ce4d) the root PUT handler (update_configuration in
#   api/app/routers/config.py) has a bug: it computes the merged config but never calls
#   save_config_to_db / reset_memory_client and never returns — the save+reset+return
#   lines actually belong to the following patch handler. So the root PUT is a silent
#   no-op. The dedicated PUT /api/v1/config/mem0/vector_store handler DOES persist
#   (save_config_to_db + reset_memory_client) and is what the upstream run.sh uses.
#   llm/embedder do not need to be sent: get_memory_client() builds them from the
#   LLM_PROVIDER/LLM_MODEL/EMBEDDER_PROVIDER/EMBEDDER_MODEL env on the Deployment; only
#   the vector_store dims are unreachable via env, which is exactly what we set here.
#
# IDEMPOTENT: the PUT body is fixed, so re-running drives the config to the same state.
# backoffLimit 10 + restartPolicy OnFailure tolerate the API not being ready yet.
#
# ORDERING CAVEAT: if any memory write reaches OpenMemory before this Job runs, Qdrant
# creates the "openmemory" collection at the 1536 default and mem0 reuses the existing
# collection rather than recreating it. On a fresh deploy the Job runs before any client
# traffic, so this is low-risk; if it ever happens, drop the collection and re-run the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: mem0-init-config
  namespace: mem0
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: mem0-init-config
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-config
          image: curlimages/curl:8.11.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              API="http://openmemory.mem0.svc.cluster.local:8765"

              echo "Waiting for OpenMemory API at ${API}/docs ..."
              i=0
              until curl -fsS -o /dev/null "${API}/docs"; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "API not ready after ${i} attempts; failing so the Job retries."
                  exit 1
                fi
                echo "  not ready yet (attempt ${i}); sleeping 5s"
                sleep 5
              done
              echo "API is up. Setting Qdrant vector_store (dims=768) via the sub-endpoint."

              # Only the vector_store object: this handler merges it into the persisted
              # config without clobbering llm/embedder (which come from env), and unlike
              # the root PUT it actually saves + resets the memory client.
              curl -fsS -X PUT "${API}/api/v1/config/mem0/vector_store" \
                -H 'Content-Type: application/json' \
                -d '{
                  "provider": "qdrant",
                  "config": {
                    "collection_name": "openmemory",
                    "embedding_model_dims": 768,
                    "host": "qdrant.mem0.svc.cluster.local",
                    "port": 6333
                  }
                }'

              echo
              echo "Vector store applied. Verifying (non-fatal) ..."
              curl -fsS "${API}/api/v1/config/mem0/vector_store" || true
              echo
              echo "mem0-init-config complete."
