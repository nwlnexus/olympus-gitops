# GitHub App credentials for the runner scale set controller/listener, from the
# 1Password item `arc-github-app` (vault Dev). Keys match what the
# gha-runner-scale-set chart expects of a pre-defined githubConfigSecret.
#
# PRIVATE KEY: ESO's 1Password Connect provider cannot read file attachments
# (error "expected one 1Password ItemField matching ..."), and 1Password text
# fields flatten the PEM's newlines. So the PEM is stored base64-encoded on a
# single line (`base64 -w0 key.pem`) in a concealed field named `private-key-b64`;
# decodingStrategy: Base64 restores the original multi-line PEM
# ("-----BEGIN ..." ... "-----END ...-----") in the Secret key
# `github_app_private_key`. Until that field exists this ExternalSecret reports
# SecretSyncedError for that key and the scale set will not authenticate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_app_id
      remoteRef:
        key: arc-github-app
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc-github-app
        property: installation-id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc-github-app
        property: private-key-b64
        decodingStrategy: Base64
