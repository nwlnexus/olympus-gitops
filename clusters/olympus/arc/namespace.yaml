# CI runners on the cluster (nwlnexus/olympus-sdk#383). Three namespaces:
#   arc-system       controller + one listener pod per scale set
#   arc-runners      ephemeral runner pods of the general `olympus-linux` scale set
#   arc-runners-kvm  reserved for the KVM scale set (olympus-sdk#390); empty for now
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    # Enforce baseline, but audit + warn on restricted. The listener pod is
    # synthesised by the controller at runtime (not by the Helm chart), so its
    # restricted compliance could not be verified from rendered manifests. The
    # controller Deployment and the listener (via listenerTemplate) are configured
    # to the restricted profile; promote enforce to `restricted` once the listener
    # is Running with no audit/warn events.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    # Runner pods run untrusted CI code: restricted is enforced (non-root, no
    # privilege escalation, all capabilities dropped, seccomp RuntimeDefault).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-kvm
  labels:
    # The single documented PSA exception, pending olympus-sdk#390: KVM runner
    # pods get /dev/kvm from a device plugin and may need more than `restricted`
    # allows. Still baseline, so no privileged containers, hostPath or hostNetwork.
    # Warn/audit on restricted keep the gap visible. Revisit in #390.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
