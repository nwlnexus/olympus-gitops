# CI runners on the cluster (nwlnexus/olympus-sdk#383). Two namespaces:
#   arc-system   controller + one listener pod per scale set
#   arc-runners  ephemeral runner pods of ALL scale sets (olympus-linux, olympus-gate,
#                olympus-kvm): the controller watches only this namespace.
# The former `arc-runners-kvm` placeholder is gone (olympus-sdk#390): the KVM scale
# set needs no PSA exception (it gets /dev/kvm from the device plugin in
# ../kvm-device-plugin as an extended resource), so it lives in arc-runners under
# `restricted` like the others.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  labels:
    # Enforce baseline, but audit + warn on restricted. The listener pod is
    # synthesised by the controller at runtime (not by the Helm chart), so its
    # restricted compliance could not be verified from rendered manifests. The
    # controller Deployment and the listener (via listenerTemplate) are configured
    # to the restricted profile; promote enforce to `restricted` once the listener
    # is Running with no audit/warn events.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    # Runner pods run untrusted CI code: restricted is enforced (non-root, no
    # privilege escalation, all capabilities dropped, seccomp RuntimeDefault).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
