# CI runner pods rank below every other workload on the cluster (existing
# classes: system-node-critical, system-cluster-critical; all other pods are 0),
# so the scheduler evicts/preempts CI first. preemptionPolicy: Never means a
# waiting CI pod never evicts anything else to make room for itself.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner
value: -1000
preemptionPolicy: Never
globalDefault: false
description: "Ephemeral CI runner pods (arc-runners): lowest priority, never preempt other workloads."
---
# The KVM scale set (olympus-kvm, olympus-sdk#390): identical value and policy to
# ci-runner. It exists only so ResourceQuota can tell KVM pods apart
# (scopeSelector PriorityClass; quota.yaml) and give them their own budget without
# loosening the budget of olympus-linux / olympus-gate.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner-kvm
value: -1000
preemptionPolicy: Never
globalDefault: false
description: "Ephemeral KVM CI runner pods (olympus-kvm): same as ci-runner; separate class for quota scoping."
