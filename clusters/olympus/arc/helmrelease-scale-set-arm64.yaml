apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The release name is also the runner scale set name, i.e. the `runs-on:` label.
  # `olympus-arm64`: runners on the arm64 Linux VMs that run on the Macs (k3s agents tainted
  # olympus.io/arch=arm64:NoSchedule; mmini-01-vm and mmini-02-vm (olympus.io/host=mac-mini,
  # olympus-sdk#694, decision H20) and data-hub-vm (olympus.io/host=mac-studio, #701)). Copy of olympus-linux with the node selection, the
  # toleration, maxRunners and the resource limits changed; keep the rest in step.
  name: olympus-arm64
  namespace: arc-runners
spec:
  interval: 1h
  # Chart pinned by digest through an OCIRepository (see helmrepository.yaml).
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  dependsOn:
    - name: arc
      namespace: arc-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/nwlnexus
    # Pre-defined Secret from externalsecret.yaml (GitHub App credentials).
    githubConfigSecret: arc-github-app
    runnerGroup: olympus-ci
    minRunners: 0
    # One runner per VM (three VMs: mmini-01-vm, mmini-02-vm, data-hub-vm), enforced by the topology
    # spread below. Also the drain switch (README.md); known issue #4715 as olympus-linux.
    maxRunners: 3
    # Explicit controller service account (no cluster lookup at render time).
    controllerServiceAccount:
      namespace: arc-system
      name: arc-gha-rs-controller
    # containerMode intentionally unset ("none"): jobs run directly in the runner
    # container. No docker-in-docker, nothing privileged. Jobs needing Docker stay
    # on hosted runners (spec R6).
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            resources:
              # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        # The listener is a Go controller image (multi-arch) that needs no arm64 node. It
        # stays on amd64 compute nodes: it has no toleration for the arm64 taint, and the
        # selector says so explicitly. (ARC's listener pod does not inherit the runner
        # template's nodeSelector/tolerations, only this listenerTemplate.)
        nodeSelector:
          kubernetes.io/arch: amd64
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: olympus.io/role
                      operator: DoesNotExist
    template:
      metadata:
        labels:
          # NOT olympus.io/ci-runner: that label belongs to olympus-linux and its topology spread.
          olympus.io/ci-runner-arm64: "true"
      spec:
        # The runner container does not talk to the Kubernetes API in this mode;
        # the chart's service account ("-no-permission") has no RBAC anyway.
        automountServiceAccountToken: false
        priorityClassName: ci-runner
        # Hard wall-clock cap for the pod (olympus-sdk#390 review m1): a stuck job cannot
        # hold a slot for days. Longest jobs (release builds) take well under 1 h; 3 h is ample. The kubelet kills the runner; ARC
        # 0.15.0 then deletes the EphemeralRunner if a job was assigned (the job fails
        # as "runner lost") or recreates the pod if none was, so the slot is freed.
        activeDeadlineSeconds: 10800
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001          # `runner` user in the runner image (numeric: required by runAsNonRoot)
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        # arm64 pool only: the Mac VMs, the cluster's only arm64 nodes. They carry the NoSchedule
        # taint, so nothing else lands there and this is the only runner set that tolerates it. The
        # arch selector covers every Mac (mac-mini and mac-studio) and keeps the image honest.
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: olympus.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
        # One runner per VM: a 4 CPU / 7 GiB runner fills most of a 6 vCPU / 12 GiB VM (kubelet
        # reserves cpu 1, memory 3Gi like the onodes, README.md), so a second would not fit
        # anyway. DoNotSchedule makes it explicit; a third job waits for a free VM.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                olympus.io/ci-runner-arm64: "true"
        containers:
          - name: runner
            # The same image name as olympus-linux; the runner tag is now a multi-arch
            # manifest list (amd64 + arm64, olympus-sdk#694), so the digest is the INDEX digest
            # and the kubelet picks the arm64 entry on these nodes.
            # Index digest from runner-image run 41216712374 (olympus-sdk main, 2026-10-31): linux/amd64 + linux/arm64.
            # The amd64 scale sets stay on their single-arch pin until they are moved deliberately.
            image: ghcr.io/nwlnexus/olympus-ci-runner@sha256:e45e955bed258dec4bb23ef3eec4902689fb63bb4f2cef891ba10801b73a3753
            command: ["/home/runner/run.sh"]
            # Egress proxy (olympus-sdk#407, ../ci-egress/, README "Egress proxy"). Set explicitly on the
            # runner container, not with the chart's `proxy:` value: that would also route the
            # listener in arc-system through it, whose network policy has no path to the proxy.
            # Phase 1 is log-only and direct egress still works, so a tool that ignores these keeps
            # working. Both cases: curl reads only lowercase http_proxy, others prefer uppercase.
            # NO_PROXY: loopback (QEMU guests are reached through hostfwd on 127.0.0.1), in-cluster
            # names (incl. the LiteLLM Service the olympus-kvm executor uses), 10.0.0.0/8 for clients
            # that understand CIDR (curl 7.81 does not), and the pod's own IP.
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: HTTP_PROXY
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: HTTPS_PROXY
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: http_proxy
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: https_proxy
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: NO_PROXY
                value: localhost,127.0.0.1,::1,0.0.0.0,.svc,.cluster.local,10.0.0.0/8,litellm.inference.svc,litellm.inference.svc.cluster.local,$(POD_IP)
              - name: no_proxy
                value: localhost,127.0.0.1,::1,0.0.0.0,.svc,.cluster.local,10.0.0.0/8,litellm.inference.svc,litellm.inference.svc.cluster.local,$(POD_IP)
              # Node 24 ignores HTTP(S)_PROXY unless this is set; actions such as
              # create-github-app-token refuse to run when a proxy env is set without it (#407).
              - name: NODE_USE_ENV_PROXY
                value: "1"
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 4Gi
              limits:
                cpu: "4"
                memory: 7Gi
                ephemeral-storage: 15Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              # readOnlyRootFilesystem is NOT set: the runner writes its config,
              # _diag logs and tool caches under /home/runner and the root fs is
              # discarded with the (ephemeral) pod anyway. The work dir and /tmp are
              # emptyDirs with size limits so a job cannot fill the node disk.
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 12Gi
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
