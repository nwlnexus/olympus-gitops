# Hard ceilings (spec section 5). Starting points; tune from observed usage.
#
# arc-runners holds three scale sets. Three quotas, so adding olympus-kvm
# (olympus-sdk#390) does NOT loosen the budget of the other two:
#   ci-runners          the namespace total = non-KVM budget + two KVM pods
#   ci-runners-non-kvm  every pod whose priorityClassName is NOT ci-runner-kvm
#                       (olympus-linux, olympus-gate, and any pod without a class):
#                       exactly the pod/CPU/memory budget these sets had before #390,
#                       and 0 KVM devices
#   ci-runners-kvm      pods with priorityClassName ci-runner-kvm (olympus-kvm only):
#                       two pods, two /dev/kvm (one per KVM node)
# A PriorityClass scope is the only quota scope that can tell pods of different
# scale sets apart; verified on the cluster (2026-10-19, server dry-run) that
# `NotIn` also matches pods with no priorityClassName at all, so nothing escapes.
# LIMITATION: the API server rejects ephemeral-storage in a scoped quota
# ("unsupported scope applied to resource"), so ephemeral storage is capped only by
# the total below (18/76 GiB before #390, now 26/106 GiB = + two KVM pods's 4/15 GiB)
# and per container by the LimitRange (15 GiB). Pods, CPU, memory and /dev/kvm are
# split exactly; for disk, the non-KVM sets stay bounded by their pod counts x
# per-pod limits, only the namespace sum gained one KVM pod's share.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners
  namespace: arc-runners
spec:
  hard:
    # = ci-runners-non-kvm + ci-runners-kvm (keep the sums in step when tuning).
    pods: "16"                     # 4 runners + 8 gates + 2 arm64 runners + 2 KVM runners
    requests.cpu: "16500m"
    requests.memory: 33Gi
    limits.cpu: "34"
    limits.memory: 66Gi
    requests.ephemeral-storage: 34Gi
    limits.ephemeral-storage: 136Gi
    requests.olympus.io/kvm: "2"
    persistentvolumeclaims: "0"    # runners are stateless (emptyDir only)
    services: "0"
    secrets: "34"                  # one JIT-config Secret per runner/gate/arm64/KVM pod + the synced app Secret
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners-non-kvm
  namespace: arc-runners
spec:
  # Unchanged budget of olympus-linux + olympus-gate (before #390 this was the
  # namespace quota). Runner budget: 4 pods x (2 CPU / 4 GiB requests,
  # 4 CPU / 8 GiB limits, 4 / 15 GiB ephemeral). The spec's final ceiling (6 pods,
  # 24 CPU, 48 GiB) is deliberately NOT used until node reserves and monitoring exist.
  # On top of it, up to 8 olympus-gate pods (50m / 128Mi / 256Mi requests,
  # 500m / 512Mi / 2Gi limits): +0.4 CPU, +1Gi memory, +2Gi ephemeral requests;
  # +4 CPU, +4Gi memory, +16Gi ephemeral limits. maxRunners caps gates at 8, so
  # the runner budget above always remains available to the 4 runner pods.
  # olympus-arm64 (olympus-sdk#694) adds 2 pods (2 CPU / 4 GiB requests, 4 CPU / 7 GiB
  # limits, 4 / 15 GiB ephemeral): +4 CPU, +8Gi requests; +8 CPU, +14Gi limits. The
  # pool is shared, not per-set: the arm64 pods can only run on the arm64 VMs, but the
  # quota does not know that, so a busy arm64 pool leaves less for olympus-linux.
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: ["ci-runner-kvm"]
  hard:
    pods: "14"                     # 4 runners + 8 gates + 2 arm64 runners (olympus-arm64, #694)
    requests.cpu: "12500m"
    requests.memory: 25Gi
    limits.cpu: "28"
    limits.memory: 50Gi
    requests.olympus.io/kvm: "0"   # only olympus-kvm pods may hold /dev/kvm
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners-kvm
  namespace: arc-runners
spec:
  # olympus-kvm: 2 pods (each 2 CPU / 4 GiB / 4 GiB ephemeral requests, 3 CPU / 8 GiB /
  # 15 GiB limits) and one /dev/kvm each (one per KVM node). No slack for a terminating pod on purpose:
  # a new KVM runner waits until the previous one is gone (it also waits for the
  # device, count 1 per node).
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: ["ci-runner-kvm"]
  hard:
    pods: "2"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "6"
    limits.memory: 16Gi
    requests.olympus.io/kvm: "2"
---
# Controller + listener(s) only; small.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-system
  namespace: arc-system
spec:
  hard:
    pods: "10"                     # controller + one listener per scale set (olympus-linux, olympus-gate, olympus-kvm, olympus-arm64)
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
