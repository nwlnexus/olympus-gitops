# Hard ceilings (spec section 5). Starting points; tune from observed usage.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners
  namespace: arc-runners
spec:
  hard:
    # Staged: first target is 3 runners (maxRunners), 4 pods leaves one for a
    # terminating pod. Runner budget unchanged: 4 pods x (2 CPU / 4 GiB requests,
    # 4 CPU / 8 GiB limits, 4 / 15 GiB ephemeral). The spec's final ceiling (6 pods,
    # 24 CPU, 48 GiB) is deliberately NOT used until node reserves and monitoring exist.
    # On top of it, up to 8 olympus-gate pods (50m / 128Mi / 256Mi requests,
    # 500m / 512Mi / 2Gi limits): +0.4 CPU, +1Gi memory, +2Gi ephemeral requests;
    # +4 CPU, +4Gi memory, +16Gi ephemeral limits. maxRunners caps gates at 8, so
    # the runner budget above always remains available to the 4 runner pods.
    pods: "12"                     # 4 runners + 8 gates
    requests.cpu: "8500m"
    requests.memory: 17Gi
    limits.cpu: "20"
    limits.memory: 36Gi
    requests.ephemeral-storage: 18Gi
    limits.ephemeral-storage: 76Gi
    persistentvolumeclaims: "0"    # runners are stateless (emptyDir only)
    services: "0"
    secrets: "30"                  # one JIT-config Secret per runner/gate pod + the synced app Secret
---
# Controller + listener(s) only; small.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-system
  namespace: arc-system
spec:
  hard:
    pods: "10"                     # controller + one listener per scale set (olympus-linux, olympus-gate, later olympus-kvm)
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
# arc-runners-kvm stays empty until nwlnexus/olympus-sdk#390.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-pods-until-390
  namespace: arc-runners-kvm
spec:
  hard:
    pods: "0"
