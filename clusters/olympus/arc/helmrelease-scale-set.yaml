apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The release name is also the runner scale set name, i.e. the `runs-on:` label.
  name: olympus-linux
  namespace: arc-runners
spec:
  interval: 1h
  # Chart pinned by digest through an OCIRepository (see helmrepository.yaml).
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  dependsOn:
    - name: arc
      namespace: arc-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/nwlnexus
    # Pre-defined Secret from externalsecret.yaml (GitHub App credentials).
    githubConfigSecret: arc-github-app
    runnerGroup: olympus-ci
    minRunners: 0
    # Raised from 0 to 3 on 2026-10-19 after every precondition in README.md was done
    # and verified (node IPv6 link-local DROP + sshd hardening on all four nodes,
    # kubelet reserves on the three onodes, UniFi policy node IPs -> Gateway ports
    # 22/80/443/8443). Raised from 3 to 4 on 2026-11-10 after a week of node load at 3 showed
    # ample headroom. Raised from 4 to 6 on 2026-11-22 (olympus-gitops#295): two per onode.
    # Until then the topology spread below counted the tainted arm64 VMs as empty domains, so
    # the real ceiling was 3 (one per onode) whatever this said. Headroom at 6: each onode has
    # 15 CPU / 23.2 GiB allocatable; two runners add 4 CPU / 8 GiB requests, and the busiest
    # onode (KVM runner + gates + services) stays near 7.4 CPU / 15.3 GiB requests; etcd WAL
    # fsync and backend commit p99 under 8 ms on all three (thresholds 25 / 50 ms, README).
    # Do not go above 6 (3 per onode) without a new headroom check.
    # Also the drain switch (README.md); known issue: raising it again from 0 can
    # leave queued jobs stuck until a new dispatch or a listener restart (#4715).
    maxRunners: 6
    # Explicit controller service account (no cluster lookup at render time).
    controllerServiceAccount:
      namespace: arc-system
      name: arc-gha-rs-controller
    # containerMode intentionally unset ("none"): jobs run directly in the runner
    # container. No docker-in-docker, nothing privileged. Jobs needing Docker stay
    # on hosted runners (spec R6).
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            resources:
              # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: olympus.io/role
                      operator: DoesNotExist
    template:
      metadata:
        labels:
          olympus.io/ci-runner: "true"
      spec:
        # The runner container does not talk to the Kubernetes API in this mode;
        # the chart's service account ("-no-permission") has no RBAC anyway.
        automountServiceAccountToken: false
        priorityClassName: ci-runner
        # Hard wall-clock cap for the pod (olympus-sdk#390 review m1): a stuck job cannot
        # hold a slot for days. Longest jobs (release builds) take well under 1 h; 3 h is ample. The kubelet kills the runner; ARC
        # 0.15.0 then deletes the EphemeralRunner if a job was assigned (the job fails
        # as "runner lost") or recreates the pod if none was, so the slot is freed.
        activeDeadlineSeconds: 10800
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001          # `runner` user in the runner image (numeric: required by runAsNonRoot)
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        # Compute pool only: onode-030c31/0312ce/0314ac (olympus-sdk#567, owner decision
        # 2026-10-28). `olympus.io/role DoesNotExist` keeps runners off the agent-services
        # onodes (memory + inference); the hostname rule keeps them off naraka-01, which
        # is an untainted general worker but has only 4 CPUs (a 4-CPU / 8 GiB runner
        # would starve it; the scheduler would otherwise pick it for its free memory).
        # A new general worker must be added here too (or switch to a pool label).
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: olympus.io/role
                      operator: DoesNotExist
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: ["naraka-01"]
                    # amd64 only: the arm64 VMs have no olympus.io/role label and would
                    # otherwise match this term (they are kept off only by their taint).
                    - key: kubernetes.io/arch
                      operator: In
                      values: ["amd64"]
        # Spread runners across the three onodes. Terminating pods are not counted
        # by topology spread, so during churn more runners than usual can briefly land
        # on ONE node: kubelet reserves are a precondition (README.md) and runners rank
        # lowest for eviction (priority -1000).
        # nodeTaintsPolicy Honor (olympus-gitops#295): with the default Ignore, every node
        # that passes the affinity counts as a domain even when its taint keeps runners off.
        # The three tainted arm64 VMs then held 0 runners each, so the skew was already 1
        # with one runner per onode and every further runner stayed Pending.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                olympus.io/ci-runner: "true"
        containers:
          - name: runner
            # Our runner image (Ubuntu 22.04 glibc baseline, CI toolchains, actions
            # runner 2.338.0, user `runner` uid 1001, no sudo), pinned by digest.
            # Public package; built by ci/runner/build.sh (olympus-sdk#388/#406).
            # Bump procedure: README.md.
            image: ghcr.io/nwlnexus/olympus-ci-runner@sha256:3173f04c4f9ae2a2b635f28bfa83a228e905021a6b1dc5818b7ef115d7100c16
            command: ["/home/runner/run.sh"]
            # Egress proxy (olympus-sdk#407, ../ci-egress/, README "Egress proxy"). Set explicitly on the
            # runner container, not with the chart's `proxy:` value: that would also route the
            # listener in arc-system through it, whose network policy has no path to the proxy.
            # Phase 1 is log-only and direct egress still works, so a tool that ignores these keeps
            # working. Both cases: curl reads only lowercase http_proxy, others prefer uppercase.
            # NO_PROXY: loopback (QEMU guests are reached through hostfwd on 127.0.0.1), in-cluster
            # names (incl. the LiteLLM Service the olympus-kvm executor uses), 10.0.0.0/8 for clients
            # that understand CIDR (curl 7.81 does not), and the pod's own IP.
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: HTTP_PROXY
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: HTTPS_PROXY
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: http_proxy
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: https_proxy
                value: http://egress-proxy.ci-egress.svc.cluster.local:3128
              - name: NO_PROXY
                value: localhost,127.0.0.1,::1,0.0.0.0,.svc,.cluster.local,10.0.0.0/8,litellm.inference.svc,litellm.inference.svc.cluster.local,$(POD_IP)
              - name: no_proxy
                value: localhost,127.0.0.1,::1,0.0.0.0,.svc,.cluster.local,10.0.0.0/8,litellm.inference.svc,litellm.inference.svc.cluster.local,$(POD_IP)
              # Node 24 ignores HTTP(S)_PROXY unless this is set; actions such as
              # create-github-app-token refuse to run when a proxy env is set without it (#407).
              - name: NODE_USE_ENV_PROXY
                value: "1"
              # No telemetry from CI tools (#407): with the egress allowlist these hosts are denied
              # anyway; off at the source so the proxy log only shows real denials.
              - name: WRANGLER_SEND_METRICS
                value: "false"
              - name: TURBO_TELEMETRY_DISABLED
                value: "1"
              - name: DO_NOT_TRACK
                value: "1"
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 15Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              # readOnlyRootFilesystem is NOT set: the runner writes its config,
              # _diag logs and tool caches under /home/runner and the root fs is
              # discarded with the (ephemeral) pod anyway. The work dir and /tmp are
              # emptyDirs with size limits so a job cannot fill the node disk.
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 12Gi
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
