apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-system
spec:
  interval: 1h
  # Chart pinned by digest through an OCIRepository (see helmrepository.yaml);
  # controller and scale set chart versions must always be bumped together.
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
    namespace: arc-system
  # Helm installs CRDs from crds/ once and never upgrades them; CreateReplace
  # makes Flux create and replace them on install and on every upgrade.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 1
    # Image pinned by digest (the multi-arch index of 0.15.0). The listener pods
    # use the same image (the controller passes its own image to them).
    image:
      tag: "0.15.0@sha256:162dfb5bfbda9e7e49fbed67d428994c9ced55b41a37a18b75b46dab0aa98d37"
    flags:
      logLevel: info
      # Watch only the runner namespace: the chart then creates namespaced Roles
      # instead of the cluster-wide ClusterRole. Consequence: scale sets must live
      # in arc-runners (all three do, including olympus-kvm, #390).
      watchSingleNamespace: arc-runners
    # Metrics (olympus-sdk#392). The controller serves gha_controller_* and controller-runtime
    # metrics on :8080 (container port `metrics`); it passes listenerAddr/listenerEndpoint to every
    # listener pod it creates, which then serves the gha_* scale-set metrics on :8080 too (port
    # `metrics`, default label set: no workflow ref labels). Scraped by the arc-controller and
    # arc-listeners jobs in ../observability/prometheus-helmrelease.yaml; ingress from Prometheus only,
    # networkpolicy-metrics.yaml. Changing this block restarts the controller and recreates every
    # listener (seconds; running jobs are not affected).
    metrics:
      controllerManagerAddr: ":8080"
      listenerAddr: ":8080"
      listenerEndpoint: "/metrics"
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Restricted-profile pod (image runs as 65532:65532).
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true   # chart mounts an emptyDir at /tmp
      capabilities:
        drop: ["ALL"]
    # Controller runs on the onodes (no toleration for naraka-01's management-hub taint).
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: olympus.io/role
                  operator: DoesNotExist
