apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
