apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      # arm64 opt-in (olympus-sdk#707): every image in this pod is a multi-arch index with linux/arm64,
      # so it may also run on the Mac VMs (tainted olympus.io/arch=arm64:NoSchedule). No arch
      # preference: requests + LeastAllocated scoring and the descheduler place it.
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
