apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qnap-iscsi
  # NOT default: local-path (k3s built-in) is the cluster default class.
  # Workloads must request storageClassName: qnap-iscsi explicitly.
provisioner: csi.trident.qnap.io
parameters:
  selector: "location=compute-hub"
  # Required so fsGroup applies (Trident fsGroupPolicy=ReadWriteOnceWithFSType):
  # without a known fsType kubelet skips the chown and non-root workloads get
  # permission denied on the root-owned volume.
  fsType: "ext4"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
