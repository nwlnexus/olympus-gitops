apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/olympus/argo-workflows
  prune: true
  # HelmRelease may report Failed briefly while CRDs settle; don't block the
  # tree forever — argo-events/codebase-brain still dependsOn this KS.
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
