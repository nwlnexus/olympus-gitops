apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portainer
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/olympus/portainer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
    - name: external-secrets-config
    - name: cert-manager
    - name: cert-manager-config
    - name: tailscale-operator
    - name: external-dns
    - name: qnap-storage
  # NOT depending on traefik-config: that kustomization is suspended for the
  # staged OTLP rollout and would permanently block portainer. Portainer's
  # IngressRoute ships with its own manifests.
