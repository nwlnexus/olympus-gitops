# Tailscale LoadBalancer services for in-cluster workloads.
#
# NOTE: postgres-ts, redis-ts, clickhouse-ts, and kafka-ts were removed in
# the cluster-collapse-p2b cleanup (2026-06-07). PostgreSQL, Redis, ClickHouse,
# and standalone Kafka now run as macOS LaunchDaemons on data-hub and are
# reachable directly over the tailnet (short name `data-hub` via CoreDNS).
#
# Only in-cluster services that need tailnet exposure are listed here.
# Redpanda broker is in-cluster; its Tailscale exposure is handled by the
# Redpanda HelmRelease service configuration.
#
# This file is intentionally kept (referenced in kustomization.yaml) as a
# placeholder. Add new entries here when in-cluster services need tailnet LBs.
