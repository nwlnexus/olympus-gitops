# DEFERRED (2026-06-01): scaled to 0. PostgREST is not usable as configured —
# it targets Sentry's `sentry` DB / `public` schema and references an `anon`
# anon-role that does not exist (only the `postgres` superuser exists), so every
# request fails. Deferred until there is a concrete API data model. To re-enable:
#   1. create a dedicated DB/schema (not Sentry's) for the API surface
#   2. create roles: authenticator (LOGIN, NOINHERIT) + anon (NOLOGIN);
#      GRANT anon TO authenticator; grant USAGE/SELECT on the exposed schema
#   3. repoint PGRST_DB_URI at `authenticator` (not `postgres`), set
#      PGRST_DB_SCHEMA to the exposed schema, set replicas back to 1, and
#      re-add postgrest-ingressroute.yaml to kustomization.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: platform
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: postgres-password
            - name: PGRST_DB_URI
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgresql.platform.svc.cluster.local:5432/platform"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: postgrest-jwt-secret
            - name: PGRST_DB_SCHEMA
              value: public
            - name: PGRST_DB_ANON_ROLE
              value: anon
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: platform
spec:
  selector:
    app: postgrest
  ports:
    - port: 3000
      targetPort: 3000
