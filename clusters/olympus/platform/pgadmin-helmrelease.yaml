apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: platform
spec:
  interval: 1h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: pgadmin4
      sourceRef:
        kind: HelmRepository
        name: runix
        namespace: platform
  values:
    # pgadmin-data is a single RWO qnap-iscsi volume. The chart's default
    # RollingUpdate surges a new pod first; when it lands on another node it
    # hits Multi-Attach, never becomes Ready, and the Helm upgrade times out
    # and rolls back. Recreate stops the old pod before starting the new one.
    strategy:
      type: Recreate
    ingress:
      enabled: false
    persistentVolume:
      enabled: true
      existingClaim: pgadmin-data
    existingSecret: pgadmin-credentials
    secretKeys:
      pgadminPasswordKey: password
    env:
      email: admin@nwlnexus.net
    serverDefinitions:
      enabled: true
      servers:
        data-hub:
          Name: data-hub-postgres
          Group: Servers
          Port: 5432
          Username: postgres
          Host: data-hub
          SSLMode: prefer
          MaintenanceDB: postgres
