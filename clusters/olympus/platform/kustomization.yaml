apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - bitnami-helmrepository.yaml

  # Redpanda — in-cluster broker (no macOS arm64 binary available)
  - redpanda-helmrepository.yaml
  - redpanda-server-helmrelease.yaml
  - redpanda-helmrelease.yaml
  - redpanda-ingressroute.yaml

  # ch-ui, redisinsight, pgadmin and the platform-credentials ExternalSecret were
  # removed (olympus-sdk#446): the ClickHouse and Redis tiers they pointed at are
  # retired, and Postgres on data-hub goes away at WS9 of olympus-sdk#444.
  #
  # tailscale-services.yaml — intentionally excluded from kustomization.
  # postgres-ts/redis-ts/clickhouse-ts/kafka-ts removed; re-add entries to
  # tailscale-services.yaml + here when new in-cluster services need tailnet
  # LoadBalancer exposure.
