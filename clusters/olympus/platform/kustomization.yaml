apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace + secrets
  - namespace.yaml
  - externalsecret.yaml
  - pgadmin-externalsecret.yaml

  # pgAdmin — UI for PostgreSQL (data now on ai-hub:5432)
  - bitnami-helmrepository.yaml
  - pgadmin-pvc.yaml
  - pgadmin-helmrepository.yaml
  - pgadmin-helmrelease.yaml
  - pgadmin-certificate.yaml
  - pgadmin-ingressroute.yaml

  # RedisInsight — UI for Redis (data now on ai-hub:6379)
  - redisinsight-deployment.yaml
  - redisinsight-ingressroute.yaml

  # Redpanda — in-cluster broker (no macOS arm64 binary available)
  - redpanda-helmrepository.yaml
  - redpanda-server-helmrelease.yaml
  - redpanda-helmrelease.yaml
  - redpanda-ingressroute.yaml

  # CH-UI — UI for ClickHouse (data now on ai-hub:8123)
  - ch-ui-pvc.yaml
  - ch-ui-deployment.yaml
  - ch-ui-ingressroute.yaml

  # tailscale-services.yaml — intentionally excluded from kustomization.
  # postgres-ts/redis-ts/clickhouse-ts/kafka-ts removed; data layer now native
  # on ai-hub. Re-add entries to tailscale-services.yaml + here when new
  # in-cluster services need tailnet LoadBalancer exposure.
