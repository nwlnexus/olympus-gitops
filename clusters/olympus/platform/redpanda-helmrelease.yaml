apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redpanda-console
  namespace: platform
spec:
  interval: 1h
  install:
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: console
      sourceRef:
        kind: HelmRepository
        name: redpanda
        namespace: platform
  values:
    config:
      kafka:
        brokers:
          - redpanda.platform.svc.cluster.local:9092
    ingress:
      enabled: false
    # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
    # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
    # LeastAllocated scoring and the descheduler place it.
    tolerations:
      - key: olympus.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 192Mi
