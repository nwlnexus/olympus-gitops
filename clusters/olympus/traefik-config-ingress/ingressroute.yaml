apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: traefik.nwlnexus.net
    external-dns.alpha.kubernetes.io/target: ing.compute.nwlnexus.net
    # App-launcher discovery (issue #117) — canary opt-in.
    launcher.olympus.io/enabled: "true"
    launcher.olympus.io/display-name: "Traefik Dashboard"
    launcher.olympus.io/group: "Platform"
    launcher.olympus.io/icon: "network"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.nwlnexus.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: traefik-dashboard-tls
