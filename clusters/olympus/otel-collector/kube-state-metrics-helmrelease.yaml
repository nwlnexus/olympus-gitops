apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: otel
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "7.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: otel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-state-metrics
    # Chart creates its own ClusterRole/binding (rbac.create=true) to read k8s objects.
    # Service kube-state-metrics:8080 (port name "http").
