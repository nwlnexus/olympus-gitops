apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: otel
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "7.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: otel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-state-metrics
    # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
    # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
    # LeastAllocated scoring and the descheduler place it.
    tolerations:
      - key: olympus.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 112Mi
    # Chart creates its own ClusterRole/binding (rbac.create=true) to read k8s objects.
    # Service kube-state-metrics:8080 (port name "http").
