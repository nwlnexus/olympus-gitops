apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: otel
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.55.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: otel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: node-exporter
    # DaemonSet, hostNetwork/hostPID + host mounts are chart defaults. Service
    # node-exporter:9100 (port name "metrics"). Scraped by the otel collector.
