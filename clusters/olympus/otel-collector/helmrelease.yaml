apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: otel
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: otel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: deployment
    replicaCount: 1
    fullnameOverride: opentelemetry-collector
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: otel/opentelemetry-collector-contrib
    # Prometheus receiver k8s service discovery needs cluster read access.
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources: [services, endpoints, pods]
          verbs: [get, list, watch]
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      metrics:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    service:
      type: ClusterIP
    presets:
      logsCollection:
        enabled: false
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger: null
        zipkin: null
        # Scrape the in-cluster Traefik metrics Service; keep only the metrics port
        # (role:endpoints also emits the pod's other container ports), stamp cluster.
        prometheus:
          config:
            scrape_configs:
              - job_name: traefik
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name]
                    action: keep
                    regex: traefik-metrics
                  - source_labels: [__meta_kubernetes_endpoint_port_name]
                    action: keep
                    regex: metrics
                  - target_label: cluster
                    replacement: olympus
              - job_name: node-exporter
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names: [otel]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name]
                    action: keep
                    regex: node-exporter
                  - source_labels: [__meta_kubernetes_endpoint_port_name]
                    action: keep
                    regex: metrics
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: instance
                  - target_label: cluster
                    replacement: olympus
              - job_name: kube-state-metrics
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names: [otel]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name]
                    action: keep
                    regex: kube-state-metrics
                  - source_labels: [__meta_kubernetes_endpoint_port_name]
                    action: keep
                    regex: http
                  - target_label: cluster
                    replacement: olympus
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          timeout: 5s
          send_batch_size: 512
        # Claude Code exports delta counters from many concurrent processes. Summing the deltas of each
        # series here gives one cumulative counter per (account, repo, model, ...) that Prometheus can
        # rate()/increase(); a stream unseen for max_stale starts again from zero (a counter reset).
        deltatocumulative:
          max_stale: 24h
        resource:
          attributes:
            - key: service.name
              value: traefik-edge
              action: upsert
            - key: cluster
              value: olympus
              action: upsert
            - key: deployment.environment
              value: homelab
              action: upsert
      exporters:
        # Traefik/edge traces → Tempo in the olympus observability stack,
        # reached via the obs-tempo tailnet Service over the tailnet.
        otlp/tempo:
          endpoint: obs-tempo.raptor-mimosa.ts.net:4317
          tls:
            insecure: true
        # Traefik metrics → olympus Prometheus remote-write receiver,
        # reached via the obs-prometheus tailnet Service over the tailnet.
        prometheusremotewrite/mgmt:
          endpoint: http://obs-prometheus.raptor-mimosa.ts.net:9090/api/v1/write
        # Agent-session metrics (Claude Code, olympus-sdk#565) -> the same Prometheus, in-cluster. Resource
        # attributes (account, host.name, ...) become labels so the dashboard can split by account.
        prometheusremotewrite/agents:
          endpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/write
          resource_to_telemetry_conversion:
            enabled: true
        # Agent-session events (tool results, tool decisions, API errors) -> Loki's OTLP endpoint, in-cluster.
        otlphttp/loki-agents:
          logs_endpoint: http://loki.observability.svc.cluster.local:3100/otlp/v1/logs
      service:
        telemetry:
          metrics:
            level: none
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [prometheus]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite/mgmt]
          metrics/agents:
            receivers: [otlp]
            processors: [memory_limiter, deltatocumulative, batch]
            exporters: [prometheusremotewrite/agents]
          logs/agents:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/loki-agents]
