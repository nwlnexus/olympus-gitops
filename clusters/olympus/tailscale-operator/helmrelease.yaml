apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"  # pinned: unpinned upgrades silently changed proxy behavior (VIPService) and churned agents; bump deliberately after reading the changelog
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: operator-oauth
      valuesKey: clientId
      targetPath: oauth.clientId
    - kind: Secret
      name: operator-oauth
      valuesKey: clientSecret
      targetPath: oauth.clientSecret
  values:
    operatorConfig:
      hostname: compute-hub-operator
      # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
      # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
      # LeastAllocated scoring and the descheduler place it.
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      resources:
        # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
        requests:
          cpu: 10m
          memory: 64Mi
    # Proxies for Services/Ingresses without their own ProxyClass get requests from proxyclass.yaml.
    proxyConfig:
      defaultProxyClass: proxy-sized
    # Identity-enforced kubectl/k9s access over the tailnet. The operator's
    # API server proxy (https://compute-hub-operator.<tailnet>.ts.net)
    # authenticates the caller's Tailscale identity and impersonates k8s groups
    # per the tailnet ACL grant (app: tailscale.com/cap/kubernetes, dst
    # tag:k8s-operator). Replaces shared admin client-cert kubeconfigs.
    apiServerProxyConfig:
      mode: "true"
      allowImpersonation: "true"
