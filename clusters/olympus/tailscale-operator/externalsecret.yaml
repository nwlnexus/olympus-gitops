apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # camelCase keys feed the HelmRelease valuesFrom (oauth.clientId/Secret).
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        # snake_case keys are what the operator reads (CLIENT_ID_FILE=/oauth/client_id).
        # The chart also writes them into this same Secret; declaring them here
        # keeps them when ESO >= 0.11 recomputes Owner secrets from the template
        # and drops undeclared keys.
        client_id: "{{ .clientId }}"
        client_secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: ansible-tailscale-oauth
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: ansible-tailscale-oauth
        property: client-secret
