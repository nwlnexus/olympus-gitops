apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "2.2.12"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
  values:
    reloader:
      # Cluster-wide: every namespace carries reloader.stakater.com/auto annotations (memory, inference,
      # arc, ...). With watchGlobally false the chart installs namespace Roles only, Reloader watched
      # nothing outside its own namespace, and ConfigMap/Secret changes never rolled pods
      # (olympus-sdk#623: the 2026-10-28 extract-worker 401 outage and the forget-limit change).
      watchGlobally: true
      deployment:
        # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
        # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
        # LeastAllocated scoring and the descheduler place it.
        tolerations:
          - key: olympus.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
        resources:
          # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
          requests:
            cpu: 10m
            memory: 64Mi
