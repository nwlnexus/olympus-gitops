apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo-workflows
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-workflows
      version: "1.0.20"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argo-workflows
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Controller manages Workflows in codebase-brain (namespace created in this
    # kustomization so Helm RoleBindings can land before the app Flux KS runs).
    server:
      enabled: true
      # UI is cluster-internal; reach via kubectl port-forward when needed.
      ingress:
        enabled: false
      authModes:
        - server
    controller:
      workflowNamespaces:
        - codebase-brain
      parallelism: 20
    workflow:
      serviceAccount:
        create: false
    # Avoid helm install failing on transient resource waits after CRD job.
    crds:
      keep: true
