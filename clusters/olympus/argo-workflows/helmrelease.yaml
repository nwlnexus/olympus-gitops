apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo-workflows
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-workflows
      version: "1.0.20"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argo-workflows
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Controller only in this namespace; Workflows for codebase-brain run in
    # their own namespace (controller.workflowNamespaces).
    server:
      enabled: true
      # UI is cluster-internal; reach via kubectl port-forward when needed.
      ingress:
        enabled: false
      authModes:
        - server
    controller:
      workflowNamespaces:
        - codebase-brain
      parallelism: 20
    workflow:
      serviceAccount:
        create: false
