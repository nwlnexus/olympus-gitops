# squat/generic-device-plugin advertising the host's /dev/kvm as the extended
# resource `olympus.io/kvm` (nwlnexus/olympus-sdk#390). A pod that requests
# `olympus.io/kvm: 1` gets the /dev/kvm device node (cgroup rw, no mknod) and
# nothing else; it needs no privileges, no hostPath and no capabilities.
#
# Why this plugin: maintained (2026 releases), single static binary from scratch,
# configurable per device with a `count` (smarter-device-manager: last push
# 2025-03, KubeVirt's kvm device plugin: archived).
#
# `count: 1` = at most ONE pod per node holds /dev/kvm at a time. Together with
# `maxRunners: 1` on the scale set this caps KVM CI at one VM job per KVM node,
# enforced by the scheduler even if maxRunners is raised.
#
# Node selection: only nodes labelled `node-restriction.kubernetes.io/kvm-ci=true`
# run the plugin, so only they advertise the resource (manual label, README.md in
# ../arc/). The `node-restriction.kubernetes.io/` prefix cannot be set by a kubelet
# on its own Node object (NodeRestriction admission, enabled in k3s), so a
# compromised node cannot label itself to attract KVM jobs.
#
# TRUST: this pod is equivalent to root on its node. It answers the kubelet's
# Allocate calls, so a malicious image could hand the KVM runner pod any host device
# or host path; as uid 0 it can also write kubelet.sock / kubelet_internal_checkpoint
# in /var/lib/kubelet/device-plugins. Hence: our own mirror of the image pinned by
# digest, a ValidatingAdmissionPolicy that admits only that image in this namespace
# (vap.yaml), labelled nodes only.
#
# Hardening (less than the upstream manifest's `privileged: true` + hostPath /dev):
#  - hostPath ONLY for /dev/kvm (CharDevice; the plugin only stats it to discover
#    the device) and the kubelet device-plugin directory (its socket);
#  - uid 0 (the socket directory is root:root 0755) but ALL capabilities
#    dropped, no privilege escalation, read-only root fs, seccomp RuntimeDefault;
#  - no service account token, metrics on 127.0.0.1 only, default-deny NetworkPolicy.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kvm-device-plugin
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # See priorityclass.yaml: above ordinary workloads for eviction, never preempts.
      priorityClassName: ci-device-plugin
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        node-restriction.kubernetes.io/kvm-ci: "true"
      # No tolerations: the KVM node stays onode-030c31 (compute pool, untainted;
      # olympus-sdk#567 owner decision 2026-10-28).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generic-device-plugin
          # Our mirror of squat/generic-device-plugin 0.2.0 (Apache-2.0), copied with
          # `skopeo copy --all --preserve-digests`, so the digest is the upstream
          # index digest: ghcr.io/squat/generic-device-plugin:0.2.0@sha256:66c8d5c2...
          # Bump procedure: README.md in ../arc/ (mirror first, then update here AND
          # in vap.yaml).
          image: ghcr.io/nwlnexus/generic-device-plugin@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --domain=olympus.io
            - --log-level=info
            - --listen=127.0.0.1:8080
            - --device
            - |
              name: kvm
              groups:
                - count: 1
                  paths:
                    - path: /dev/kvm
                      permissions: rw
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: kvm
              mountPath: /dev/kvm
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
