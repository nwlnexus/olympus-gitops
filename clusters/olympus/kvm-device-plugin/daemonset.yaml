# squat/generic-device-plugin advertising the host's /dev/kvm as the extended
# resource `olympus.io/kvm` (nwlnexus/olympus-sdk#390). A pod that requests
# `olympus.io/kvm: 1` gets the /dev/kvm device node (cgroup rw, no mknod) and
# nothing else; it needs no privileges, no hostPath and no capabilities.
#
# Why this plugin: maintained (2026 releases), single static binary from scratch,
# configurable per device with a `count` (smarter-device-manager: last push
# 2025-03, KubeVirt's kvm device plugin: archived).
#
# `count: 1` = at most ONE pod per node holds /dev/kvm at a time. Together with
# `maxRunners: 1` on the scale set this caps KVM CI at one VM job per KVM node,
# enforced by the scheduler even if maxRunners is raised.
#
# Node selection: only nodes labelled `olympus.io/kvm-ci=true` run the plugin, so
# only they advertise the resource (manual label, README.md in ../arc/).
#
# Hardening (the reason it can run with far less than the upstream manifest's
# `privileged: true` + hostPath /dev):
#  - hostPath ONLY for /dev/kvm (CharDevice, read-only; the plugin only stats it)
#    and the kubelet device-plugin directory (needed to create its socket);
#  - uid 0 (the socket directory is root:root 0755) but ALL capabilities
#    dropped, no privilege escalation, read-only root fs, seccomp RuntimeDefault;
#  - no service account token, no ports exposed (default-deny NetworkPolicy);
#  - image pinned by digest.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kvm-device-plugin
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        olympus.io/kvm-ci: "true"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generic-device-plugin
          # squat/generic-device-plugin 0.2.0 (2026-04-14), multi-arch index digest.
          # Bump: resolve the new tag's index digest on ghcr.io and replace it here.
          image: ghcr.io/squat/generic-device-plugin@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --domain=olympus.io
            - --log-level=info
            - --listen=127.0.0.1:8080
            - --device
            - |
              name: kvm
              groups:
                - count: 1
                  paths:
                    - path: /dev/kvm
                      permissions: rw
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: kvm
              mountPath: /dev/kvm
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
