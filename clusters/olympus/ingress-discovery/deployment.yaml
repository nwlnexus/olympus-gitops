apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-discovery
  namespace: ingress-discovery
spec:
  # Single replica to start. Safe to bump to 2 for HA — the controller is
  # leader-elected (coordination.k8s.io Lease `ingress-discovery-leader`), so
  # only the leader publishes; followers stay warm and report healthy.
  replicas: 1
  selector:
    matchLabels:
      app: ingress-discovery
  template:
    metadata:
      labels:
        app: ingress-discovery
    spec:
      serviceAccountName: ingress-discovery
      # arm64 opt-in (olympus-sdk#707): every image in this pod is a multi-arch index with linux/arm64,
      # so it may also run on the Mac VMs (tainted olympus.io/arch=arm64:NoSchedule). No arch
      # preference: requests + LeastAllocated scoring and the descheduler place it.
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingress-discovery
          # Pinned by digest: the multi-arch INDEX digest (linux/amd64 + linux/arm64) of tag 6d4faef
          # (the short olympus-sdk commit sha the workflow pushes), olympus-sdk#707. A tag pin would
          # follow a re-push; the digest cannot. The kubelet picks the entry for the node's arch.
          image: ghcr.io/nwlnexus/ingress-discovery@sha256:dcf85070f6551f4327ae59be842715b4fb75f8323ce87c80642c111c5820c92d
          ports:
            - name: health
              containerPort: 8080
          env:
            # Hermes is a Cloudflare Worker (NOT in-cluster). HERMES_URL is the
            # full GraphQL endpoint — the publisher POSTs the mutation directly
            # to this URL (no path is appended).
            - name: HERMES_URL
              value: "https://api.nwlnexus.net/graphql"
            # Bearer token carrying the `publish:app-launchers` capability.
            # Mounted from the ExternalSecret-managed Secret; never logged.
            - name: HERMES_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingress-discovery-credentials
                  key: hermes-publish-token
            # Leader-election lease lives in THIS namespace (downward API).
            - name: LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Stable per-pod leader identity (downward API → pod name).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEALTH_PORT
              value: "8080"
            # Read by the tracing subscriber (NOT Config::from_env).
            - name: RUST_LOG
              value: "info"
          # GET /healthz → 200 whenever the reconcile loop is alive (followers
          # included — health is NOT gated on leadership).
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: "128Mi"
              cpu: "250m"
