apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.8.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  values:
    installCRDs: true
    # arm64 opt-in (olympus-sdk#707): the image is a multi-arch index with linux/arm64, so this pod may also
    # run on the Mac VMs (taint olympus.io/arch=arm64:NoSchedule). No arch preference: requests,
    # LeastAllocated scoring and the descheduler place it.
    tolerations:
      - key: olympus.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    resources:
      # Requests from 7-day usage (p95 x 1.2), docs/sizing/2026-11-01-requests.md.
      requests:
        cpu: 10m
        memory: 48Mi
    certController:
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
    webhook:
      tolerations:
        - key: olympus.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
