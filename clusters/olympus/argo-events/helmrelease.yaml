apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: argo-events
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-events
      version: "2.4.23"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argo-events
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # EventSources / Sensors for codebase-brain live in the codebase-brain ns;
    # the controller watches all namespaces by default.
    openshift: false
